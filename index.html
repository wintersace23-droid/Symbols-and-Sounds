r.":"Je vais parler au directeur.","Tomorrow I will finish this book.":"Demain, je finirai ce livre.","We will go to Italy.":"Nous irons en Italie.","When you arrive, I will have finished.":"Quand tu arriveras, j'aurai fini.","If I had time, I would talk to him.":"Si j'avais le temps, je lui parlerais.","I would have spoken, but I was afraid.":"J'aurais parlé, mais j'avais peur.","She lives in Lyon.":"Elle habite à Lyon.","You have to finish.":"Il faut que tu finisses.","I want her to speak.":"Je veux qu'elle parle.","I'm glad you came.":"Je suis content que tu sois venu.","You must have finished before noon.":"Il faut que tu aies fini avant midi.","Speak louder!":"Parle plus fort !","Let's go!":"Allons-y !","Don't finish without me.":"Ne finissez pas sans moi.","This book is read by many students.":"Ce livre est lu par beaucoup d'élèves.","French is spoken here.":"Ici, on parle français.","I haven't finished.":"Je n'ai pas fini.","Nobody is coming.":"Personne ne vient.","When are you leaving?":"Quand est-ce que tu pars ?","a small cat":"un petit chat","She is taller than me.":"Elle est plus grande que moi.","She speaks fluently.":"Elle parle couramment.","the cake → the cakes":"le gâteau → les gâteaux","a friend (m → f)":"un ami → une amie","an actor → an actress":"un acteur → une actrice","I'm doing my homework.":"Je fais mes devoirs.","Tomorrow I'm going to Berlin.":"Demain, je vais à Berlin.","I played football.":"J'ai joué au football.","We went home.":"Nous sommes rentrés à la maison.","I was tired yesterday.":"Hier, j'étais fatigué.","He spoke for a long time.":"Il a parlé longtemps.","When I arrived, the train had already left.":"Quand je suis arrivé, le train était déjà parti.","I will work tomorrow.":"Je travaillerai demain.","He's probably ill.":"Il est sûrement malade.","I will have done it by Monday.":"Je l'aurai fait d'ici lundi.","She lives in Berlin.":"Elle habite à Berlin.","Close the door!":"Ferme la porte !","Please speak slowly.":"Parlez lentement, s'il vous plaît.","I would like to travel.":"J'aimerais voyager.","If I had time, I would be happy.":"Si j'avais le temps, je serais content.","Could you help me?":"Pourriez-vous m'aider ?","I would have liked to do that.":"J'aurais aimé faire ça.","He says he is ill.":"Il dit qu'il est malade.","She said she would do it tomorrow.":"Elle a dit qu'elle le ferait demain.","The house is being built.":"La maison est en construction.","The book was written in 1990.":"Le livre a été écrit en 1990.","German is spoken here.":"Ici, on parle allemand.","He says that he's tired (everyday speech).":"Il dit qu'il est fatigué (langage courant).","I don't have a car.":"Je n'ai pas de voiture.","When does the course start?":"Quand commence le cours ?","Why are you learning German?":"Pourquoi apprends-tu l'allemand ?","The house is big.":"La maison est grande.","a big house":"une grande maison","I'm taller than you.":"Je suis plus grand que toi.","He drives fast.":"Il conduit vite.","She sings well.":"Elle chante bien.","I like drinking tea.":"J'aime boire du thé.","the day → the days":"le jour → les jours","the woman → the women":"la femme → les femmes","the (female) teachers":"les professeures","Silent E makes the vowel say its name":"Le E muet fait dire son nom à la voyelle","A final e is not spoken, but it makes the vowel before it long.":"Le e final ne se prononce pas, mais il allonge la voyelle d'avant.","Soft C and soft G":"C doux et G doux","Before e, i or y, c usually sounds like s and g like j. Elsewhere they stay hard.":"Devant e, i ou y, le c se prononce souvent s et le g comme j. Ailleurs, ils restent durs.","Silent letters":"Lettres muettes","Some pairs hide a letter: kn, wr, mb, gh.":"Certaines paires cachent une lettre : kn, wr, mb, gh.","Two vowels together":"Deux voyelles ensemble","Often the first vowel says its name and the second is silent. There are many exceptions.":"Souvent, la première voyelle dit son nom et la seconde est muette. Il y a beaucoup d'exceptions.","The three sounds of -ed":"Les trois sons de -ed","/t/ after voiceless sounds, /d/ after voiced sounds, /ɪd/ after t or d.":"/t/ après les sons sourds, /d/ après les sons sonores, /ɪd/ après t ou d.","The three sounds of plural -s":"Les trois sons du -s du pluriel","/s/ after voiceless sounds, /z/ after voiced sounds, /ɪz/ after s, z, sh, ch.":"/s/ après les sons sourds, /z/ après les sons sonores, /ɪz/ après s, z, sh, ch.","Stress and the schwa":"L'accent et le schwa","Unstressed vowels often weaken to /ə/. Moving the stress can change the word.":"Les voyelles non accentuées s'affaiblissent souvent en /ə/. Déplacer l'accent peut changer le mot.","-tion and -sion":"-tion et -sion","-tion sounds like /ʃən/. -sion is /ʃən/ or /ʒən/.":"-tion se prononce /ʃən/. -sion se dit /ʃən/ ou /ʒən/.","Five pure vowels":"Cinq voyelles pures","a, e, i, o, u always keep the same short, clear sound. They never glide or weaken.":"a, e, i, o, u gardent toujours le même son court et clair. Elles ne glissent et ne s'affaiblissent jamais.","Where the stress goes":"Où tombe l'accent","Words ending in a vowel, n or s stress the second-to-last syllable. Others stress the last. A written accent overrides both.":"Les mots terminés par une voyelle, n ou s sont accentués sur l'avant-dernière syllabe. Les autres, sur la dernière. Un accent écrit l'emporte sur les deux règles.","H is always silent":"Le H est toujours muet","Except in ch, the letter h is never pronounced.":"Sauf dans ch, la lettre h ne se prononce jamais.","B and V sound the same":"B et V se prononcent pareil","Both are /b/ at the start, and soft [β] between vowels.":"Les deux sont /b/ au début et [β] doux entre deux voyelles.","ce, ci and z":"ce, ci et z","/θ/ (like th in think) in most of Spain, /s/ in Latin America and the Canaries.":"/θ/ (comme le th anglais de think) dans presque toute l'Espagne, /s/ en Amérique latine et aux Canaries.","ge, gi and j":"ge, gi et j","A rough throat sound /x/. Add a silent u (gue, gui) to keep the g hard.":"Un son rauque de gorge /x/. Ajoute un u muet (gue, gui) pour garder le g dur.","R and RR":"R et RR","A single r between vowels is a quick tap. rr, and r at the start of a word, is a rolled trill.":"Un seul r entre deux voyelles est un battement rapide. rr, et r en début de mot, est un r roulé.","Diphthongs":"Diphtongues","i and u next to a, e or o join with it into one syllable.":"i et u à côté de a, e ou o forment avec elle une seule syllabe.","Final consonants are usually silent":"Les consonnes finales sont souvent muettes","Most final consonants are dropped. C, R, F and L are often spoken (think “CaReFuL”).":"La plupart des consonnes finales ne se prononcent pas. C, R, F et L se prononcent souvent (pense à « CaReFuL »).","Final -e is silent":"Le -e final est muet","It isn't spoken, but it makes the consonant before it heard.":"Il ne se prononce pas, mais il fait entendre la consonne d'avant.","Liaison":"Liaison","A silent final consonant links to the next word when that word starts with a vowel.":"Une consonne finale muette se lie au mot suivant quand celui-ci commence par une voyelle.","Nasal vowels":"Voyelles nasales","A vowel followed by n or m (at the end, or before another consonant) is said through the nose.":"Une voyelle suivie de n ou m (à la fin, ou devant une autre consonne) se prononce par le nez.","Vowel teams":"Groupes de voyelles","Accents change the sound":"Les accents changent le son","é is /e/, è and ê are /ɛ/. ç is always /s/.":"é se dit /e/, è et ê se disent /ɛ/. ç est toujours /s/.","Even rhythm, last syllable heavier":"Rythme régulier, dernière syllabe plus marquée","Syllables are evenly timed, with a little extra weight on the last one of a phrase.":"Les syllabes ont toutes la même durée, avec un peu plus de poids sur la dernière du groupe.","H is never pronounced":"Le H ne se prononce jamais","Some words have an “h aspiré”, which blocks liaison even though it is silent.":"Certains mots ont un « h aspiré », qui empêche la liaison même s'il est muet.","Say every letter":"Prononce chaque lettre","German is spelled as it sounds. Final -e is spoken, and so is the k in kn.":"L'allemand s'écrit comme il se prononce. Le -e final se prononce, tout comme le k de kn.","Long or short vowel":"Voyelle longue ou courte","A double consonant after a vowel makes it short. h, a double vowel or ie makes it long.":"Une consonne double après une voyelle la rend courte. h, une voyelle double ou ie la rendent longue.","Final devoicing":"Dévoisement final","b, d and g at the end of a word or syllable sound like p, t and k.":"b, d et g à la fin d'un mot ou d'une syllabe se prononcent p, t et k.","ei and ie":"ei et ie","ei is /aɪ/, ie is /iː/. Tip: say the English name of the second letter.":"ei se dit /aɪ/, ie se dit /iː/. Astuce : dis le nom anglais de la deuxième lettre.","The two sounds of ch":"Les deux sons de ch","/x/ (back of the throat) after a, o, u, au. /ç/ (a soft hiss) everywhere else.":"/x/ (au fond de la gorge) après a, o, u, au. /ç/ (un souffle doux) partout ailleurs.","S, sp and st":"S, sp et st","s before a vowel is /z/. sp and st at the start of a word are /ʃp/ and /ʃt/.":"s devant une voyelle se dit /z/. sp et st en début de mot se disent /ʃp/ et /ʃt/.","Stress on the first syllable":"Accent sur la première syllabe","Most words stress the first syllable. The prefixes be-, ge- and ver- are never stressed.":"La plupart des mots sont accentués sur la première syllabe. Les préfixes be-, ge- et ver- ne sont jamais accentués.","Umlauts":"Umlauts","ä is like e in bed. For ö, say e with rounded lips. For ü, say i with rounded lips.":"ä se dit comme è. Pour ö, dis e avec les lèvres arrondies. Pour ü, dis i avec les lèvres arrondies (comme le u français).","W, V and Z":"W, V et Z","w sounds like English v, v like f, and z like ts.":"w se prononce v, v se prononce f et z se prononce ts.","Where the stress falls in English":"Où tombe l'accent en anglais","English has no single fixed rule, so learn each word's stress with the word.":"L'anglais n'a pas de règle fixe : apprends l'accent de chaque mot avec le mot.","Most two-syllable nouns and adjectives stress the first syllable: TA·ble, HAP·py.":"La plupart des noms et adjectifs de deux syllabes sont accentués sur la première : TA·ble, HAP·py.","Most two-syllable verbs stress the second syllable: be·GIN, re·LAX.":"La plupart des verbes de deux syllabes sont accentués sur la seconde : be·GIN, re·LAX.","Words ending in -tion, -sion and -ic stress the syllable just before the ending: in·for·MA·tion.":"Les mots en -tion, -sion et -ic sont accentués juste avant la terminaison : in·for·MA·tion.","Unstressed vowels often weaken to a short “uh” sound /ə/.":"Les voyelles non accentuées s'affaiblissent souvent en un son bref « eu » /ə/.","Where the stress falls in Spanish":"Où tombe l'accent en espagnol","Words ending in a vowel, n or s stress the second-to-last syllable: CA·sa, JO·ven.":"Les mots terminés par une voyelle, n ou s sont accentués sur l'avant-dernière syllabe : CA·sa, JO·ven.","Words ending in any other consonant stress the last syllable: ciu·DAD, ha·BLAR.":"Ceux terminés par une autre consonne sont accentués sur la dernière : ciu·DAD, ha·BLAR.","A written accent overrides both rules and marks the stressed syllable: can·CIÓN, ÁR·bol.":"Un accent écrit l'emporte sur les deux règles et marque la syllabe accentuée : can·CIÓN, ÁR·bol.","Every vowel keeps its full, clear sound, stressed or not.":"Chaque voyelle garde son son plein et clair, accentuée ou non.","Where the stress falls in French":"Où tombe l'accent en français","Every word has its stress on its last spoken syllable: cho·co·LAT.":"Chaque mot est accentué sur sa dernière syllabe prononcée : cho·co·LAT.","A silent final -e doesn't count as a syllable: ba·NANE.":"Un -e final muet ne compte pas comme une syllabe : ba·NANE.","In a sentence, only the last word of each word group gets the stress: je suis é·tu·DIANT.":"Dans une phrase, seul le dernier mot de chaque groupe est accentué : je suis é·tu·DIANT.","All the other syllables are said evenly, with the same length and strength.":"Toutes les autres syllabes se disent de façon égale, avec la même longueur et la même force.","Where the stress falls in German":"Où tombe l'accent en allemand","Most German words stress the first syllable: MOR·gen, WAS·ser.":"La plupart des mots allemands sont accentués sur la première syllabe : MOR·gen, WAS·ser.","The prefixes be-, ge-, er-, ver-, zer- and ent- are never stressed. The stress moves to the next syllable: ver·STE·hen.":"Les préfixes be-, ge-, er-, ver-, zer- et ent- ne sont jamais accentués. L'accent passe à la syllabe suivante : ver·STE·hen.","Separable prefixes like an-, auf- and mit- are stressed: AN·ru·fen.":"Les préfixes séparables comme an-, auf- et mit- sont accentués : AN·ru·fen.","In compound words, the first part gets the stress: FUSS·ball.":"Dans les mots composés, la première partie est accentuée : FUSS·ball.","Many loanwords stress the last syllable: Mu·SIK.":"Beaucoup de mots d'emprunt sont accentués sur la dernière syllabe : Mu·SIK.","Habits, facts and routines.":"Habitudes, faits et routines.","Actions happening now or around now, and fixed plans for the future.":"Actions en cours maintenant ou en ce moment, et projets fixés pour le futur.","Past actions connected to now: experiences, recent results, and situations that are still true.":"Actions passées liées au présent : expériences, résultats récents et situations encore vraies.","An action that started in the past and is still going on, often with for or since.":"Une action qui a commencé dans le passé et continue, souvent avec for ou since.","Finished actions at a definite time in the past.":"Actions terminées à un moment précis du passé.","An action in progress at a moment in the past, often interrupted by another action.":"Une action en cours à un moment du passé, souvent interrompue par une autre.","An action that happened before another past action.":"Une action qui s'est produite avant une autre action passée.","A longer action that continued up to a moment in the past.":"Une action longue qui a duré jusqu'à un moment du passé.","Predictions, promises, offers and decisions made at the moment of speaking.":"Prédictions, promesses, offres et décisions prises au moment où l'on parle.","Plans and intentions, and predictions based on what you can see now.":"Projets et intentions, et prédictions fondées sur ce que l'on voit maintenant.","An action that will be in progress at a time in the future.":"Une action qui sera en cours à un moment du futur.","An action that will be finished before a time in the future.":"Une action qui sera terminée avant un moment du futur.","How long an action will have continued by a time in the future.":"Combien de temps une action aura duré à un moment du futur.","The normal mood for facts and questions. All the tenses above are in the indicative.":"Le mode habituel pour les faits et les questions. Tous les temps ci-dessus sont à l'indicatif.","Orders, instructions, advice and invitations. There is no subject.":"Ordres, consignes, conseils et invitations. Il n'y a pas de sujet.","Imagined situations and polite requests, often with if.":"Situations imaginées et demandes polies, souvent avec if.","What would have happened in the past, but didn't.":"Ce qui se serait passé, mais ne s'est pas passé.","Formal demands and recommendations after verbs like suggest, insist and recommend. The verb stays in the base form for every person.":"Exigences et recommandations formelles après des verbes comme suggest, insist et recommend. Le verbe reste à la forme de base pour toutes les personnes.","Unreal or imagined situations after if and wish. With be, use were for every person.":"Situations irréelles ou imaginées après if et wish. Avec be, on utilise were à toutes les personnes.","Use the passive when the action matters more than who does it. The object of the active sentence becomes the subject.":"Utilise le passif quand l'action compte plus que celui qui la fait. Le complément de la phrase active devient le sujet.","When you report what someone said, the tense usually moves one step back, and pronouns and time words change.":"Quand on rapporte ce que quelqu'un a dit, le temps recule généralement d'un cran, et les pronoms et les mots de temps changent.","Add not after the auxiliary verb (be, have, will, can…). If there is no auxiliary, use do / does / did + not.":"Ajoute not après l'auxiliaire (be, have, will, can…). S'il n'y a pas d'auxiliaire, utilise do / does / did + not.","Put the auxiliary before the subject. With no auxiliary, use do / does / did. Question words come first.":"Place l'auxiliaire devant le sujet. Sans auxiliaire, utilise do / does / did. Les mots interrogatifs viennent en premier.","Adjectives never change for gender or number. They go before the noun or after be. Short adjectives add -er / -est to compare; long ones use more / most.":"Les adjectifs ne changent jamais en genre ni en nombre. Ils se placent devant le nom ou après be. Les adjectifs courts prennent -er / -est pour comparer ; les longs utilisent more / most.","Adverbs say how, when or how often. Most are made by adding -ly to the adjective.":"Les adverbes disent comment, quand ou à quelle fréquence. La plupart se forment en ajoutant -ly à l'adjectif.","Most nouns add -s. The spelling changes after some endings, and a few common nouns are irregular.":"La plupart des noms prennent -s. L'orthographe change après certaines terminaisons, et quelques noms courants sont irréguliers.","English nouns have no grammatical gender, and most job words are used for everyone (teacher, doctor, actor). A few words still have separate female forms.":"Les noms anglais n'ont pas de genre grammatical, et la plupart des noms de métiers s'emploient pour tout le monde (teacher, doctor, actor). Quelques mots ont encore une forme féminine à part.","Habits, facts, what is happening now, and the near future.":"Habitudes, faits, ce qui se passe maintenant et le futur proche.","An action happening right now.":"Une action en train de se dérouler maintenant.","Past actions connected to the present, often with hoy, este año, ya or nunca.":"Actions passées liées au présent, souvent avec hoy, este año, ya ou nunca.","Finished actions at a specific time in the past.":"Actions terminées à un moment précis du passé.","Past habits, descriptions, and actions in progress in the past.":"Habitudes passées, descriptions et actions en cours dans le passé.","An action that was in progress at a moment in the past.":"Une action qui était en cours à un moment du passé.","A literary tense for an action just before another past action, mostly after cuando, en cuanto or apenas. In speech, the pluscuamperfecto or the indefinido is used instead.":"Un temps littéraire pour une action juste avant une autre action passée, surtout après cuando, en cuanto ou apenas. À l'oral, on emploie le pluscuamperfecto ou l'indefinido.","Plans and things that are about to happen.":"Projets et choses sur le point d'arriver.","Future actions, predictions, and guesses about the present.":"Actions futures, prédictions et suppositions sur le présent.","An action that will be finished by a time in the future.":"Une action qui sera terminée à un moment du futur.","Hypothetical situations, polite requests and advice.":"Situations hypothétiques, demandes polies et conseils.","What would have happened, but didn't.":"Ce qui se serait passé, mais ne s'est pas passé.","The mood for facts and certainty. All the tenses above are in the indicative.":"Le mode des faits et de la certitude. Tous les temps ci-dessus sont à l'indicatif.","Wishes, doubts, emotions and requests, usually after que.":"Souhaits, doutes, émotions et demandes, généralement après que.","Like the pretérito perfecto, but after expressions that need the subjunctive.":"Comme le pretérito perfecto, mais après des expressions qui demandent le subjonctif.","Past wishes, and unreal conditions with si.":"Souhaits passés et conditions irréelles avec si.","Unreal situations in the past, often with si.":"Situations irréelles dans le passé, souvent avec si.","Orders, instructions and invitations. Negative orders use the subjunctive: no hables.":"Ordres, consignes et invitations. Les ordres négatifs utilisent le subjonctif : no hables.","Use ser + participio. The participle agrees with the subject. In everyday Spanish, the pasiva refleja with se is more common.":"On utilise ser + participio. Le participe s'accorde avec le sujet. Dans l'espagnol courant, la pasiva refleja avec se est plus fréquente.","After a past reporting verb (dijo, preguntó), the tense moves back, and pronouns and time words change.":"Après un verbe introducteur au passé (dijo, preguntó), le temps recule, et les pronoms et les mots de temps changent.","Put no before the verb, and before any object pronouns. Spanish uses double negatives: no + verb + nada, nadie or nunca.":"Place no devant le verbe et devant les pronoms compléments. L'espagnol utilise la double négation : no + verbe + nada, nadie ou nunca.","Questions start with ¿ and end with ?. For yes/no questions, the word order can stay the same and your voice rises at the end. Question words always have an accent.":"Les questions commencent par ¿ et finissent par ?. Pour les questions fermées, l'ordre des mots peut rester le même et la voix monte à la fin. Les mots interrogatifs portent toujours un accent.","Adjectives agree with the noun in gender and number, and usually go after it.":"Les adjectifs s'accordent avec le nom en genre et en nombre, et se placent généralement après.","Many adverbs are made by adding -mente to the feminine form of the adjective. A written accent on the adjective stays.":"Beaucoup d'adverbes se forment en ajoutant -mente au féminin de l'adjectif. L'accent écrit de l'adjectif reste.","Add -s after a vowel and -es after a consonant. Watch the spelling and the written accents.":"Ajoute -s après une voyelle et -es après une consonne. Attention à l'orthographe et aux accents écrits.","Nouns for people and many animals change for gender, and so does the article.":"Les noms de personnes et de beaucoup d'animaux changent selon le genre, tout comme l'article.","Habits, facts and what is happening now.":"Habitudes, faits et ce qui se passe maintenant.","To stress that an action is happening right now.":"Pour insister sur le fait qu'une action est en cours.","Finished actions in the past. It's the main past tense in speech.":"Actions terminées dans le passé. C'est le principal temps du passé à l'oral.","Something that has only just happened.":"Quelque chose qui vient tout juste de se passer.","The literary past tense. You'll read it in books, but you don't need to speak it.":"Le passé littéraire. Tu le liras dans les livres, mais tu n'as pas besoin de le parler.","A literary tense for an action just before another action in the passé simple, mostly after quand or dès que.":"Un temps littéraire pour une action juste avant une autre au passé simple, surtout après quand ou dès que.","Future actions and predictions.":"Actions futures et prédictions.","An action that will be finished before a moment in the future.":"Une action qui sera terminée avant un moment du futur.","The mood for facts and certainty. The present, past and future tenses above are all in the indicative.":"Le mode des faits et de la certitude. Les temps du présent, du passé et du futur ci-dessus sont tous à l'indicatif.","After expressions of wish, necessity, emotion and doubt followed by que.":"Après les expressions de souhait, de nécessité, d'émotion et de doute suivies de que.","A finished action after expressions that need the subjunctive.":"Une action terminée après les expressions qui demandent le subjonctif.","Orders and instructions. Only tu, nous and vous, without the pronoun. -er verbs drop the -s in the tu form.":"Ordres et consignes. Seulement tu, nous et vous, sans le pronom. Les verbes en -er perdent le -s à la forme tu.","Use être in the tense you need + participe passé. The participle agrees with the subject, and the agent is introduced with par. In speech, French often uses on instead.":"On utilise être au temps voulu + participe passé. Le participe s'accorde avec le sujet et le complément d'agent est introduit par par. À l'oral, on emploie souvent on à la place.","After a past reporting verb (il a dit, elle a demandé), the tense moves back, and pronouns and time words change.":"Après un verbe introducteur au passé (il a dit, elle a demandé), le temps recule, et les pronoms et les mots de temps changent.","Put ne … pas around the conjugated verb (ne → n' before a vowel). In compound tenses, it goes around the auxiliary. In everyday speech, ne is often dropped.":"Place ne … pas autour du verbe conjugué (ne → n' devant une voyelle). Aux temps composés, la négation entoure l'auxiliaire. À l'oral, ne est souvent omis.","There are three ways to ask: rising intonation (informal), est-ce que (neutral), or swapping the verb and subject (formal).":"Il y a trois façons de poser une question : l'intonation montante (familier), est-ce que (neutre) ou l'inversion du verbe et du sujet (soutenu).","Adjectives agree in gender and number, and usually go after the noun. A few common ones go before it: beau, bon, grand, petit, jeune, vieux, nouveau.":"Les adjectifs s'accordent en genre et en nombre et se placent généralement après le nom. Quelques adjectifs courants se placent devant : beau, bon, grand, petit, jeune, vieux, nouveau.","Add -ment to the feminine adjective. If the adjective ends in a vowel, use the masculine. -ant and -ent become -amment and -emment.":"Ajoute -ment à l'adjectif au féminin. Si l'adjectif finit par une voyelle, utilise le masculin. -ant et -ent deviennent -amment et -emment.","Most nouns add -s, which isn't pronounced. The article (les, des) tells the listener it's plural.":"La plupart des noms prennent un -s qui ne se prononce pas. C'est l'article (les, des) qui indique le pluriel à l'oral.","Nouns for people and many adjectives change for gender. Usually you add -e, but some endings change.":"Les noms de personnes et beaucoup d'adjectifs changent selon le genre. En général on ajoute -e, mais certaines terminaisons changent.","The present, habits and facts. With a time word, it's also used for the future.":"Le présent, les habitudes et les faits. Avec un mot de temps, il s'emploie aussi pour le futur.","The main past tense in speech.":"Le principal temps du passé à l'oral.","The past tense of written German and stories. In speech, it's used mainly with sein, haben and modal verbs.":"Le passé de l'allemand écrit et des récits. À l'oral, il s'emploie surtout avec sein, haben et les verbes de modalité.","Future plans, predictions and assumptions.":"Projets, prédictions et suppositions.","An action that will be finished in the future, or a guess about the past.":"Une action qui sera terminée dans le futur, ou une supposition sur le passé.","Orders and requests. The du form has no -st and often drops the -e. Verbs with e → i keep the i: sprich!":"Ordres et demandes. La forme du n'a pas de -st et perd souvent le -e. Les verbes en e → i gardent le i : sprich !","Wishes, unreal situations and polite requests. Most verbs use würde + infinitive; sein, haben and modal verbs have their own forms.":"Souhaits, situations irréelles et demandes polies. La plupart des verbes utilisent würde + infinitif ; sein, haben et les verbes de modalité ont leurs propres formes.","Unreal situations and regrets about the past.":"Situations irréelles et regrets concernant le passé.","Used for reported speech, mainly in the news and in formal writing.":"S'emploie pour le discours indirect, surtout dans les informations et les écrits formels.","Use werden + Partizip II. The agent is introduced with von.":"On utilise werden + Partizip II. Le complément d'agent est introduit par von.","Formal German uses Konjunktiv I. If that looks the same as the normal present, use Konjunktiv II. In everyday speech, most people use dass with the normal verb.":"L'allemand soutenu utilise le Konjunktiv I. S'il ressemble au présent normal, on utilise le Konjunktiv II. À l'oral, la plupart des gens utilisent dass avec le verbe normal.","nicht negates verbs, adjectives and whole sentences. kein negates nouns that would have ein or no article, and it takes the same endings as ein.":"nicht nie les verbes, les adjectifs et les phrases entières. kein nie les noms qui auraient ein ou pas d'article, et prend les mêmes terminaisons que ein.","Yes/no questions start with the verb. W-questions start with the question word, and the verb comes second.":"Les questions fermées commencent par le verbe. Les questions en W commencent par le mot interrogatif, et le verbe vient en deuxième position.","After sein, adjectives don't change. Before a noun, they take an ending that depends on the gender, the case and the article. This table shows the endings after der, die, das.":"Après sein, les adjectifs ne changent pas. Devant un nom, ils prennent une terminaison qui dépend du genre, du cas et de l'article. Ce tableau montre les terminaisons après der, die, das.","Most adjectives can be used as adverbs without any change. Some common adverbs, like gern and oft, are words of their own.":"La plupart des adjectifs peuvent servir d'adverbes sans changement. Certains adverbes courants, comme gern et oft, sont des mots à part.","German plurals should be learned with each noun, but there are patterns. The plural article is always die.":"Les pluriels allemands s'apprennent avec chaque nom, mais il existe des modèles. L'article au pluriel est toujours die.","Most nouns for people add -in, and the article becomes die. The plural ends in -innen.":"La plupart des noms de personnes prennent -in, et l'article devient die. Le pluriel se termine en -innen.","base verb · add -s or -es for he, she, it":"verbe de base · ajoute -s ou -es pour he, she, it","am / is / are + verb-ing":"am / is / are + verbe-ing","have / has + past participle":"have / has + participe passé","have / has been + verb-ing":"have / has been + verbe-ing","verb + -ed (regular) · past form (irregular: go → went)":"verbe + -ed (régulier) · forme du passé (irrégulier : go → went)","was / were + verb-ing":"was / were + verbe-ing","had + past participle":"had + participe passé","had been + verb-ing":"had been + verbe-ing","will + base verb":"will + verbe de base","am / is / are going to + base verb":"am / is / are going to + verbe de base","will be + verb-ing":"will be + verbe-ing","will have + past participle":"will have + participe passé","will have been + verb-ing":"will have been + verbe-ing","any tense above":"n'importe quel temps ci-dessus","base verb · don't + base verb · let's + base verb":"verbe de base · don't + verbe de base · let's + verbe de base","would + base verb":"would + verbe de base","would have + past participle":"would have + participe passé","(that) + subject + base verb":"(that) + sujet + verbe de base","if / wish + subject + past form (be → were)":"if / wish + sujet + forme du passé (be → were)","be (in any tense) + past participle (+ by …)":"be (à n'importe quel temps) + participe passé (+ by …)","say (that) … · tell someone (that) … · ask if / whether …":"say (that) … · tell someone (that) … · ask if / whether …","do / does / did + not + base verb · auxiliary + not":"do / does / did + not + verbe de base · auxiliaire + not","(question word) + auxiliary + subject + verb?":"(mot interrogatif) + auxiliaire + sujet + verbe ?","short: -er / -est · long: more / most · irregular: good, bad, far":"courts : -er / -est · longs : more / most · irréguliers : good, bad, far","adjective + -ly · y → -ily · -le → -ly":"adjectif + -ly · y → -ily · -le → -ly","mostly no change · a few use -ess or a different word":"en général pas de changement · quelques-uns utilisent -ess ou un autre mot","-ar verbs take e endings, p the e) + -ai, -as, -a, -ons, -ez, -ont":"infinitif (les verbes en -re perdent le e) + -ai, -as, -a, -ons, -ez, -ont","avoir or être (futur) + participe passé":"avoir ou être (futur) + participe passé","future stem + -ais, -ais, -ait, -ions, -iez, -aient":"radical du futur + -ais, -ais, -ait, -ions, -iez, -aient","avoir or être (conditionnel) + participe passé":"avoir ou être (conditionnel) + participe passé","ils-form stem (ils parl-ent) + -e, -es, -e, -ions, -iez, -ent":"radical de la forme ils (ils parl-ent) + -e, -es, -e, -ions, -iez, -ent","avoir or être (subjonctif) + participe passé":"avoir ou être (subjonctif) + participe passé","present tense of tu, nous, vous without the pronoun":"présent de tu, nous, vous sans le pronom","dire que … · demander si … · dire de + infinitive":"dire que … · demander si … · dire de + infinitif","ne + verb + pas / plus / jamais / rien · personne ne …":"ne + verbe + pas / plus / jamais / rien · personne ne …","intonation · est-ce que + statement · verb-subject inversion":"intonation · est-ce que + phrase affirmative · inversion verbe-sujet","+ -e for feminine · + -s for plural · special endings below":"+ -e au féminin · + -s au pluriel · terminaisons particulières ci-dessous","feminine adjective + -ment":"adjectif au féminin + -ment","stem + -e, -st, -t, -en, -t, -en":"radical + -e, -st, -t, -en, -t, -en","haben or sein (present) + Partizip II at the end · verbs of movement and change use sein":"haben ou sein (présent) + Partizip II à la fin · les verbes de mouvement et de changement prennent sein","regular: stem + -te, -test, -te, -ten, -tet, -ten · irregular verbs change the vowel":"réguliers : radical + -te, -test, -te, -ten, -tet, -ten · les irréguliers changent de voyelle","hatte or war + Partizip II":"hatte ou war + Partizip II","werden + infinitive at the end":"werden + infinitif à la fin","du: stem (+ e) · ihr: like the present · Sie: infinitive + Sie":"du : radical (+ e) · ihr : comme le présent · Sie : infinitif + Sie","würde + infinitive · wäre, hätte, könnte …":"würde + infinitif · wäre, hätte, könnte …","hätte or wäre + Partizip II":"hätte ou wäre + Partizip II","stem + -e, -est, -e, -en, -et, -en · sein: sei":"radical + -e, -est, -e, -en, -et, -en · sein : sei","werden (any tense) + Partizip II":"werden (à n'importe quel temps) + Partizip II","verb + subject …? · W-word + verb + subject …?":"verbe + sujet … ? · mot en W + verbe + sujet … ?","after sein: no ending · before a noun: -e or -en (after der / die / das)":"après sein : pas de terminaison · devant un nom : -e ou -en (après der / die / das)","adjective = adverb (no ending)":"adjectif = adverbe (sans terminaison)","no ending · -e · -er · -en / -n · -s · often with an umlaut":"pas de terminaison · -e · -er · -en / -n · -s · souvent avec un umlaut","+ -in · plural: -innen":"+ -in · pluriel : -innen","Habits and routines":"Habitudes et routines","General truths":"Vérités générales","Facts":"Faits","Timetables and schedules":"Horaires et emplois du temps","Actions happening now":"Actions en cours","Temporary situations":"Situations temporaires","Fixed future plans":"Projets futurs fixés","Changing situations":"Situations qui évoluent","Life experiences":"Expériences de vie","Recent actions with a result now":"Actions récentes avec un résultat présent","Situations that are still true":"Situations encore vraies","Unfinished time: today, this week":"Période pas terminée : aujourd'hui, cette semaine","Actions still going on":"Actions qui continuent","How long something has lasted":"Depuis combien de temps quelque chose dure","Recent activities with visible results":"Activités récentes aux résultats visibles","Finished past actions":"Actions passées terminées","Past habits":"Habitudes passées","A series of past events":"Une suite d'événements passés","Stories":"Récits","Actions in progress in the past":"Actions en cours dans le passé","The background to a story":"Le décor d'une histoire","An action that was interrupted":"Une act e pas terminée : hoy, este año","Recent actions":"Actions récentes","Finished actions at a specific time":"Actions terminées à un moment précis","Completed periods":"Périodes terminées","Descriptions in the past":"Descriptions au passé","Age and time in the past":"L'âge et l'heure au passé","Actions in progress at a past moment":"Actions en cours à un moment passé","Reported past events":"Événements passés rapportés","An action just before another past action":"Une action juste avant une autre action passée","Literary texts":"Textes littéraires","Things about to happen":"Choses sur le point d'arriver","Future actions":"Actions futures","Guesses about the present":"Suppositions sur le présent","Actions in progress at a future moment":"Actions en cours à un moment futur","Guesses about what's happening now":"Suppositions sur ce qui se passe maintenant","Actions finished by a future time":"Actions terminées à un moment futur","Guesses about the recent past":"Suppositions sur le passé récent","Hypothetical situations":"Situations hypothétiques","The future seen from the past":"Le futur vu du passé","What would have happened":"Ce qui se serait passé","Guesses about the past":"Suppositions sur le passé","Doubts":"Doutes","Emotions":"Émotions","Requests after que":"Demandes après que","Wishes about finished actions":"Souhaits sur des actions terminées","Doubts about the recent past":"Doutes sur le passé récent","Unreal conditions with si":"Conditions irréelles avec si","Past wishes":"Souhaits passés","Polite requests: quisiera…":"Demandes polies : quisiera…","Unreal past conditions":"Conditions passées irréelles","Regrets about the past":"Regrets sur le passé","The near future":"Le futur proche","Stressing that something is ongoing":"Insister sur une action en cours","Experiences":"Expériences","Actions that have just happened":"Actions qui viennent de se passer","Descriptions":"Descriptions","Regrets with si":"Regrets avec si","Finished actions in literature":"Actions terminées dans la littérature","Historical texts":"Textes historiques","Actions finished before a future moment":"Actions terminées avant un moment futur","Reproaches":"Reproches","Necessity: il faut que…":"Nécessité : il faut que…","Doubt":"Doute","Finished actions after que":"Actions terminées après que","Feelings about the past":"Sentiments sur le passé","The future, with a time word":"Le futur, avec un mot de temps","The past in everyday speech":"Le passé à l'oral","The past in writing and stories":"Le passé à l'écrit et dans les récits","sein, haben and modal verbs in speech":"sein, haben et les verbes de modalité à l'oral","The background to a past story":"Le décor d'une histoire passée","Assumptions about the present":"Suppositions sur le présent","Assumptions about the past":"Suppositions sur le passé","Requests":"Demandes","Unreal past situations":"Situations passées irréelles","News and formal writing":"Informations et écrits formels","Choose the passive: “They clean the room every day.”|The room is cleaned every day.|The room cleans every day.|The room is cleaning every day.|The room was clean every day.":"Choisis le passif : « They clean the room every day. »|The room is cleaned every day.|The room cleans every day.|The room is cleaning every day.|The room was clean every day.","Choose the passive: “Someone stole my bike.”|My bike was stolen.|My bike has stolen.|My bike was stole.|My bike is stealing.":"Choisis le passif : « Someone stole my bike. »|My bike was stolen.|My bike has stolen.|My bike was stole.|My bike is stealing.","Which sentence is passive?|The cake was eaten by the children.|The children ate the cake.|The children are eating the cake.|The cake looks delicious.":"Quelle phrase est au passif ?|The cake was eaten by the children.|The children ate the cake.|The children are eating the cake.|The cake looks delicious.","In a passive sentence, the person who does the action is introduced with…|by|from|of|with":"Dans une phrase passive, la personne qui fait l'action est introduite par…|by|from|of|with","In reported speech, “tomorrow” usually becomes…|the next day|yesterday|the day before|today":"Au discours indirect, « tomorrow » devient généralement…|the next day|yesterday|the day before|today","Make it negative: “I like coffee.”|I don't like coffee.|I not like coffee.|I doesn't like coffee.|I no like coffee.":"Mets à la forme négative : « I like coffee. »|I don't like coffee.|I not like coffee.|I doesn't like coffee.|I no like coffee.","Make it negative: “She works here.”|She doesn't work here.|She don't work here.|She doesn't works here.|She not works here.":"Mets à la forme négative : « She works here. »|She doesn't work here.|She don't work here.|She doesn't works here.|She not works here.","Make it negative: “They went out.”|They didn't go out.|They didn't went out.|They don't went out.|They not went out.":"Mets à la forme négative : « They went out. »|They didn't go out.|They didn't went out.|They don't went out.|They not went out.","Make it negative: “He is happy.”|He isn't happy.|He doesn't happy.|He don't is happy.|He not is happy.":"Mets à la forme négative : « He is happy. »|He isn't happy.|He doesn't happy.|He don't is happy.|He not is happy.","Make it negative: “We have finished.”|We haven't finished.|We don't have finished.|We didn't finished.|We not have finished.":"Mets à la forme négative : « We have finished. »|We haven't finished.|We don't have finished.|We didn't finished.|We not have finished.","Make it negative: “I will come.”|I won't come.|I willn't come.|I don't will come.|I will no come.":"Mets à la forme négative : « I will come. »|I won't come.|I willn't come.|I don't will come.|I will no come.","Make it negative: “You can swim.”|You can't swim.|You don't can swim.|You can no swim.|You doesn't can swim.":"Mets à la forme négative : « You can swim. »|You can't swim.|You don't can swim.|You can no swim.|You doesn't can swim.","Choose the correct sentence.|I never eat meat.|I don't ne vor lang.","Soft C and soft G":"Weiches C und weiches G","Before e, i or y, c usually sounds like s and g like j. Elsewhere they stay hard.":"Vor e, i oder y klingt c meist wie s und g wie dsch. Sonst bleiben sie hart.","Silent letters":"Stumme Buchstaben","Some pairs hide a letter: kn, wr, mb, gh.":"Manche Paare verstecken einen Buchstaben: kn, wr, mb, gh.","Two vowels together":"Zwei Vokale zusammen","Often the first vowel says its name and the second is silent. There are many exceptions.":"Oft klingt der erste Vokal wie sein Name und der zweite ist stumm. Es gibt viele Ausnahmen.","The three sounds of -ed":"Die drei Laute von -ed","/t/ after voiceless sounds, /d/ after voiced sounds, /ɪd/ after t or d.":"/t/ nach stimmlosen Lauten, /d/ nach stimmhaften Lauten, /ɪd/ nach t oder d.","The three sounds of plural -s":"Die drei Laute des Plural-s","/s/ after voiceless sounds, /z/ after voiced sounds, /ɪz/ after s, z, sh, ch.":"/s/ nach stimmlosen Lauten, /z/ nach stimmhaften Lauten, /ɪz/ nach s, z, sh, ch.","Stress and the schwa":"Betonung und Schwa","Unstressed vowels often weaken to /ə/. Moving the stress can change the word.":"Unbetonte Vokale werden oft zu /ə/ abgeschwächt. Eine andere Betonung kann das Wort verändern.","-tion and -sion":"-tion und -sion","-tion sounds like /ʃən/. -sion is /ʃən/ or /ʒən/.":"-tion klingt wie /ʃən/. -sion ist /ʃən/ oder /ʒən/.","Five pure vowels":"Fünf reine Vokale","a, e, i, o, u always keep the same short, clear sound. They never glide or weaken.":"a, e, i, o, u behalten immer denselben kurzen, klaren Klang. Sie gleiten nie und werden nie schwächer.","Where the stress goes":"Wo die Betonung liegt","Words ending in a vowel, n or s stress the second-to-last syllable. Others stress the last. A written accent overrides both.":"Wörter auf Vokal, n oder s werden auf der vorletzten Silbe betont, die anderen auf der letzten. Ein geschriebener Akzent hat Vorrang.","H is always silent":"Das H ist immer stumm","Except in ch, the letter h is never pronounced.":"Außer in ch wird das h nie gesprochen.","B and V sound the same":"B und V klingen gleich","Both are /b/ at the start, and soft [β] between vowels.":"Beide sind am Anfang /b/ und zwischen Vokalen ein weiches [β].","ce, ci and z":"ce, ci und z","/θ/ (like th in think) in most of Spain, /s/ in Latin America and the Canaries.":"/θ/ (wie th im englischen think) in fast ganz Spanien, /s/ in Lateinamerika und auf den Kanaren.","ge, gi and j":"ge, gi und j","A rough throat sound /x/. Add a silent u (gue, gui) to keep the g hard.":"Ein rauer Kehllaut /x/. Ein stummes u (gue, gui) hält das g hart.","R and RR":"R und RR","A single r between vowels is a quick tap. rr, and r at the start of a word, is a rolled trill.":"Ein einzelnes r zwischen Vokalen ist ein kurzer Schlag. rr und r am Wortanfang werden gerollt.","Diphthongs":"Diphthonge","i and u next to a, e or o join with it into one syllable.":"i und u neben a, e oder o verbinden sich mit ihm zu einer Silbe.","Final consonants are usually silent":"Endkonsonanten sind meist stumm","Most final consonants are dropped. C, R, F and L are often spoken (think “CaReFuL”).":"Die meisten Endkonsonanten fallen weg. C, R, F und L werden oft gesprochen (Merkwort „CaReFuL“).","Final -e is silent":"Das -e am Ende ist stumm","It isn't spoken, but it makes the consonant before it heard.":"Es wird nicht gesprochen, macht aber den Konsonanten davor hörbar.","Liaison":"Liaison (Bindung)","A silent final consonant links to the next word when that word starts with a vowel.":"Ein stummer Endkonsonant wird mit dem nächsten Wort verbunden, wenn dieses mit einem Vokal beginnt.","Nasal vowels":"Nasalvokale","A vowel followed by n or m (at the end, or before another consonant) is said through the nose.":"Ein Vokal mit folgendem n oder m (am Ende oder vor einem weiteren Konsonanten) wird durch die Nase gesprochen.","Vowel teams":"Vokalgruppen","Accents change the sound":"Akzente verändern den Klang","é is /e/, è and ê are /ɛ/. ç is always /s/.":"é ist /e/, è und ê sind /ɛ/. ç ist immer /s/.","Even rhythm, last syllable heavier":"Gleichmäßiger Rhythmus, letzte Silbe stärker","Syllables are evenly timed, with a little extra weight on the last one of a phrase.":"Die Silben sind gleich lang, die letzte einer Wortgruppe bekommt etwas mehr Gewicht.","H is never pronounced":"Das H wird nie gesprochen","Some words have an “h aspiré”, which blocks liaison even though it is silent.":"Manche Wörter haben ein „h aspiré“, das die Bindung verhindert, obwohl es stumm ist.","Say every letter":"Sprich jeden Buchstaben","German is spelled as it sounds. Final -e is spoken, and so is the k in kn.":"Deutsch wird geschrieben, wie es klingt. Das -e am Ende wird gesprochen, ebenso das k in kn.","Long or short vowel":"Langer oder kurzer Vokal","A double consonant after a vowel makes it short. h, a double vowel or ie makes it long.":"Ein Doppelkonsonant nach einem Vokal macht ihn kurz. h, ein Doppelvokal oder ie machen ihn lang.","Final devoicing":"Auslautverhärtung","b, d and g at the end of a word or syllable sound like p, t and k.":"b, d und g am Wort- oder Silbenende klingen wie p, t und k.","ei and ie":"ei und ie","ei is /aɪ/, ie is /iː/. Tip: say the English name of the second letter.":"ei ist /aɪ/, ie ist /iː/. Tipp: Sprich den Namen des zweiten Buchstabens wie im Englischen.","The two sounds of ch":"Die zwei Laute von ch","/x/ (back of the throat) after a, o, u, au. /ç/ (a soft hiss) everywhere else.":"/x/ (hinten im Rachen) nach a, o, u, au. /ç/ (ein weiches Zischen) überall sonst.","S, sp and st":"S, sp und st","s before a vowel is /z/. sp and st at the start of a word are /ʃp/ and /ʃt/.":"s vor einem Vokal ist /z/. sp und st am Wortanfang sind /ʃp/ und /ʃt/.","Stress on the first syllable":"Betonung auf der ersten Silbe","Most words stress the first syllable. The prefixes be-, ge- and ver- are never stressed.":"Die meisten Wörter werden auf der ersten Silbe betont. Die Vorsilben be-, ge- und ver- sind nie betont.","Umlauts":"Umlaute","ä is like e in bed. For ö, say e with rounded lips. For ü, say i with rounded lips.":"ä klingt wie ein offenes e. Für ö sprich e mit gerundeten Lippen. Für ü sprich i mit gerundeten Lippen.","W, V and Z":"W, V und Z","w sounds like English v, v like f, and z like ts.":"w klingt wie das englische v, v wie f und z wie ts.","Where the stress falls in English":"Wo die Betonung im Englischen liegt","English has no single fixed rule, so learn each word's stress with the word.":"Im Englischen gibt es keine feste Regel, lerne die Betonung also mit jedem Wort.","Most two-syllable nouns and adjectives stress the first syllable: TA·ble, HAP·py.":"Die meisten zweisilbigen Nomen und Adjektive werden auf der ersten Silbe betont: TA·ble, HAP·py.","Most two-syllable verbs stress the second syllable: be·GIN, re·LAX.":"Die meisten zweisilbigen Verben werden auf der zweiten Silbe betont: be·GIN, re·LAX.","Words ending in -tion, -sion and -ic stress the syllable just before the ending: in·for·MA·tion.":"Wörter auf -tion, -sion und -ic werden direkt vor der Endung betont: in·for·MA·tion.","Unstressed vowels often weaken to a short “uh” sound /ə/.":"Unbetonte Vokale werden oft zu einem kurzen „ö“-ähnlichen Laut /ə/.","Where the stress falls in Spanish":"Wo die Betonung im Spanischen liegt","Words ending in a vowel, n or s stress the second-to-last syllable: CA·sa, JO·ven.":"Wörter auf Vokal, n oder s werden auf der vorletzten Silbe betont: CA·sa, JO·ven.","Words ending in any other consonant stress the last syllable: ciu·DAD, ha·BLAR.":"Wörter auf einen anderen Konsonanten werden auf der letzten Silbe betont: ciu·DAD, ha·BLAR.","A written accent overrides both rules and marks the stressed syllable: can·CIÓN, ÁR·bol.":"Ein geschriebener Akzent hat Vorrang und markiert die betonte Silbe: can·CIÓN, ÁR·bol.","Every vowel keeps its full, clear sound, stressed or not.":"Jeder Vokal behält seinen vollen, klaren Klang, ob betont oder nicht.","Where the stress falls in French":"Wo die Betonung im Französischen liegt","Every word has its stress on its last spoken syllable: cho·co·LAT.":"Jedes Wort wird auf der letzten gesprochenen Silbe betont: cho·co·LAT.","A silent final -e doesn't count as a syllable: ba·NANE.":"Ein stummes -e am Ende zählt nicht als Silbe: ba·NANE.","In a sentence, only the last word of each word group gets the stress: je suis é·tu·DIANT.":"Im Satz wird nur das letzte Wort jeder Wortgruppe betont: je suis é·tu·DIANT.","All the other syllables are said evenly, with the same length and strength.":"Alle anderen Silben werden gleichmäßig gesprochen, gleich lang und gleich stark.","Where the stress falls in German":"Wo die Betonung im Deutschen liegt","Most German words stress the first syllable: MOR·gen, WAS·ser.":"Die meisten deutschen Wörter werden auf der ersten Silbe betont: MOR·gen, WAS·ser.","The prefixes be-, ge-, er-, ver-, zer- and ent- are never stressed. The stress moves to the next syllable: ver·STE·hen.":"Die Vorsilben be-, ge-, er-, ver-, zer- und ent- sind nie betont. Die Betonung geht auf die nächste Silbe: ver·STE·hen.","Separable prefixes like an-, auf- and mit- are stressed: AN·ru·fen.":"Trennbare Vorsilben wie an-, auf- und mit- sind betont: AN·ru·fen.","In compound words, the first part gets the stress: FUSS·ball.":"Bei zusammengesetzten Wörtern wird der erste Teil betont: FUSS·ball.","Many loanwords stress the last syllable: Mu·SIK.":"Viele Lehnwörter werden auf der letzten Silbe betont: Mu·SIK.","Habits, facts and routines.":"Gewohnheiten, Fakten und Routinen.","Actions happening now or around now, and fixed plans for the future.":"Handlungen, die jetzt oder in dieser Zeit passieren, und feste Pläne für die Zukunft.","Past actions connected to now: experiences, recent results, and situations that are still true.":"Vergangene Handlungen mit Bezug zur Gegenwart: Erfahrungen, neue Ergebnisse und Zustände, die noch gelten.","An action that started in the past and is still going on, often with for or since.":"Eine Handlung, die in der Vergangenheit begann und noch andauert, oft mit for oder since.","Finished actions at a definite time in the past.":"Abgeschlossene Handlungen zu einem bestimmten Zeitpunkt in der Vergangenheit.","An action in progress at a moment in the past, often interrupted by another action.":"Eine Handlung, die zu einem Zeitpunkt in der Vergangenheit im Gang war, oft von einer anderen unterbrochen.","An action that happened before another past action.":"Eine Handlung, die vor einer anderen vergangenen Handlung geschah.","A longer action that continued up to a moment in the past.":"Eine längere Handlung, die bis zu einem Zeitpunkt in der Vergangenheit andauerte.","Predictions, promises, offers and decisions made at the moment of speaking.":"Vorhersagen, Versprechen, Angebote und spontane Entscheidungen.","Plans and intentions, and predictions based on what you can see now.":"Pläne und Absichten sowie Vorhersagen aufgrund dessen, was man gerade sieht.","An action that will be in progress at a time in the future.":"Eine Handlung, die zu einem Zeitpunkt in der Zukunft im Gang sein wird.","An action that will be finished before a time in the future.":"Eine Handlung, die vor einem Zeitpunkt in der Zukunft abgeschlossen sein wird.","How long an action will have continued by a time in the future.":"Wie lange eine Handlung zu einem Zeitpunkt in der Zukunft schon andauern wird.","The normal mood for facts and questions. All the tenses above are in the indicative.":"Der normale Modus für Fakten und Fragen. Alle Zeiten oben stehen im Indikativ.","Orders, instructions, advice and invitations. There is no subject.":"Befehle, Anweisungen, Ratschläge und Einladungen. Es gibt kein Subjekt.","Imagined situations and polite requests, often with if.":"Vorgestellte Situationen und höfliche Bitten, oft mit if.","What would have happened in the past, but didn't.":"Was in der Vergangenheit passiert wäre, aber nicht passiert ist.","Formal demands and recommendations after verbs like suggest, insist and recommend. The verb stays in the base form for every person.":"Förmliche Forderungen und Empfehlungen nach Verben wie suggest, insist und recommend. Das Verb bleibt bei allen Personen in der Grundform.","Unreal or imagined situations after if and wish. With be, use were for every person.":"Unwirkliche oder vorgestellte Situationen nach if und wish. Bei be steht für alle Personen were.","Use the passive when the action matters more than who does it. The object of the active sentence becomes the subject.":"Das Passiv verwendet man, wenn die Handlung wichtiger ist als die handelnde Person. Das Objekt des Aktivsatzes wird zum Subjekt.","When you report what someone said, the tense usually moves one step back, and pronouns and time words change.":"Wenn man wiedergibt, was jemand gesagt hat, rückt die Zeit meist eine Stufe zurück, und Pronomen und Zeitangaben ändern sich.","Add not after the auxiliary verb (be, have, will, can…). If there is no auxiliary, use do / does / did + not.":"Setze not nach das Hilfsverb (be, have, will, can…). Ohne Hilfsverb verwendet man do / does / did + not.","Put the auxiliary before the subject. With no auxiliary, use do / does / did. Question words come first.":"Das Hilfsverb steht vor dem Subjekt. Ohne Hilfsverb verwendet man do / does / did. Fragewörter stehen am Anfang.","Adjectives never change for gender or number. They go before the noun or after be. Short adjectives add -er / -est to compare; long ones use more / most.":"Adjektive ändern sich nie nach Geschlecht oder Zahl. Sie stehen vor dem Nomen oder nach be. Kurze Adjektive steigern mit -er / -est, lange mit more / most.","Adverbs say how, when or how often. Most are made by adding -ly to the adjective.":"Adverbien sagen, wie, wann oder wie oft. Die meisten entstehen, indem man -ly an das Adjektiv hängt.","Most nouns add -s. The spelling changes after some endings, and a few common nouns are irregular.":"Die meisten Nomen bekommen -s. Nach manchen Endungen ändert sich die Schreibung, und einige häufige Nomen sind unregelmäßig.","English nouns have no grammatical gender, and most job words are used for everyone (teacher, doctor, actor). A few words still have separate female forms.":"Englische Nomen haben kein grammatisches Geschlecht, und die meisten Berufsbezeichnungen gelten für alle (teacher, doctor, actor). Einige Wörter haben noch eine eigene weibliche Form.","Habits, facts, what is happening now, and the near future.":"Gewohnheiten, Fakten, was gerade passiert, und die nahe Zukunft.","An action happening right now.":"Eine Handlung, die gerade jetzt passiert.","Past actions connected to the present, often with hoy, este año, ya or nunca.":"Vergangene Handlungen mit Bezug zur Gegenwart, oft mit hoy, este año, ya oder nunca.","Finished actions at a specific time in the past.":"Abgeschlossene Handlungen zu einem bestimmten Zeitpunkt in der Vergangenheit.","Past habits, descriptions, and actions in progress in the past.":"Vergangene Gewohnheiten, Beschreibungen und Handlungen, die in der Vergangenheit im Gang waren.","An action that was in progress at a moment in the past.":"Eine Handlung, die zu einem Zeitpunkt in der Vergangenheit im Gang war.","A literary tense for an action just before another past action, mostly after cuando, en cuanto or apenas. In speech, the pluscuamperfecto or the indefinido is used instead.":"Eine literarische Zeit für eine Handlung kurz vor einer anderen vergangenen Handlung, meist nach cuando, en cuanto oder apenas. Beim Sprechen nimmt man stattdessen das pluscuamperfecto oder das indefinido.","Plans and things that are about to happen.":"Pläne und Dinge, die gleich passieren.","Future actions, predictions, and guesses about the present.":"Zukünftige Handlungen, Vorhersagen und Vermutungen über die Gegenwart.","An action that will be finished by a time in the future.":"Eine Handlung, die zu einem Zeitpunkt in der Zukunft abgeschlossen sein wird.","Hypothetical situations, polite requests and advice.":"Hypothetische Situationen, höfliche Bitten und Ratschläge.","What would have happened, but didn't.":"Was passiert wäre, aber nicht passiert ist.","The mood for facts and certainty. All the tenses above are in the indicative.":"Der Modus für Fakten und Gewissheit. Alle Zeiten oben stehen im Indikativ.","Wishes, doubts, emotions and requests, usually after que.":"Wünsche, Zweifel, Gefühle und Bitten, meist nach que.","Like the pretérito perfecto, but after expressions that need the subjunctive.":"Wie das pretérito perfecto, aber nach Ausdrücken, die den Subjunktiv verlangen.","Past wishes, and unreal conditions with si.":"Vergangene Wünsche und irreale Bedingungen mit si.","Unreal situations in the past, often with si.":"Irreale Situationen in der Vergangenheit, oft mit si.","Orders, instructions and invitations. Negative orders use the subjunctive: no hables.":"Befehle, Anweisungen und Einladungen. Verneinte Befehle stehen im Subjunktiv: no hables.","Use ser + participio. The participle agrees with the subject. In everyday Spanish, the pasiva refleja with se is more common.":"Man verwendet ser + participio. Das Partizip richtet sich nach dem Subjekt. Im Alltag ist die pasiva refleja mit se häufiger.","After a past reporting verb (dijo, preguntó), the tense moves back, and pronouns and time words change.":"Nach einem einleitenden Verb in der Vergangenheit (dijo, preguntó) rückt die Zeit zurück, und Pronomen und Zeitangaben ändern sich.","Put no before the verb, and before any object pronouns. Spanish uses double negatives: no + verb + nada, nadie or nunca.":"no steht vor dem Verb und vor Objektpronomen. Im Spanischen gibt es die doppelte Verneinung: no + Verb + nada, nadie oder nunca.","Questions start with ¿ and end with ?. For yes/no questions, the word order can stay the same and your voice rises at the end. Question words always have an accent.":"Fragen beginnen mit ¿ und enden mit ?. Bei Ja/Nein-Fragen kann die Wortstellung gleich bleiben, die Stimme geht am Ende nach oben. Fragewörter haben immer einen Akzent.","Adjectives agree with the noun in gender and number, and usually go after it.":"Adjektive richten sich in Geschlecht und Zahl nach dem Nomen und stehen meist danach.","Many adverbs are made by adding -mente to the feminine form of the adjective. A written accent on the adjective stays.":"Viele Adverbien entstehen, indem man -mente an die weibliche Form des Adjektivs hängt. Ein geschriebener Akzent bleibt.","Add -s after a vowel and -es after a consonant. Watch the spelling and the written accents.":"Nach einem Vokal kommt -s, nach einem Konsonanten -es. Achte auf Schreibung und Akzente.","Nouns for people and many animals change for gender, and so does the article.":"Nomen für Personen und viele Tiere ändern sich je nach Geschlecht, ebenso der Artikel.","Habits, facts and what is happening now.":"Gewohnheiten, Fakten und was gerade passiert.","To stress that an action is happening right now.":"Um zu betonen, dass eine Handlung gerade passiert.","Finished actions in the past. It's the main past tense in speech.":"Abgeschlossene Handlungen in der Vergangenheit. Die wichtigste Vergangenheitsform beim Sprechen.","Something that has only just happened.":"Etwas, das gerade erst passiert ist.","The literary past tense. You'll read it in books, but you don't need to speak it.":"Die literarische Vergangenheit. Man liest sie in Büchern, muss sie aber nicht sprechen.","A literary tense for an action just before another action in the passé simple, mostly after quand or dès que.":"Eine literarische Zeit für eine Handlung kurz vor einer anderen im passé simple, meist nach quand oder dès que.","Future actions and predictions.":"Zukünftige Handlungen und Vorhersagen.","An action that will be finished before a moment in the future.":"Eine Handlung, die vor einem Zeitpunkt in der Zukunft abgeschlossen sein wird.","The mood for facts and certainty. The present, past and future tenses above are all in the indicative.":"Der Modus für Fakten und Gewissheit. Die Gegenwarts-, Vergangenheits- und Zukunftsformen oben stehen alle im Indikativ.","After expressions of wish, necessity, emotion and doubt followed by que.":"Nach Ausdrücken von Wunsch, Notwendigkeit, Gefühl und Zweifel mit que.","A finished action after expressions that need the subjunctive.":"Eine abgeschlossene Handlung nach Ausdrücken, die den Subjonctif verlangen.","Orders and instructions. Only tu, nous and vous, without the pronoun. -er verbs drop the -s in the tu form.":"Befehle und Anweisungen. Nur tu, nous und vous, ohne Pronomen. Verben auf -er verlieren in der tu-Form das -s.","Use être in the tense you need + participe passé. The participle agrees with the subject, and the agent is introduced with par. In speech, French often uses on instead.":"Man verwendet être in der gewünschten Zeit + participe passé. Das Partizip richtet sich nach dem Subjekt, der Handelnde wird mit par angeschlossen. Beim Sprechen nimmt man oft on.","After a past reporting verb (il a dit, elle a demandé), the tense moves back, and pronouns and time words change.":"Nach einem einleitenden Verb in der Vergangenheit (il a dit, elle a demandé) rückt die Zeit zurück, und Pronomen und Zeitangaben ändern sich.","Put ne … pas around the conjugated verb (ne → n' before a vowel). In compound tenses, it goes around the auxiliary. In everyday speech, ne is often dropped.":"ne … pas steht um das konjugierte Verb (ne → n' vor einem Vokal). Bei zusammengesetzten Zeiten steht es um das Hilfsverb. Beim Sprechen fällt ne oft weg.","There are three ways to ask: rising intonation (informal), est-ce que (neutral), or swapping the verb and subject (formal).":"Es gibt drei Arten zu fragen: steigende Intonation (locker), est-ce que (neutral) oder Umstellung von Verb und Subjekt (förmlich).","Adjectives agree in gender and number, and usually go after the noun. A few common ones go before it: beau, bon, grand, petit, jeune, vieux, nouveau.":"Adjektive richten sich in Geschlecht und Zahl nach dem Nomen und stehen meist danach. Einige häufige stehen davor: beau, bon, grand, petit, jeune, vieux, nouveau.","Add -ment to the feminine adjective. If the adjective ends in a vowel, use the masculine. -ant and -ent become -amment and -emment.":"Hänge -ment an die weibliche Form des Adjektivs. Endet das Adjektiv auf einen Vokal, nimm die männliche Form. -ant und -ent werden zu -amment und -emment.","Most nouns add -s, which isn't pronounced. The article (les, des) tells the listener it's plural.":"Die meisten Nomen bekommen ein -s, das nicht gesprochen wird. Am Artikel (les, des) hört man, dass es Plural ist.","Nouns for people and many adjectives change for gender. Usually you add -e, but some endings change.":"Nomen für Personen und viele Adjektive ändern sich je nach Geschlecht. Meist hängt man -e an, manche Endungen ändern sich aber.","The present, habits and facts. With a time word, it's also used for the future.":"Die Gegenwart, Gewohnheiten und Fakten. Mit einer Zeitangabe auch für die Zukunft.","The main past tense in speech.":"Die wichtigste Vergangenheitsform beim Sprechen.","The past tense of written German and stories. In speech, it's used mainly with sein, haben and modal verbs.":"Die Vergangenheit der geschriebenen Sprache und von Erzählungen. Beim Sprechen vor allem bei sein, haben und Modalverben.","Future plans, predictions and assumptions.":"Zukunftspläne, Vorhersagen und Vermutungen.","An action that will be finished in the future, or a guess about the past.":"Eine Handlung, die in der Zukunft abgeschlossen sein wird, oder eine Vermutung über die Vergangenheit.","Orders and requests. The du form has no -st and often drops the -e. Verbs with e → i keep the i: sprich!":"Befehle und Bitten. Die du-Form hat kein -st und verliert oft das -e. Verben mit e → i behalten das i: sprich!","Wishes, unreal situations and polite requests. Most verbs use würde + infinitive; sein, haben and modal verbs have their own forms.":"Wünsche, irreale Situationen und höfliche Bitten. Die meisten Verben bilden würde + Infinitiv; sein, haben und Modalverben haben eigene Formen.","Unreal situations and regrets about the past.":"Irreale Situationen und Bedauern über die Vergangenheit.","Used for reported speech, mainly in the news and in formal writing.":"Wird für die indirekte Rede verwendet, vor allem in Nachrichten und förmlichen Texten.","Use werden + Partizip II. The agent is introduced with von.":"Man bildet es mit werden + Partizip II. Der Handelnde wird mit von angeschlossen.","Formal German uses Konjunktiv I. If that looks the same as the normal present, use Konjunktiv II. In everyday speech, most people use dass with the normal verb.":"Förmliches Deutsch verwendet den Konjunktiv I. Sieht er aus wie das normale Präsens, nimmt man den Konjunktiv II. Im Alltag sagen die meisten dass mit dem normalen Verb.","nicht negates verbs, adjectives and whole sentences. kein negates nouns that would have ein or no article, and it takes the same endings as ein.":"nicht verneint Verben, Adjektive und ganze Sätze. kein verneint Nomen, die ein oder keinen Artikel hätten, und hat dieselben Endungen wie ein.","Yes/no questions start with the verb. W-questions start with the question word, and the verb comes second.":"Ja/Nein-Fragen beginnen mit dem Verb. W-Fragen beginnen mit dem Fragewort, das Verb steht an zweiter Stelle.","After sein, adjectives don't change. Before a noun, they take an ending that depends on the gender, the case and the article. This table shows the endings after der, die, das.":"Nach sein ändern sich Adjektive nicht. Vor einem Nomen bekommen sie eine Endung, die von Geschlecht, Fall und Artikel abhängt. Die Tabelle zeigt die Endungen nach der, die, das.","Most adjectives can be used as adverbs without any change. Some common adverbs, like gern and oft, are words of their own.":"Die meisten Adjektive können ohne Änderung als Adverb verwendet werden. Einige häufige Adverbien wie gern und oft sind eigene Wörter.","German plurals should be learned with each noun, but there are patterns. The plural article is always die.":"Den Plural lernt man am besten mit jedem Nomen, es gibt aber Muster. Der Artikel im Plural ist immer die.","Most nouns for people add -in, and the article becomes die. The plural ends in -innen.":"Die meisten Nomen für Personen bekommen -in, der Artikel wird die. Der Plural endet auf -innen.","base verb · add -s or -es for he, she, it":"Grundform · -s oder -es bei he, she, it","am / is / are + verb-ing":"am / is / are + Verb-ing","have / has + past participle":"have / has + Partizip Perfekt","have / has been + verb-ing":"have / has been + Verb-ing","verb + -ed (regular) · past form (irregular: go → went)":"Verb + -ed (regelmäßig) · Vergangenheitsform (unregelmäßig: go → went)","was / were + verb-ing":"was / were + Verb-ing","had + past participle":"had + Partizip Perfekt","had been + verb-ing":"had been + Verb-ing","will + base verb":"will + Grundform","am / is / are going to + base verb":"am / is / are going to + Grundform","will be + verb-ing":"will be + Verb-ing","will have + past participle":"will have + Partizip Perfekt","will have been + verb-ing":"will have been + Verb-ing","any tense above":"jede Zeit von oben","base verb · don't + base verb · let's + base verb":"Grundform · don't + Grundform · let's + Grundform","would + base verb":"would + Grundform","would have + past participle":"would have + Partizip Perfekt","(that) + subject + base verb":"(that) + Subjekt + Grundform","if / wish + subject + past form (be → were)":"if / wish + Subjekt + Vergangenheitsform (be → were)","be (in any tense) + past participle (+ by …)":"be (in jeder Zeit) + Partizip Perfekt (+ by …)","say (that) … · tell someone (that) … · ask if / whether …":"say (that) … · tell someone (that) … · ask if / whether …","do / does / did + not + base verb · auxiliary + not":"do / does / did + not + Grundform · Hilfsverb + not","(question word) + auxiliary +   const fb=(k,t)=>{const f=$("#micFb");f.className="fb "+k;f.textContent=T(t)};
  const fail=(t)=>{fb("no",t);mode="self";micNote=t;$("#selfGo").textContent=T("Continue and mark my own answers");$("#selfGo").className="btn"};
  if(!SR){fail("This browser can't turn speech into text, so it can't check pronunciation. Open this file in Google Chrome.");return}
  if(!window.isSecureContext){fail("Chrome only allows the microphone on pages opened from a secure web address (https://…). On a phone, open the app from its web link instead of from a downloaded file.");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail("This browser doesn't allow microphone access here. Open this file in Google Chrome.");return}
  $("#askMic").onclick=async()=>{

      else if(n==="NotAllowedError")fail("Microphone permission was denied. Click the microphone icon at the right of Chrome's address bar, choose Allow, then reload the page.");
      else if(n==="NotFoundError")fail("No microphone was found. Connect one and reload the page.");
      else fail("The microphone couldn't be started.");
    }
  };
}
function startMeter(stream){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const src=ctx.createMediaStreamSource(stream);const an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
    const buf=new Uint8Array(an.fftSize);let raf;$("#meterBox").hidden=false;
    const loop=()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));const el=$("#meter");if(el)el.style.width=Math.min(100,m/64*100)+"%";raf=requestAnimationFrame(loop)};loop();
    meterStop=()=>{cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());try{ctx.close()}catch(e){}};
  }catch(e){stream.getTracks().forEach(t=>t.stop())}
}
