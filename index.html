<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1119">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Symbols &amp; Sounds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Charis+SIL:wght@400;700&family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a phonics bench. A single keycap-like letter sits on the left (top on phones); the sound, the two words, the variations and "your turn" stack beside it. A rail of the whole alphabet runs above, with a dot under every 6th letter marking a review stop. */
:root{
  --bg:#eff1f6; --surface:#ffffff; --ink:#161a2b; --muted:#585e76; --line:#d9dce8;
  --en:#2c5ee8; --es:#cf3f22; --fr:#6a3dd0; --de:#0b7f61; --on-acc:#ffffff;
  --good:#1d8150; --bad:#c23a32; --warn:#a35f00;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;
  --acc:var(--en);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}
.l-en{--acc:var(--en)} .l-es{--acc:var(--es)} .l-fr{--acc:var(--fr)} .l-de{--acc:var(--de)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px;--soft:color-mix(in srgb,var(--acc) 13%,var(--surface))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:900;font-variation-settings:"wdth" 118;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:800;font-variation-settings:"wdth" 110}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.lede{color:var(--muted);max-width:60ch;font-size:1.08rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--muted)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--on-acc)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* Home */
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:820px){.langs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lang{appearance:none;cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 6px 0 var(--acc);transition:transform .15s}
.lang:hover{transform:translateY(-3px)}
.lang .spec{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(3.6rem,14vw,5.4rem);line-height:1;color:var(--acc)}
.lang .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variation-settings:"wdth" 110;letter-spacing:.02em}
.lang .meta{color:var(--muted);font-size:.9rem}
.lang .prog{font-size:.82rem;font-weight:700;color:var(--acc)}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.howto b{display:block;font-family:var(--display);font-weight:800}
.note{font-size:.92rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}

/* Learn */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.top .left{display:flex;align-items:center;gap:10px;min-width:0}
.score{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:6px 14px;font-size:1.05rem}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.rail-wrap{overflow-x:auto;padding-bottom:6px}
.rail{display:flex;gap:4px;min-width:max-content}
.rail button{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:38px;cursor:pointer;font-family:var(--display);font-weight:800;position:relative;font-size:.95rem}
.rail button.done{background:var(--soft);border-color:var(--acc)}
.rail button.cur{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.rail button.miss{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.chip.ok{border-color:var(--good)} .chip.miss{border-color:var(--bad);color:var(--bad)}
.rail button.cp::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.bench{display:grid;gap:18px}
@media(min-width:780px){.bench{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.tilecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{appearance:none;cursor:pointer;width:100%;max-width:360px;aspect-ratio:1/1;border-radius:28px;border:2px solid var(--line);background:var(--surface);box-shadow:0 10px 0 var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:transform .12s, box-shadow .12s}
.tile:active{transform:translateY(6px);box-shadow:0 4px 0 var(--acc)}
.tile .g{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;line-height:.9;font-size:clamp(6rem,30vw,9.5rem);display:flex;align-items:baseline;gap:.08em}
.tile .g small{font-size:.55em;color:var(--acc)}
.tile .nm{font-size:1rem;color:var(--muted);font-weight:600}
.tile.playing{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 10px 0 var(--acc),0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}100%{box-shadow:0 10px 0 var(--acc),0 0 0 22px transparent}}
.tapcap{font-weight:700;color:var(--acc);display:flex;gap:8px;align-items:center}
.ipa{font-family:var(--ipa);font-size:1.15em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.soundline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.soundline .ipa{font-size:2rem;color:var(--acc);font-weight:700}
.stage{min-height:112px;border-radius:14px;background:var(--soft);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stage .count{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage .w{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 108;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;overflow-wrap:anywhere}
.stage .w mark{background:none;color:var(--acc);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.stage .m{color:var(--muted)}
.stage.empty{color:var(--muted)}
.stage .w,.stage .m{animation:rise .35s ease-out}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}}
.vars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vars li{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.vars li:first-child{border-top:0;padding-top:0}
.vars .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vars .hd .ipa{color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;max-width:100%;text-align:left}
.chip b{font-weight:700}
.chip span{color:var(--muted);font-size:.88rem}
.chip:hover{border-color:var(--acc)}
.turn{border:2px solid var(--acc)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}}
.turnrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.turnrow>div{flex:1 1 200px;min-width:0}
.fb{font-weight:700;min-height:1.5em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--acc)}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rules .panel h3{font-size:1.05rem}
.big{font-family:var(--display);font-weight:900;font-size:clamp(3rem,12vw,5rem);font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--surface);align-self:flex-start;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button span{font-weight:600;opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.rail.teams button{width:auto;min-width:40px;padding:0 9px;font-size:.82rem;white-space:nowrap}
.tile .g.team{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;text-align:center;justify-content:center;flex-wrap:wrap;padding:0 14px;font-variation-settings:"wdth" 112}
@media(max-width:779px){.tile .g.team{font-size:clamp(2.2rem,11vw,3.4rem)}}
.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.syl{font-weight:600;letter-spacing:.01em}
.syl .st{color:var(--acc);font-weight:800}
.wd .st{color:inherit;font-weight:800;box-shadow:inset 0 -3px 0 var(--acc)}
.syl .dot{color:var(--muted);margin:0 1px}
.passage{appearance:none;text-align:left;cursor:pointer;background:var(--soft);border:2px dashed var(--acc);border-radius:16px;padding:18px;font-family:var(--body);font-size:clamp(1.15rem,4.4vw,1.45rem);line-height:1.9;color:var(--ink);max-width:70ch}
.passage.paused{border-style:dashed;border-color:var(--warn)}
.passage.on{border-style:solid;animation:ring 1.4s ease-out infinite}
.wd{border-radius:5px;padding:1px 2px;transition:background .2s,color .2s}
.wd.next{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.wd.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.wd.close{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);text-decoration:underline dotted}
.wd.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);text-decoration:underline wavy;text-underline-offset:4px}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally .t{font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.t.ok{color:var(--good)} .t.close{color:var(--warn)} .t.bad{color:var(--bad)}
.probs{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prob{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prob.close{border-left-color:var(--warn)}
.prob .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pw{font-family:var(--display);font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
mark.lx{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);border-radius:3px}
.tpick{display:flex;flex-wrap:wrap;gap:8px}
.tpick .chip.on{border-color:var(--acc);background:var(--soft)}
.tpick .chip b{font-family:var(--display)}
.lvl{font-weight:800;color:var(--acc);font-size:.8rem;letter-spacing:.06em}
.hubs{display:flex;flex-direction:column;gap:12px;max-width:680px}
.hubc{appearance:none;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 5px 0 var(--acc)}
.hubc:disabled{cursor:default;box-shadow:none;opacity:.6}
.hubc .hn{font-family:var(--display);font-weight:900;font-size:1.8rem;color:var(--acc);width:1.4em;flex:0 0 auto;text-align:center}
.hubc .ht{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hubc .ht b{font-family:var(--display);font-weight:800;font-size:1.15rem}
.hubc .ht span{color:var(--muted);font-size:.92rem}
.hubc .go{font-size:1.5rem;color:var(--acc);font-weight:800}
.hubc .soon{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.glist{display:flex;flex-direction:column;gap:18px;max-width:760px}
.gg{display:flex;flex-direction:column;gap:8px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.gi[open]{border-color:var(--acc)}
.gi summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:14px 16px;font-weight:700;font-size:1.05rem}
.gi summary::-webkit-details-marker{display:none}
.gi summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:14px}
.rn{font-family:var(--ipa);color:var(--acc);font-weight:700;min-width:3.4em;font-variant-numeric:tabular-nums}
.gt{flex:1;min-width:0}
.chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);align-self:center;transition:transform .2s}
.gi[open] .chev{transform:rotate(-135deg)}
.gbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.form{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.form p{font-weight:600}
.more{align-self:flex-start}
.extra{display:flex;flex-direction:column;gap:10px}
.vpick .chip.on{border-color:var(--acc);background:var(--soft)}
.conj{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.conj button,.tbl-wrap td button{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-weight:600}
.conj button{display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.conj button svg{flex:0 0 auto;color:var(--acc)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl-wrap table{border-collapse:collapse;width:100%;min-width:max-content}
.tbl-wrap th,.tbl-wrap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-wrap th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--soft)}
.tbl-wrap tr:last-child td{border-bottom:0}
.tbl-wrap td button:hover{color:var(--acc)}
.hidden{display:none}
@media(max-width:779px){.tile{max-width:min(240px,64vw)}.tile .g{font-size:clamp(5rem,24vw,7rem)}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------------- DATA ---------------- */
const pw=s=>{const [w,m]=s.split("=");return {w:w.trim(),m:(m||"").trim()}};
function L(l,name,snd,w1,w2,o,al,say){return {l,name,snd,say,w:[pw(w1),pw(w2)],
  o:o.map(s=>{const [d,ss,a,b]=s.split(";");return {d,s:ss,ex:[pw(a),pw(b)]}}),
  al:al.split(",").map(x=>x.trim().toLowerCase())}}

const LANGS={
en:{name:"English",native:"English",tts:"en-GB",spec:"Th",cls:"l-en",
 intro:"British English. 26 letters, but around 44 sounds, so many letters change with their neighbours.",
 letters:[
 L("a","ay","/æ/","apple","cat",["Long A with a silent e at the end;/eɪ/;cake;name","ai or ay;/eɪ/;rain;day","ar;/ɑː/;car;star","aw or au;/ɔː/;saw;August"],"a,ay,eh,hey,ae"),
 L("b","bee","/b/","ball","bed",["Silent after m;silent;lamb;thumb","Silent before t;silent;debt;doubt"],"b,be,bee,bea,b."),
 L("c","see","/k/","cat","cup",["Soft C before e, i or y;/s/;city;ice","ch;/tʃ/;chair;lunch","ck;/k/;duck;back"],"c,see,sea,si,cee,c."),
 L("d","dee","/d/","dog","door",["-ed after p, k, s, sh or ch sounds like t;/t/;jumped;kissed"],"d,dee,the,d."),
 L("e","ee","/e/","egg","bed",["Long E;/iː/;me;these","ee or ea;/iː/;tree;sea","Silent E at the end of a word;silent;cake;home"],"e,ee,he,e."),
 L("f","ef","/f/","fish","fan",["ph and gh can also make this sound;/f/;phone;laugh"],"f,ef,eff,if,f."),
 L("g","jee","/g/","goat","bag",["Soft G before e, i or y;/dʒ/;giraffe;gem","ng;/ŋ/;sing;long","gh is often silent;silent;night;light","gh can sound like f;/f/;laugh;enough"],"g,gee,jee,ji,g."),
 L("h","aitch","/h/","hat","house",["Silent in a few words;silent;hour;honest","sh;/ʃ/;ship;fish","wh;/w/;what;when"],"h,aitch,age,each,edge,h."),
 L("i","eye","/ɪ/","sit","pig",["Long I with a silent e;/aɪ/;bike;time","igh;/aɪ/;high;night","ir;/ɜː/;bird;girl"],"i,eye,aye,ai,hi,i."),
 L("j","jay","/dʒ/","jam","jump",[],"j,jay,jae,j."),
 L("k","kay","/k/","kite","king",["Silent before n;silent;knife;knee"],"k,kay,okay,ok,cay,kei,k."),
 L("l","el","/l/","lion","leg",["Silent in -alk and -alf;silent;walk;half"],"l,el,elle,ell,hell,al,l."),
 L("m","em","/m/","moon","map",[],"m,em,um,emm,am,m."),
 L("n","en","/n/","nose","net",["Silent after m;silent;autumn;column"],"n,en,and,in,an,n."),
 L("o","oh","/ɒ/","dog","hot",["Long O with a silent e;/əʊ/;home;nose","oo (long);/uː/;moon;food","oo (short);/ʊ/;book;look","ou or ow;/aʊ/;house;cow","oi or oy;/ɔɪ/;coin;boy"],"o,oh,owe,0,o."),
 L("p","pee","/p/","pen","pig",["ph;/f/;phone;photo","Silent before s or n at the start;silent;psychology;pneumonia"],"p,pee,pea,pe,p."),
 L("q","cue","/kw/","queen","quick",["-que at the end of a word;/k/;unique;antique"],"q,cue,queue,cute,kew,q."),

  return `<div class="seg" role="tablist" id="seg"><button role="tab" data-ph="letters" aria-selected="${S.ph==="letters"}">Letters <span>${S.got.length}/${LG().letters.length}</span></button><button role="tab" data-ph="teams" aria-selected="${S.ph==="teams"}">Letter teams <span>${S.tgot.length}/${LG().teams.length}</span></button><button role="tab" data-ph="reading" aria-selected="${S.ph==="reading"}">Reading <span id="rbestTab">${rbSum()}/${RD().texts.length*5}</span></button><button role="tab" data-ph="more" aria-selected="${S.ph==="more"}">What's next</button></div>`;
}
function wirePhaseTabs(){
  $("#seg").onclick=e=>{const b=e.target.closest("[data-ph]");if(!b||b.dataset.ph===S.ph)return;S.ph=b.dataset.ph;if(S.ph==="reading")readingIntro();else if(S.ph==="more")hub();else learn()};
}
function rail(){
  const g=gotArr();
  return `<div class="rail-wrap"><div class="rail ${isT()?"teams":""}" id="rail">${items().map((x,i)=>
    `<button data-i="${i}" class="${i===ci()?"cur":""} ${g.includes(kid(x))?"done":""} ${Mx(x).includes(kid(x))?"miss":""} ${(i+1)%6===0?"cp":""}" aria-label="${unitWord()} ${esc(disp(x))}${(i+1)%6===0?", review after this one":""}">${esc(disp(x))}</button>`).join("")}</div></div>`;
}
function glyph(x){return x.team?`<span class="g team" lang="${S.lang}">${esc(x.l)}</span>`:`<span class="g">${up(x.l)}${x.l!=="ß"?`<small>${x.l}</small>`:""}</span>`}
function tileHTML(x,caption){
  return `<div class="tilecol"><button class="tile" id="tile" aria-label="Play ${esc(disp(x))}">${glyph(x)}<span class="nm">${x.team?esc(x.kind):`said “${esc(x.name)}”`}</span></button>
  <span class="tapcap" id="tapcap">${SPK_SVG}${caption}</span></div>`;
}
function wordStage(id){return `<div class="stage empty" id="${id}"><span>Two example words will play here, one after the other.</span></div>`}
function showWord(stageId,x,i){
  const w=x.w[i],st=$("#"+stageId);if(!st)return;
  st.classList.remove("empty");
  st.innerHTML=`<span class="count">Word ${i+1} of 2</span><span class="w" lang="${S.lang}">${hlx(w.w,x)}</span>${w.m?`<span class="m">${esc(w.m)}</span>`:""}`;
}
async function demo(x,stageId){
  const my=++run,tag=LG().tts,tile=$("#tile");
  tile&&tile.classList.add("playing");
  if(!x.team){await speak(sayOf(S.lang,x),tag,.75); if(my!==run)return false}
  const sl=$("#soundline");if(sl)sl.classList.remove("hidden");
  await wait(450); if(my!==run)return false;
  showWord(stageId,x,0); await speak(x.w[0].w,tag); if(my!==run)return false;
  await wait(900); if(my!==run)return false;
  showWord(stageId,x,1); await speak(x.w[1].w,tag); if(my!==run)return false;
  tile&&tile.classList.remove("playing");
  return true;
}
function varsHTML(x){
  if(x.team)return `<p>${esc(x.n||`${x.l} makes the sound ${x.snd} in the words above.`)}</p>`;
  if(!x.o.length)return `<p class="lede" style="font-size:1rem">${up(x.l)} keeps this one sound. No other sounds or letter teams to learn.</p>`;
  return `<ul class="vars">${x.o.map(o=>`<li><div class="hd"><b>${esc(o.d)}</b><span class="ipa">${esc(ipaTxt(o.s))}</span></div>
    <div class="chips">${o.ex.map(e=>`<button class="chip" data-say="${esc(e.w)}">${SPK_SVG}<b lang="${S.lang}">${esc(e.w)}</b>${e.m?`<span>${esc(e.m)}</span>`:""}</button>`).join("")}</div></li>`).join("")}</ul>`;
}
function wireChips(root){root.addEventListener("click",e=>{const c=e.target.closest("[data-say]");if(c){run++;speak(c.dataset.say,LG().tts)}})}

function learn(){
  if(S.ph==="reading"){readingIntro();return}
  if(S.ph==="more"){hub();return}
  run++;
  const lg=LG(),list=items(),i=ci(),x=list[i];
  document.body.className=lg.cls;
  saveProg();
  $("#app").innerHTML=`${topbar()}${phaseTabs()}${rail()}
  <div class="bench">
    ${tileHTML(x,x.team?"Tap to hear it in two words":"Tap the letter to hear it")}
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <section class="panel">
        <div class="soundline hidden" id="soundline"><span class="label">${x.team?"Sound":"Main sound"}</span><span class="ipa">${esc(ipaTxt(x.snd))}</span><span class="label">${x.team?"Team":"Letter"} ${i+1} of ${list.length}</span></div>
        ${wordStage("stage")}
      </section>
      <section class="panel hidden" id="varsP"><span class="label">${x.team?"How it works":"Other sounds &amp; letter teams"}</span>${varsHTML(x)}</section>
      <section class="panel turn hidden" id="turnP"></section>
    </div>
  </div>`;
  wireTop();
  wirePhaseTabs();
  $("#rail").onclick=e=>{const b=e.target.closest("[data-i]");if(b){setCi(+b.dataset.i);learn()}};
  const cur=$("#rail .cur");if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
  wireChips($("#varsP"));
  voiceCheck();
  let first=true;
  $("#tile").onclick=async()=>{
    const ok=await demo(x,"stage");
    if(!ok)return;
    $("#tapcap").innerHTML=SPK_SVG+"Tap again to replay";
    if(first){first=false;$("#varsP").classList.remove("hidden");$("#turnP").classList.remove("hidden");learnTurn(x)}
    if(innerWidth<780){const t=$("#turnP");t&&t.scrollIntoView({behavior:"smooth",block:"start"})}
  };
}
function learnTurn(x){
  const p=$("#turnP"),g=gotArr(),already=g.includes(kid(x));
  const i=ci(),last=i===items().length-1;
  const nextLabel=((i+1)%6===0)?"Start the review":last?(isT()?"On to reading practice":"On to letter teams"):(isT()?"Next team":"Next letter");
  const target=x.team?x.w[0].w:null;
  checkUI(p,x,{
    target,
    title:x.team?`Your turn: say the word “${target}”`:`Your turn: say the letter ${up(x.l)}`,
    sub:(x.team?`Make the ${x.l} sound ${x.snd} clearly.`:`Say its name, “${x.name}”.`)+(already?" You already earned the point for this one.":" +1 if you get it right, −1 if you get it wrong.")+(Mx(x).includes(kid(x))?" You've struggled with this one before.":""),
    onResult(ok,heard,fb,actions){
      if(ok){
        const pt=award(x);fb("ok",`Correct!${pt?" +1 point":" (point already counted)"}${heard?` I heard “${heard}”.`:""}`);
        actions(`<button class="btn" id="nx">${nextLabel} →</button>`);
        $("#nx").onclick=advance;$("#nx").focus();
        const rb=$("#rail [data-i='"+i+"']");if(rb)rb.classList.add("done");
      }else{
        const pt=penalise(x);const rb2=$("#rail [data-i='"+i+"']");if(rb2)rb2.classList.add("miss");
        fb("no",`${pt?"−1 point. ":""}${heard?`I heard “${heard}”. `:"Not quite. "}${pt?"Added to the ones you're struggling with. ":""}Listen again and try once more.`);
        actions(`<button class="btn ghost" id="again">${SPK_SVG}Hear it again</button><button class="btn ghost" id="skip">Skip for now</button>`);
        $("#again").onclick=()=>{run++;speak(x.team?target:sayOf(S.lang,x),LG().tts,.75)};
        $("#skip").onclick=advance;
      }
    }
  });
}
function endOfPhase(){if(isT())readingIntro();else teamsIntro()}
function advance(){
  const n=items().length,i=ci();
  if((i+1)%6===0){review(shuffle(items().slice(i-4,i+1)));return}
  if(i>=n-1){endOfPhase();return}
  setCi(i+1);learn();
}

/* --------- the "say it" block, shared by learn and review --------- */
function checkUI(p,x,o){
  const tag=LG().tts;
  const render=()=>{
    p.innerHTML=`<span class="label">${esc(o.title)}</span>
    <div class="turnrow">${mode==="voice"?`<button class="mic" id="mic" aria-label="Start listening">${MIC_SVG}</button>`:""}
      <div><p>${esc(o.sub)}</p><p class="label" id="micstate" style="margin-top:4px">${mode==="voice"?"Tap the microphone, then speak":"Say it out loud, then mark how you did"}</p></div></div>
    ${mode==="self"?`<div class="btns" id="selfb"><button class="btn good" id="yes">I said it right</button><button class="btn bad" id="no">I got it wrong</button></div>`:""}
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="btns" id="acts"></div>
    ${micNote&&mode==="self"?`<p class="note">${esc(micNote)}</p>`:""}`;
    const fb=(k,t)=>{const f=$("#fb");f.className="fb "+k;f.textContent=t};
    const actions=h=>{$("#acts").innerHTML=h};
    const finish=(ok,heard)=>{const m=$("#mic");if(m)m.disabled=ok||o.single;const sb=$("#selfb");if(sb&&(ok||o.single))sb.hidden=true;o.onResult(ok,heard,fb,actions)};
    if(mode==="voice"){
      const mic=$("#mic");
      mic.onclick=async()=>{
        run++;if(hasTTS)try{speechSynthesis.cancel()}catch(e){}mic.classList.add("on");$("#micstate").textContent="Listening… say it now";fb("","");actions("");
        await wait(250);const r=await listen(tag);mic.classList.remove("on");
        if(r.err){
          if(HARD.includes(r.err)){mode="self";micNote="Chrome couldn't use the microphone, so you'll mark your own answers. Allow the microphone for this page (the icon at the right of the address bar) and reload.";render();return}
          $("#micstate").textContent="Tap the microphone, then speak";
          fb("no",r.err==="no-speech"?"I didn't hear anything. Tap the microphone and speak right after the beep or prompt.":r.err==="network"?"The speech service couldn't be reached. Check your internet connection and try again.":r.err==="audio-capture"?"Another app may be using the microphone. Close it and try again.":"Something interrupted the listening. Tap the microphone and try again.");return;
        }
        $("#micstate").textContent="Tap the microphone to try again";
        finish(o.target?matchWord(o.target,r.alts):accepts(x,r.alts),r.alts[0]);
      };
    }else{
      $("#yes").onclick=()=>finish(true,"");
      $("#no").onclick=()=>finish(false,"");
    }
  };
  render();
}

/* ---------------- REVIEW ---------------- */
function review(queue,after){
  run++;
  const lg=LG();const res=[];let pos=0;const allT=queue.every(q=>q.team),allL=queue.every(q=>!q.team);
  const targets=queue.map(x=>x.team?x.w[Math.random()*2|0].w:null);
  document.body.className=lg.cls;
  const draw=()=>{
    const x=queue[pos],target=targets[pos],T=!!x.team;
    $("#app").innerHTML=`${topbar()}
    <section style="display:flex;flex-direction:column;gap:8px">
      <span class="label">${after?"Practice":`Review stop · after ${unitWord()} ${ci()+1}`}</span>
      <h2>Say these ${queue.length} ${allT?"words":allL?"letters":"from memory"}${allT||allL?" from memory":""}</h2>
      <div class="dots">${queue.map((_,i)=>`<i class="${res[i]===true?"ok":res[i]===false?"no":i===pos?"now":""}"></i>`).join("")}</div>
    </section>
    <div class="bench">
      <div class="tilecol"><div class="tile" style="cursor:default" id="tile">${glyph(x)}<span class="nm">${pos+1} of ${queue.length}</span></div></div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        ${T?`<section class="panel"><span class="label">Read this word aloud</span><div class="stage"><span class="w" lang="${S.lang}">${hlx(target,x)}</span></div></section>`:""}
        <section class="panel turn" id="turnP"></section>
        <section class="panel hidden" id="fixP">
          <div class="soundline hidden" id="soundline"><span class="label">Correct pronunciation</span>${T?"":`<span>“${esc(x.name)}”</span>`}<span class="ipa">${esc(ipaTxt(x.snd))}</span></div>
          ${wordStage("stage")}
        </section>
      </div>
    </div>`;
    wireTop();
    const nextBtn=label=>`<button class="btn" id="nx">${label} →</button>`;
    const go=()=>{pos++;if(pos<queue.length)draw();else reviewEnd(queue,res,after)};
    checkUI($("#turnP"),x,{
      target,
      title:T?`Say the word “${target}”`:"Say this letter",
      sub:Mx(x).includes(kid(x))?"No hints this time. You've already lost the point for this one, so no further deduction.":"No hints this time. Reviews add no points, but a mistake costs 1 point.",
      single:true,
      async onResult(ok,heard,fb,actions){
        res[pos]=ok;
        if(ok){fb("ok",`Correct!${heard?` I heard “${heard}”.`:""}`);actions(nextBtn(pos<queue.length-1?"Next":"See review results"));$("#nx").onclick=go;$("#nx").focus();return}
        const pt=penalise(x);
        fb("no",`${heard?`I heard “${heard}”. `:""}${pt?"−1 point, added to the ones you're struggling with. ":""}Listen to the correct pronunciation.`);
        $("#fixP").classList.remove("hidden");
        if(innerWidth<780)$("#fixP").scrollIntoView({behavior:"smooth",block:"start"});
        await demo(x,"stage");
        actions(nextBtn(pos<queue.length-1?"Continue":"See review results"));$("#nx").onclick=go;$("#nx").focus();
      }
    });
  };
  draw();
}
function reviewEnd(queue,res,after){
  const right=res.filter(Boolean).length,n=items().length,i=ci();
  const last=i>=n-1;
  const nextTxt=last?(isT()?"On to reading practice":"On to letter teams"):(isT()?"Next team: "+items()[i+1].l:"Next letter: "+up(items()[i+1].l));
  $("#app").innerHTML=`${topbar()}
  <section class="panel" style="align-items:flex-start">
    <span class="label">Review complete</span>
    <div class="big">${right}/${queue.length}</div>
    <p class="lede">${right===queue.length?"All right.":"The ones you missed were replayed with their example words and added to the ones you're struggling with."}</p>
    <div class="chips">${queue.map((x,k)=>`<span class="chip" style="cursor:default;border-color:${res[k]?"var(--good)":"var(--bad)"}"><b>${esc(disp(x))}</b><span>${res[k]?"right":"missed"}</span></span>`).join("")}</div>
    <div class="btns"><button class="btn" id="nx">${esc(nextTxt)} →</button></div>
  </section>`;
  wireTop();
  if(after)$("#nx").textContent="Back to results →";
  $("#nx").onclick=()=>{if(after)after();else if(last)endOfPhase();else{setCi(i+1);learn()}};$("#nx").focus();
}

}

  ["","Questions","Questions start with ¿ and end with ?. For yes/no questions, the word order can stay the same and your voice rises at the end. Question words always have an accent.","¿(question word) + verb + subject?",["¿Dónde vives?=Where do you live?","¿Qué quieres?=What do you want?","¿Cuándo llegas?=When do you arrive?","¿Por qué estudias español?=Why are you studying Spanish?","¿Cómo te llamas?=What's your name?","¿Cuánto cuesta?=How much is it?"],

  ["","Adverbs","Many adverbs are made by adding -mente to the feminine form of the adjective. A written accent on the adjective stays.","feminine adjective + -mente",["Habla lentamente.=He speaks slowly.","Siempre llega tarde.=She always arrives late."],

  ["","Reported speech","After a past reporting verb (il a dit, elle a demandé), the tense moves back, and pronouns and time words change.","dire que … · demander si … · dire de + infinitive",["aujourd'hui → ce jour-là","demain → le lendemain","hier → la veille","ici → là"],

  ["","Questions","There are three ways to ask: rising intonation (informal), est-ce que (neutral), or swapping the verb and subject (formal).","intonation · est-ce que + statement · verb-subject inversion",["Où habites-tu ?=Where do you live?","Qu'est-ce que tu veux ?=What do you want?","Quand est-ce que tu pars ?=When are you leaving?","Comment tu t'appelles ?=What's your name?","Combien ça coûte ?=How much is it?"],

  ["","Adjectives","Adjectives agree in gender and number, and usually go after the noun. A few common ones go before it: beau, bon, grand, petit, jeune, vieux, nouveau.","+ -e for feminine · + -s for plural · special endings below",["une voiture rouge=a red car","un petit chat=a small cat","Elle est plus grande que moi.=She is taller than me."],

  ["","Adverbs","Add -ment to the feminine adjective. If the adjective ends in a vowel, use the masculine. -ant and -ent become -amment and -emment.","feminine adjective + -ment",["Il parle lentement.=He speaks slowly.","Elle parle couramment.=She speaks fluently."],

  ["","Plural formation","Most nouns add -s, which isn't pronounced. The article (les, des) tells the listener it's plural.","+ -s · -eau / -eu → + -x · -al → -aux",["le livre → les livres=the book → the books","le gâteau → les gâteaux=the cake → the cakes"],

const EXTRA={
 es:[["progpast","Pretérito imperfecto continuo","An action that was in progress at a moment in the past.","estaba, estabas, estaba, estábamos, estabais, estaban + gerundio",["Estaba leyendo cuando llamaste.=I was reading when you called."]],
  ["ant","Pretérito anterior","A literary tense for an action just before another past action, mostly after cuando, en cuanto or apenas. In speech, the pluscuamperfecto or the indefinido is used instead.","hube, hubiste, hubo, hubimos, hubisteis, hubieron + participio",["En cuanto hubo terminado, se fue.=As soon as he had finished, he left."]],
  ["progfut","Futuro continuo","An action that will be in progress at a time in the future.","estaré, estarás, estará, estaremos, estaréis, estarán + gerundio",["Mañana a esta hora estaré viajando.=This time tomorrow I'll be travelling."]],
  ["subjperf","Subjuntivo perfecto","Like the pretérito perfecto, but after expressions that need the subjunctive.","haya, hayas, haya, hayamos, hayáis, hayan + participio",["Espero que hayas comido.=I hope you have eaten."]],
  ["subjplusc","Subjuntivo pluscuamperfecto","Unreal situations in the past, often with si.","hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran + participio",["Si hubiera tenido tiempo, habría venido.=If I had had time, I would have come."]]],
 fr:[["prog","Présent progressif","To stress that an action is happening right now.","être (present) + en train de + infinitive",["Je suis en train de manger.=I am eating (right now)."]],
  ["recent","Passé récent","Something that has only just happened.","venir (present) + de + infinitive",["Je viens de finir.=I have just finished.","Elle vient d'arriver.=She has just arrived."]],
  ["pa","Passé antérieur","A literary tense for an action just before another action in the passé simple, mostly after quand or dès que.","avoir or être (passé simple) + participe passé",["Dès qu'il eut fini, il partit.=As soon as he had finished, he left."]],
  ["subjp","Subjonctif passé","A finished action after expressions that need the subjunctive.","avoir or être (subjonctif) + participe passé",["Je suis content que tu sois venu.=I'm glad you came.","Il faut que tu aies fini avant midi.=You must have finished before noon."]]],
 de:[["k2p","Konjunktiv II der Vergangenheit","Unreal situations and regrets about the past.","hätte or wäre + Partizip II",["Wenn ich Zeit gehabt hätte, wäre ich gekommen.=If I had had time, I would have come.","Ich hätte das gern gemacht.=I would have liked to do that."]]]
};
const LAYOUT={
 en:[["Present tenses",["Simple present","Present continuous","Present perfect","Present perfect continuous"]],["Past tenses",["Simple past","Past continuous","Past perfect","Past perfect continuous"]],["Future tenses",["Simple future (will)","Future with going to","Future continuous","Future perfect","Future perfect continuous"]],["Moods",["Indicative","Imperative","Conditional","Conditional perfect","Present subjunctive","Past subjunctive"]]],
 es:[["Present tenses",["Presente","Presente continuo"]],["Past tenses",["Pretérito perfecto","Pretérito indefinido","Pretérito imperfecto","Pretérito imperfecto continuo","Pretérito pluscuamperfecto","Pretérito anterior"]],["Future tenses",["Futuro próximo (ir a + infinitivo)","Futuro simple","Futuro continuo","Futuro perfecto"]],["Conditional",["Condicional simple","Condicional compuesto"]],["Moods",["Indicativo","Subjuntivo presente","Subjuntivo perfecto","Subjuntivo imperfecto","Subjuntivo pluscuamperfecto","Imperativo"]]],
 fr:[["Present tenses",["Présent","Présent progressif"]],["Past tenses",["Passé composé","Passé récent","Imparfait","Plus-que-parfait","Passé simple","Passé antérieur"]],["Future tenses",["Futur proche","Futur simple","Futur antérieur"]],["Conditional",["Conditionnel présent","Conditionnel passé"]],["Moods",["Indicatif","Subjonctif présent","Subjonctif passé","Impératif"]]],
 de:[["Present tense",["Präsens"]],["Past tenses",["Perfekt","Präteritum","Plusquamperfekt"]],["Future tenses",["Futur I","Futur II"]],["Moods",["Indikativ","Imperativ","Konjunktiv II","Konjunktiv II der Vergangenheit","Konjunktiv I"]]]
};
for(const [L,G] of Object.entries(GRAM)){
  const pool=[...G.groups[0][1],...G.groups[1][1],...(EXTRA[L]||[])],other=G.groups[2];
  G.groups=LAYOUT[L].map(([name,titles])=>[name,titles.map(t=>{const it=pool.find(x=>x[1]===t);if(!it)throw new Error("grammar item missing: "+t);return it})]).concat([other]);
}

/* ---------------- NEXT STEPS ---------------- */
function hub(){
  run++;const lg=LG();S.ph="more";saveProg();document.body.className=lg.cls;
  const opts=[["Master Grammar","Tenses, moods and the main rules, with full conjugations.",1],["Build vocabulary","Learn new words by topic.",0],["Practice vocabulary","Test yourself on the words you've learned.",0],["Practice speaking and listening","Short conversations to listen to and answer.",0]];
  $("#app").innerHTML=`${topbar()}${phaseTabs()}
  <section style="display:flex;flex-direction:column;gap:6px"><span class="label">${lg.name} · what's next</span><h2>Choose what to work on</h2></section>
  <div class="hubs" id="hubs">${opts.map((o,i)=>`<button class="hubc" data-h="${i}" ${o[2]?"":"disabled"}><span class="hn">${i+1}</span><span class="ht"><b>${o[0]}</b><span>${o[1]}</span></span>${o[2]?`<span class="go">→</span>`:`<span class="soon">Coming soon</span>`}</button>`).join("")}</div>`;
  wireTop();wirePhaseTabs();
  $("#hubs").onclick=e=>{const b=e.target.closest("[data-h]");if(b&&!b.disabled&&b.dataset.h==="0")grammar()};
}

function grammar(){
  run++;const lg=LG(),G=GRAM[S.lang];document.body.className=lg.cls;
  let n=0;
  const exHTML=ex=>`<div class="chips">${ex.map(s=>{const e=pw(s);return `<button class="chip" data-say="${esc(speakable(e.w))}">${SPK_SVG}<b lang="${S.lang}">${esc(e.w)}</b>${e.m?`<span>${esc(e.m)}</span>`:""}</button>`}).join("")}</div>`;
  const item=(it,gi,ii)=>{const [k,t,d,f,ex,tb]=it;n++;
    return `<details class="gi" data-g="${gi}" data-i="${ii}"><summary><span class="rn">(${roman(n)})</span><span class="gt" lang="${S.lang}">${esc(t)}</span><span class="chev" aria-hidden="true"></span></summary>
    <div class="gbody"><p>${esc(d)}</p><div class="form"><span class="label">How to form it</span><p lang="${S.lang}">${esc(f)}</p></div>
    <span class="label">Examples · tap to hear</span>${exHTML(ex)}
    ${k?`<button class="btn ghost more" data-k="${k}">Show verb conjugation</button><div class="extra" hidden></div>`:tb?`<button class="btn ghost more" data-t="1">Show ${/Plural|Feminine|Adjectives|Adverbs/.test(t)?"word changes":"more examples"}</button><div class="extra" hidden></div>`:""}
    </div></details>`};
  $("#app").innerHTML=`${topbar()}${phaseTabs()}
  <section style="display:flex;flex-direction:column;gap:6px"><button class="btn ghost" id="toHub" style="align-self:flex-start">← What's next</button><span class="label">Master Grammar · ${lg.name}</span><h2>Tap a topic to open it</h2></section>
  <div class="glist" id="glist">${G.groups.map((g,gi)=>`<section class="gg"><h3 class="label">${esc(g[0])}</h3>${g[1].map((it,ii)=>item(it,gi,ii)).join("")}</section>`).join("")}</div>`;
  wireTop();wirePhaseTabs();$("#toHub").onclick=hub;
  const list=$("#glist");wireChips(list);
  list.addEventListener("click",e=>{
    const b=e.target.closest(".more");if(!b)return;
    const box=b.nextElementSibling;if(!box.hidden){box.hidden=true;b.textContent=b.dataset.k?"Show verb conjugation":b.textContent.replace("Hide","Show");return}
    const det=b.closest(".gi"),it=G.groups[+det.dataset.g][1][+det.dataset.i];
    if(b.dataset.k){
      let vi=0;const draw=()=>{const rows=G.conj(G.verbs[vi][0],b.dataset.k);
        box.innerHTML=`<span class="label">Choose a verb</span><div class="chips vpick">${G.verbs.map((v,i)=>`<button class="chip${i===vi?" on":""}" data-v="${i}" aria-pressed="${i===vi}"><b lang="${S.lang}">${esc(v[0])}</b><span>${esc(v[1])}</span></button>`).join("")}</div>
        <ol class="conj">${rows.map(r=>`<li><button data-say="${esc(speakable(r))}" lang="${S.lang}">${SPK_SVG}<span>${esc(r)}</span></button></li>`).join("")}</ol>`;
        box.querySelector(".vpick").onclick=ev=>{const c=ev.target.closest("[data-v]");if(c){vi=+c.dataset.v;draw()}};};
      draw();b.textContent="Hide verb conjugation";
    }else{
      const tb=it[5];
      box.innerHTML=`<div class="tbl-wrap"><table><thead><tr>${tb.h.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${tb.r.map(r=>`<tr>${r.map((c,ci)=>`<td>${tb.s.includes(ci)&&c!=="–"?`<button data-say="${esc(speakable(c))}" lang="${S.lang}">${esc(c)}</button>`:esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      b.textContent=b.textContent.replace("Show","Hide");
    }
    box.hidden=false;
  });
}

/* ---------------- DONE ---------------- */
function done(){
  run++;const lg=LG();S.score=calcScore(S);saveProg();
  const hard=[...lg.letters.filter(x=>S.miss.includes(x.l)),...lg.teams.filter(x=>S.tmiss.includes(kid(x)))];
  $("#app").innerHTML=`${topbar()}
  <section class="panel" style="align-items:flex-start;gap:14px">
    <span class="label">${lg.name} complete: letters, letter teams and reading</span>
    <div class="big">${S.score} pts</div>
    <p class="lede">+${S.got.length+S.tgot.length} for letters and letter teams said correctly, −${S.miss.length+S.tmiss.length} for the ones you struggled with, +${rbSum()} for reading (best score on each of the ${RD().texts.length} texts). Each letter or letter team counts only once.</p>
    <section style="display:flex;flex-direction:column;gap:8px;width:100%"><span class="label">Struggled with · ${hard.length}</span>
      ${hard.length?`<div class="chips">${hard.map(x=>`<span class="chip miss" style="cursor:default"><b lang="${S.lang}">${esc(disp(x))}</b><span class="ipa">${esc(ipaTxt(x.snd))}</span></span>`).join("")}</div>`:`<p>None. You pronounced every letter and letter team correctly.</p>`}</section>
    <span class="label">Letters · green = point earned · red = struggled</span>
    <div class="chips">${lg.letters.map(x=>`<span class="chip ${S.miss.includes(x.l)?"miss":S.got.includes(x.l)?"ok":""}" style="cursor:default"><b>${up(x.l)}</b></span>`).join("")}</div>
    <span class="label">Letter teams</span>
    <div class="chips">${lg.teams.map(x=>`<span class="chip ${S.tmiss.includes(kid(x))?"miss":S.tgot.includes(kid(x))?"ok":""}" style="cursor:default"><b lang="${S.lang}">${esc(x.l)}</b></span>`).join("")}</div>
    <div class="btns"><button class="btn" id="toNext">Continue: what's next →</button>${hard.length?`<button class="btn" id="rvH">Practise the ones I struggled with</button>`:""}<button class="btn" id="rvL">Review 5 random letters</button><button class="btn" id="rvT">Review 5 random teams</button><button class="btn" id="rdA">Reading practice</button><button class="btn ghost" id="restart">Start again from A</button><button class="btn ghost" id="other">Choose another language</button></div>
  </section>`;
  wireTop();
  $("#toNext").onclick=hub;
  if($("#rvH"))$("#rvH").onclick=()=>review(shuffle(hard),done);
  $("#rvL").onclick=()=>review(shuffle(lg.letters).slice(0,5),done);
  $("#rvT").onclick=()=>review(shuffle(lg.teams).slice(0,5),done);
  $("#rdA").onclick=()=>{S.ph="reading";saveProg();readingPage(0)};
  $("#restart").onclick=()=>{S.ph="letters";S.idx=0;S.tidx=0;S.score=0;S.got=[];S.tgot=[];S.miss=[];S.tmiss=[];S.rb=[0,0,0,0];learn()};
  $("#other").onclick=home;
}

  <p class="lede">${esc(lg.intro)} Tap any example to hear it.</p>
  <div class="rules" id="rulesG">${lg.rules.map(r=>`<section class="panel"><h3>${esc(r.t)}</h3><p>${esc(r.d)}</p>
    <div class="chips">${r.ex.map(s=>{const e=pw(s);return `<button class="chip" data-say="${esc(e.w)}">${SPK_SVG}<b lang="${S.lang}">${esc(e.w)}</b>${e.m?`<span>${esc(e.m)}</span>`:""}</button>`}).join("")}</div></section>`).join("")}</div>`;
  $("#backL").onclick=learn;
  wireChips($("#rulesG"));
}

home();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
