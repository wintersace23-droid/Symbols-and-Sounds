    sub:(x.team?T("Make the {team} sound {snd} clearly.",{team:x.l,snd:x.snd}):T("Say its name, “{name}”.",{name:x.name}))+" "+(already?T("You already earned the point for this one."):T("+1 if you get it right, −1 if you get it wrong."))+(Mx(x).includes(kid(x))?" "+T("You've struggled with this one before."):""),
    onResult(ok,heard,fb,actions){
      if(ok){
        const pt=award(x);fb("ok",T("Correct!")+" "+(pt?T("+1 point"):T("(point already counted)"))+(heard?" "+T("I heard “{h}”.",{h:heard}):""));
        actions(`<button class="btn" id="nx">${nextLabel} →</button>`);
        $("#nx").onclick=advance;$("#nx").focus();
        const rb=$("#rail [data-i='"+i+"']");if(rb)rb.classList.add("done");
      }else{
        const pt=penalise(x);const rb2=$("#rail [data-i='"+i+"']");if(rb2)rb2.classList.add("miss");
        fb("no",[pt?T("−1 point."):"",heard?T("I heard “{h}”.",{h:heard}):T("Not quite."),pt?T("Added to the ones you're struggling with."):"",T("Listen again and try once more.")].filter(Boolean).join(" "));
        actions(`<button class="btn ghost" id="again">${SPK_SVG}${T("Hear it again")}</button><button class="btn ghost" id="skip">${T("Skip for now")}</button>`);
        $("#again").onclick=()=>{run++;speak(x.team?target:sayOf(S.lang,x),LG().tts,.75)};
        $("#skip").onclick=advance;
      }
    }
  });
}
function endOfPhase(){if(isT())readingIntro();else teamsIntro()}
function advance(){
  const n=items().length,i=ci();
  if((i+1)%6===0){review(shuffle(items().slice(i-4,i+1)));return}
  if(i>=n-1){endOfPhase();return}
  setCi(i+1);learn();
}

/* --------- the "say it" block, shared by learn and review --------- */
function checkUI(p,x,o){
  const tag=LG().tts;
  const render=()=>{
    p.innerHTML=`<span class="label">${esc(o.title)}</span>
    <div class="turnrow">${mode==="voice"?`<button class="mic" id="mic" aria-label="${T("Start listening")}">${MIC_SVG}</button>`:""}
      <div><p>${esc(o.sub)}</p><p class="label" id="micstate" style="margin-top:4px">${mode==="voice"?T("Tap the microphone, then speak"):T("Say it out loud, then mark how you did")}</p></div></div>
    ${mode==="self"?`<div class="btns" id="selfb"><button class="btn good" id="yes">${T("I said it right")}</button><button class="btn bad" id="no">${T("I got it wrong")}</button></div>`:""}
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="btns" id="acts"></div>
    ${micNote&&mode==="self"?`<p class="note">${esc(T(micNote))}</p>`:""}`;
    const fb=(k,t)=>{const f=$("#fb");f.className="fb "+k;f.textContent=t};
    const actions=h=>{$("#acts").innerHTML=h};
    const finish=(ok,heard)=>{const m=$("#mic");if(m)m.disabled=ok||o.single;const sb=$("#selfb");if(sb&&(ok||o.single))sb.hidden=true;o.onResult(ok,heard,fb,actions)};
    if(mode==="voice"){
      const mic=$("#mic");
      mic.onclick=async()=>{
        run++;if(hasTTS)try{speechSynthesis.cancel()}catch(e){}mic.classList.add("on");$("#micstate").textContent=T("Listening… say it now");fb("","");actions("");
        await wait(250);const r=await listen(tag);mic.classList.remove("on");
        if(r.err){
          if(HARD.includes(r.err)){mode="self";micNote="Chrome couldn't use the microphone, so you'll mark your own answers. Allow the microphone for this page (the icon at the right of the address bar) and reload.";render();return}
          $("#micstate").textContent=T("Tap the microphone, then speak");
          fb("no",T(r.err==="no-speech"?"I didn't hear anything. Tap the microphone and speak right after the beep or prompt.":r.err==="network"?"The speech service couldn't be reached. Check your internet connection and try again.":r.err==="audio-capture"?"Another app may be using the microphone. Close it and try again.":"Something interrupted the listening. Tap the microphone and try again."));return;
        }
        $("#micstate").textContent=T("Tap the microphone to try again");
        finish(o.target?matchWord(o.target,r.alts):accepts(x,r.alts),r.alts[0]);
      };
    }else{
      $("#yes").onclick=()=>finish(true,"");
      $("#no").onclick=()=>finish(false,"");
    }
  };
  render();
}

/* ---------------- REVIEW ---------------- */
function review(queue,after){
  run++;
  const lg=LG();const res=[];let pos=0;const allT=queue.every(q=>q.team),allL=queue.every(q=>!q.team);
  const targets=queue.map(x=>x.team?x.w[Math.random()*2|0].w:null);
  document.body.className=lg.cls;
  const draw=()=>{
    const x=queue[pos],target=targets[pos],T_=!!x.team;
    $("#app").innerHTML=`${topbar()}
    <section style="display:flex;flex-direction:column;gap:8px">
      <span class="label">${after?T("Practice"):isT()?T("Review stop · after team {n}",{n:ci()+1}):T("Review stop · after letter {n}",{n:ci()+1})}</span>
      <h2>${allT?T("Say these {n} words from memory",{n:queue.length}):allL?T("Say these {n} letters from memory",{n:queue.length}):T("Say these {n} from memory",{n:queue.length})}</h2>
      <div class="dots">${queue.map((_,i)=>`<i class="${res[i]===true?"ok":res[i]===false?"no":i===pos?"now":""}"></i>`).join("")}</div>
    </section>
    <div class="bench">
      <div class="tilecol"><div class="tile" style="cursor:default" id="tile">${glyph(x)}<span class="nm">${T("{n} of {m}",{n:pos+1,m:queue.length})}</span></div></div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        ${T_?`<section class="panel"><span class="label">${T("Read this word aloud")}</span><div class="stage"><span class="w" lang="${S.lang}">${hlx(target,x)}</span></div></section>`:""}
        <section class="panel turn" id="turnP"></section>
        <section class="panel hidden" id="fixP">
          <div class="soundline hidden" id="soundline"><span class="label">${T("Correct pronunciation")}</span>${T_?"":`<span>“${esc(x.name)}”</span>`}<span class="ipa">${esc(ipaTxt(x.snd))}</span></div>
          ${wordStage("stage")}
        </section>
      </div>
    </div>`;
    wireTop();
    const nextBtn=label=>`<button class="btn" id="nx">${label} →</button>`;
    const go=()=>{pos++;if(pos<queue.length)draw();else reviewEnd(queue,res,after)};
    checkUI($("#turnP"),x,{
      target,
      title:T_?T("Say the word “{w}”",{w:target}):T("Say this letter"),
      sub:Mx(x).includes(kid(x))?T("No hints this time. You've already lost the point for this one, so no further deduction."):T("No hints this time. Reviews add no points, but a mistake costs 1 point."),
      single:true,
      async onResult(ok,heard,fb,actions){
        res[pos]=ok;
        if(ok){fb("ok",T("Correct!")+(heard?" "+T("I heard “{h}”.",{h:heard}):""));actions(nextBtn(T(pos<queue.length-1?"Next":"See review results")));$("#nx").onclick=go;$("#nx").focus();return}
        const pt=penalise(x);
        fb("no",[heard?T("I heard “{h}”.",{h:heard}):"",pt?T("−1 point, added to the ones you're struggling with."):"",T("Listen to the correct pronunciation.")].filter(Boolean).join(" "));
        $("#fixP").classList.remove("hidden");
        if(innerWidth<780)$("#fixP").scrollIntoView({behavior:"smooth",block:"start"});
        await demo(x,"stage");
        actions(nextBtn(T(pos<queue.length-1?"Continue":"See review results")));$("#nx").onclick=go;$("#nx").focus();
      }
    });
  };
  draw();
}
function reviewEnd(queue,res,after){
  const right=res.filter(Boolean).length,n=items().length,i=ci();
  const last=i>=n-1;
  const nextTxt=last?T(isT()?"On to reading practice":"On to letter teams"):(isT()?T("Next team: {x}",{x:items()[i+1].l}):T("Next letter: {x}",{x:up(items()[i+1].l)}));
  $("#app").innerHTML=`${topbar()}
  <section class="panel" style="align-items:flex-start">
    <span class="label">${T("Review complete")}</span>
    <div class="big">${right}/${queue.length}</div>
    <p class="lede">${right===queue.length?T("All right."):T("The ones you missed were replayed with their example words and added to the ones you're struggling with.")}</p>
    <div class="chips">${queue.map((x,k)=>`<span class="chip" style="cursor:default;border-color:${res[k]?"var(--good)":"var(--bad)"}"><b>${esc(disp(x))}</b><span>${res[k]?T("right"):T("missed")}</span></span>`).join("")}</div>
    <div class="btns"><button class="btn" id="nx">${esc(nextTxt)} →</button></div>
  </section>`;
  wireTop();
  if(after)$("#nx").textContent=T("Back to results")+" →";
  $("#nx").onclick=()=>{if(after)after();else if(last)endOfPhase();else{setCi(i+1);learn()}};$("#nx").focus();
}

  const bad=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){const c=A[i-1]&&A[i-1]===B[j-1]?0:1;if(D[i][j]===D[i-1][j-1]+c){bad[i-1]=!!c&&!!A[i-1];i--;j--}else if(D[i][j]===D[i-1][j]+1){bad[i-1]=!!A[i-1];i--}else j--}

function readingPage(ti){

    <h2 lang="${S.lang}">${esc(TX.title)}</h2>
    <p>${mode==="voice"?T("Tap the text to start the microphone, then read it aloud at a calm pace. Words turn green as the app hears them."):T("Reading is checked with the microphone, which isn't on. You can still listen to the text and read along.")}</p>
    <button class="passage" id="passage" lang="${S.lang}" aria-label="${T("Tap to start reading")}">${passage}</button>

    <div class="btns"><button class="btn" id="doneR" hidden>${T("Done reading")}</button><button class="btn ghost" id="hearAll">${SPK_SVG}${T("Hear it read")}</button><button class="btn ghost" id="stressT" aria-pressed="false">${T("Show stress")}</button></div>
  </section>
  <div id="results"></div>`;
  wireTop();wirePhaseTabs();
  const spans=[...document.querySelectorAll("#passage .wd")];
  let paused=false,netErr=0,showStress=false,listening=false,stopped=false,acc="",sess="",interim="",rec=null,hardErr=null,deadline=0,autoT=null;
  const paintStress=()=>spans.forEach((s,k)=>{s.innerHTML=showStress?wordStressHTML(words[k].t):esc(words[k].t)});
  $("#stressT").onclick=()=>{showStress=!showStress;$("#stressT").setAttribute("aria-pressed",showStress);$("#stressT").textContent=showStress?T("Hide stress"):T("Show stress");paintStress()};
  $("#hearAll").onclick=()=>{if(listening)return;run++;speak(TX.text,tag,.85)};
  $("#tpick").onclick=e=>{const b=e.target.closest("[data-t]");if(!b||listening||+b.dataset.t===ti)return;try{rec&&rec.abort()}catch(x){}readingPage(+b.dataset.t)};
  const live=()=>{
    const H=(acc+" "+sess+" "+interim).split(/[\s\-]+/).map(rnorm).filter(Boolean);
    const al=align(TW,H);let last=-1;
    al.forEach((a,k)=>{if(a&&(a.st==="ok"||a.st==="close"))last=k});
    spans.forEach((s,k)=>{s.className="wd"+(k<=last&&al[k]&&al[k].st!=="miss"?(al[k].st==="ok"?" ok":al[k].st==="close"?" close":""):"")+(k===last+1?" next":"")});
    if(last===spans.length-1&&!autoT)autoT=setTimeout(stop,1500);
  };
  const stop=()=>{stopped=true;try{rec&&rec.stop()}catch(e){}};
  const session=()=>{
    try{rec=new SR()}catch(e){hardErr="unsupported";finish();return}
    rec.lang=tag;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{const parts=[];let im="";
      for(let k=0;k<e.results.length;k++){const t=e.results[k][0].transcript.trim();
        if(e.results[k].isFinal){if(parts.length&&t.startsWith(parts[parts.length-1]))parts[parts.length-1]=t;else parts.push(t)}else im+=" "+t}
      sess=parts.join(" ");interim=im;live()};
    rec.onerror=e=>{if(HARD.includes(e.error))hardErr=e.error;if(e.error==="network")hardErr="network"};
    // No automatic restart: each restart makes Android play its listening beep.
    rec.onend=()=>{acc+=" "+sess;sess="";interim="";rec=null;
      if(stopped||hardErr){finish();return}
      paused=true;listening=false;$("#passage").classList.remove("on");$("#passage").classList.add("paused");

function assess(TW,H,words,rawHeard,spans,ti){
  const al=align(TW,H);
  const c={ok:0,close:0,sub:0,miss:0};al.forEach(a=>c[a.st]++);
  const acc=(c.ok+.5*c.close)/TW.length,score=Math.round(acc*5);
  const prev=S.rb[ti]||0,gain=Math.max(0,score-prev);if(score>prev)S.rb[ti]=score;bumpScore(gain);
  const rt=$("#rbestTab");if(rt)rt.textContent=rbSum()+"/"+RD().texts.length*5;
  const pk=$("#tpick [data-t='"+ti+"'] span");if(pk)pk.innerHTML=`<span class="lvl">${RD().texts[ti].lvl}</span> ${esc(dispTitle(RD().texts[ti].title))} · ${S.rb[ti]}/5`;
  spans.forEach((s,k)=>{s.className="wd "+({ok:"ok",close:"close",sub:"bad",miss:"bad"}[al[k].st])});
  const probs=al.map((a,k)=>({a,k,w:words[k].t,heard:a.h!=null?rawHeard[a.h]||"":""})).filter(p=>p.a.st!=="ok");
  const stressLine=w=>{const s=stressInfo(w);if(!s)return `<p class="label">${T("One syllable: no stress to place")}</p>`;
    return `<p><span class="label">${T("Stress")}</span> <b class="syl" lang="${S.lang}">${sylHTML(RD().map[rkey(w)])}</b> · ${T("stress the {where} syllable",{where:s.where})}</p>`};
  const card=p=>{
    const what=p.a.st==="miss"?T("Not heard. Say this word clearly.")
      :p.a.st==="close"?T("Almost. I heard “{h}”.",{h:esc(p.heard)})
      :T("I heard “{h}”. Check the highlighted letters.",{h:esc(p.heard)});
    const wordH=p.a.st==="miss"?esc(p.w):letterDiff(p.w,p.heard);
    return `<li class="prob ${p.a.st}"><div class="hd"><b class="pw" lang="${S.lang}">${wordH}</b><button class="chip" data-say="${esc(p.w)}">${SPK_SVG}${T("Hear it")}</button></div><p>${what}</p>${stressLine(p.w)}</li>`};
  $("#results").innerHTML=`<section class="panel" style="gap:14px">
    <span class="label">${T("Your reading")}</span>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><div class="big">${score}/5</div><p class="lede">${gain?(gain===1?T("+1 point added"):T("+{n} points added",{n:gain})):score===5?T("Perfect reading!"):T("Your best on this text is {b}/5. Beat it to earn more points",{b:S.rb[ti]})}</p></div>
    <div class="tally"><span class="t ok">${T("{n} read well",{n:c.ok})}</span><span class="t close">${T("{n} nearly right",{n:c.close})}</span><span class="t bad">${T("{n} misread",{n:c.sub})}</span><span class="t bad">${T("{n} missed",{n:c.miss})}</span></div>
    ${probs.length?`<span class="label">${T("Words to practise")}</span><ul class="probs" id="probs">${probs.map(card).join("")}</ul>`
      :`<p>${T("Every word was recognised. Now compare your stress with the guide: tap Show stress above and read once more.")}</p>`}
    <p class="note">${T("The app checks which words were recognised. It can't measure stress from your voice, so for each word it shows where the stress belongs. Tap “Hear it” and compare.")}</p>
    <div class="btns"><button class="btn" id="again">${T("Read it again")}</button>${ti<RD().texts.length-1?`<button class="btn" id="nextT">${T("Next text: {lvl}",{lvl:esc(RD().texts[ti+1].lvl)})} →</button>`:""}<button class="btn ghost" id="fin">${T("See final results")} →</button></div>
  </section>`;
  if($("#probs"))wireChips($("#probs"));
  $("#again").onclick=()=>{$("#results").innerHTML="";spans.forEach(s=>s.className="wd");scrollTo({top:0,behavior:"smooth"});$("#rstate").textContent=T("Tap the text to begin")};
  $("#fin").onclick=done;
  if($("#nextT"))$("#nextT").onclick=()=>{scrollTo(0,0);readingPage(ti+1)};
  $("#results").scrollIntoView({behavior:"smooth",block:"start"});
}

en:{"Simple present":"Habits and routines|General truths|Facts|Timetables and schedules","Present continuous":"Actions happening now|Temporary situations|Fixed future plans|Changing situations","Present perfect":"Life experiences|Recent actions with a result now|Situations that are still true|Unfinished time: today, this week","Present perfect continuous":"Actions still going on|How long something has lasted|Recent activities with visible results","Simple past":"Finished past actions|Past habits|A series of past events|Stories","Past continuous":"Actions in progress in the past|The background to a story|An action that was interrupted|Two actions at the same time","Past perfect":"An action before another past action|Reasons for a past situation|Regrets: if I had known…","Past perfect continuous":"Long actions before a past moment|Causes of a past result|How long something had lasted","Simple future (will)":"Predictions|Promises|Offers|Decisions made on the spot","Future with going to":"Plans|Intentions|Predictions from what you see now","Future continuous":"Actions in progress at a future time|Polite questions about plans","Future perfect":"Actions finished before a future time|Deadlines","Future perfect continuous":"How long an action will have lasted|Duration up to a future moment","Indicative":"Facts|Statements|Questions|Certainty","Imperative":"Orders|Instructions|Advice|Invitations","Conditional":"Imagined situations|Polite requests|Advice: I would…","Conditional perfect":"Imagined past situations|Regrets|Results that never happened","Present subjunctive":"Formal demands|Recommendations|Necessity: it's vital that…","Past subjunctive":"Wishes|Unreal situations|Advice: if I were you…"},
es:{"Presente":"Habits|Facts|Actions happening now|Near-future plans","Presente continuo":"Actions happening right now|Temporary situations","Pretérito perfecto":"Actions in an unfinished time: hoy, este año|Life experiences|Recent actions","Pretérito indefinido":"Finished actions at a specific time|A series of past events|Completed periods","Pretérito imperfecto":"Past habits|Descriptions in the past|Actions in progress in the past|Age and time in the past","Pretérito imperfecto continuo":"Actions in progress at a past moment|An action that was interrupted","Pretérito pluscuamperfecto":"An action before another past action|Reported past events","Pretérito anterior":"An action just before another past action|Literary texts","Futuro próximo (ir a + infinitivo)":"Plans|Intentions|Things about to happen","Futuro simple":"Future actions|Predictions|Promises|Guesses about the present","Futuro continuo":"Actions in progress at a future moment|Guesses about what's happening now","Futuro perfecto":"Actions finished by a future time|Guesses about the recent past","Condicional simple":"Hypothetical situations|Polite requests|Advice|The future seen from the past","Condicional compuesto":"What would have happened|Regrets|Guesses about the past","Indicativo":"Facts|Certainty|Statements|Questions","Subjuntivo presente":"Wishes|Doubts|Emotions|Requests after que","Subjuntivo perfecto":"Wishes about finished actions|Doubts about the recent past","Subjuntivo imperfecto":"Unreal conditions with si|Past wishes|Polite requests: quisiera…","Subjuntivo pluscuamperfecto":"Unreal past conditions|Regrets about the past","Imperativo":"Orders|Instructions|Advice|Invitations"},
fr:{"Présent":"Habits|General truths|Actions happening now|The near future","Présent progressif":"Actions happening right now|Stressing that something is ongoing","Passé composé":"Finished past actions|A series of past events|Experiences","Passé récent":"Actions that have just happened","Imparfait":"Past habits|Descriptions|Actions in progress in the past|The background to a story","Plus-que-parfait":"An action before another past action|Regrets with si","Passé simple":"Finished actions in literature|Historical texts","Passé antérieur":"An action just before another past action|Literary texts","Futur proche":"Plans|Things about to happen","Futur simple":"Future actions|Predictions|Promises","Futur antérieur":"Actions finished before a future moment|Guesses about the past","Conditionnel présent":"Hypothetical situations|Polite requests|Advice|Wishes","Conditionnel passé":"What would have happened|Regrets|Reproaches","Indicatif":"Facts|Certainty|Statements|Questions","Subjonctif présent":"Wishes|Necessity: il faut que…|Emotions|Doubt","Subjonctif passé":"Finished actions after que|Feelings about the past","Impératif":"Orders|Instructions|Advice|Invitations"},
de:{"Präsens":"Habits|Facts|Actions happening now|The future, with a time word","Perfekt":"Finished past actions|The past in everyday speech","Präteritum":"The past in writing and stories|sein, haben and modal verbs in speech","Plusquamperfekt":"An action before another past action|The background to a past story","Futur I":"Plans|Predictions|Assumptions about the present","Futur II":"Actions finished by a future time|Assumptions about the past","Indikativ":"Facts|Certainty|Statements|Questions","Imperativ":"Orders|Requests|Instructions|Advice","Konjunktiv II":"Wishes|Unreal situations|Polite requests|Advice","Konjunktiv II der Vergangenheit":"Unreal past situations|Regrets","Konjunktiv I":"Reported speech|News and formal writing"}
};
const usesOf=t=>{const u=(USES[S.lang]||{})[t];return u?u.split("|").map(tx):null};

/* ---------------- SMOKE AND FIRE ANIMATION ---------------- */
let fxStop=null;
const reduceMotion=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
const FX_PAST=/^(past|pastcont|pastperf|pastperfcont|pperf|indef|imperf|plusc|pc|imp|pqp|ps|perf|prat)$/,FX_FUT=/^(fut|goingto|futcont|futperf|futperfcont|ira|fp|fa|fut1|fut2)$/;
const fxTheme=k=>FX_PAST.test(k)?"past":FX_FUT.test(k)?"future":"fire";
function fxHTML(title,uses,theme){
  const t=dispTitle(title);
  return `<div class="fx ${theme||"fire"}" data-theme="${theme||"fire"}" role="img" aria-label="${esc(t)} ${T("is used to describe")}: ${esc(uses.join(", "))}">
    ${theme==="subj"?storySVG(t):""}<canvas></canvas>${theme==="subj"?`<div class="st-cap"></div><div class="st-bub man" lang="${S.lang}"></div><div class="st-bub genie" lang="${S.lang}"></div>`:""}<div class="fx-smoke">${esc(t)}<br><span>${T("is used to describe")}…</span></div><div class="fx-word"></div>
    <span class="fx-skip">${T("Tap to skip")}</span></div>
  <div class="uses" hidden><span class="label">${esc(t)} ${T("is used to describe")}</span><ul>${uses.map(u=>`<li>${esc(u)}</li>`).join("")}</ul><button class="btn ghost fx-replay">${T("Replay animation")}</button></div>`;
}
function playFx(body,title,instant){
  if(fxStop)fxStop();
  const uses=usesOf(title);if(!uses)return;
  const stage=body.querySelector(".fx"),list=body.querySelector(".uses"),cv=stage.querySelector("canvas"),smoke=stage.querySelector(".fx-smoke"),word=stage.querySelector(".fx-word");
  const finish=()=>{stop();stage.hidden=true;list.hidden=false};
  if(instant||reduceMotion()){finish();return}
  stage.hidden=false;list.hidden=true;
  const ctx=cv.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);
  let W=0,H=0;const size=()=>{const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const P=[];let raf=0,alive=true,t0=performance.now(),emit=null,water=null,flash=0;
  const LIT={fire:1,ember:1,spark:1,bolt:1},R=Math.random,theme=stage.dataset.theme||"fire";
  const boltPts=(x1,y1,x2,y2,d)=>{let pts=[[x1,y1],[x2,y2]];for(let n=0;n<5;n++){const q=[pts[0]];for(let i=1;i<pts.length;i++){const [ax,ay]=pts[i-1],[bx,by]=pts[i];q.push([(ax+bx)/2+(R()-.5)*d,(ay+by)/2+(R()-.5)*d*.4],[bx,by])}pts=q;d*=.55}return pts};
  const bolt=(x1,y1,x2,y2,d,max)=>add({t:"bolt",pts:boltPts(x1,y1,x2,y2,d),x:0,y:0,vx:0,vy:0,life:0,max:max||9});
  const leafC=()=>`hsl(${95+R()*45},${55+R()*25}%,${30+R()*25}%)`,stoneC=()=>`hsl(205,6%,${32+R()*30}%)`;
  const add=(o)=>{if(P.length<700)P.push(o)};
  const box=el=>{const a=el.getBoundingClientRect(),b=stage.getBoundingClientRect();return {x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}};
  const frame=now=>{
    if(!alive)return;if(!stage.isConnected){stop();return}
    ctx.clearRect(0,0,W,H);
    if(emit)emit(now);
    ctx.globalCompositeOperation="source-over";
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=1;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.vx*=.99;if(p.floor&&p.y>p.floor){p.y=p.floor;p.vy*=-.3;p.vx*=.6}
      const k=p.life/p.max;if(k>=1){P.splice(i,1);continue}
      if(p.t==="smoke"||p.t==="mist"){const r=p.s*(1+k*1.6),a=(p.t==="mist"?.09:.07)*(1-k),c=p.t==="mist"?"150,200,225":"200,200,210";const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill()}
      else if(p.t==="drop"){ctx.fillStyle=`rgba(150,205,240,${.85*(1-k)})`;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*.75,p.s*(1+Math.min(2,Math.abs(p.vy)*.25)),Math.atan2(p.vx,-p.vy),0,7);ctx.fill()}
      else if(p.t==="pebble"){p.r=(p.r||0)+p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=1-k*k;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.8);ctx.restore()}
      else if(p.t==="ripple"){const rx=p.s+p.life*1.8;ctx.strokeStyle=`rgba(170,220,245,${.55*(1-k)})`;ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(p.x,p.y,rx,rx*.22,0,0,7);ctx.stroke()}
      else if(p.t==="bubble"){p.x+=Math.sin(p.life*.25+p.ph)*.4;ctx.strokeStyle=`rgba(210,240,255,${.7*(1-k)})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.stroke()}
      else if(p.t==="leaf"){p.r=(p.r||0)+p.vr;p.x+=Math.sin((p.life+p.ph)*.09)*.8;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,(1-k)*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.42,0,0,7);ctx.fill();ctx.strokeStyle="rgba(10,50,15,.55)";ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(-p.s,0);ctx.lineTo(p.s,0);ctx.stroke();ctx.restore()}}
    if(water&&water.a>0){const lv=water.level;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+8;x+=8)ctx.lineTo(x,lv+Math.sin(x*.045+now*.005)*4+Math.sin(x*.12+now*.009)*2);ctx.lineTo(W,H);ctx.closePath();
      const g=ctx.createLinearGradient(0,lv,0,H);g.addColorStop(0,`rgba(80,165,205,${.6*water.a})`);g.addColorStop(1,`rgba(8,45,75,${.9*water.a})`);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle=`rgba(205,240,255,${.7*water.a})`;ctx.lineWidth=1.5;ctx.beginPath();for(let x=0;x<=W+8;x+=8){const y=lv+Math.sin(x*.045+now*.005)*4+Math.sin(x*.12+now*.009)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
    ctx.globalCompositeOperation="lighter";
    for(const p of P){if(!LIT[p.t])continue;const k=p.life/p.max;
      if(p.t==="spark"){ctx.strokeStyle=`rgba(170,240,255,${1-k})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);ctx.stroke();continue}
      if(p.t==="bolt"){ctx.lineCap="round";ctx.lineJoin="round";for(const [w,c] of [[7,`rgba(90,200,255,${.28*(1-k)})`],[3,`rgba(160,235,255,${.6*(1-k)})`],[1.4,`rgba(255,255,255,${1-k})`]]){ctx.lineWidth=w;ctx.strokeStyle=c;ctx.beginPath();p.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}continue}
      if(p.t==="fire"){const r=p.s*(1-k*.6);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
        const c=k<.25?[255,240,190]:k<.55?[255,150,40]:[220,50,10];g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${.3*(1-k)})`);g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill()}
      else{ctx.fillStyle=`rgba(255,${180-120*k|0},60,${1-k})`;ctx.fillRect(p.x,p.y,p.s,p.s)}}
    if(flash>0){ctx.fillStyle=`rgba(200,240,255,${flash})`;ctx.fillRect(0,0,W,H);flash*=.82;if(flash<.01)flash=0}
    raf=requestAnimationFrame(frame);
  };
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stop=()=>{alive=false;cancelAnimationFrame(raf);emit=null;if(fxStop===stop)fxStop=null};
  fxStop=stop;stage.onclick=finish;
  raf=requestAnimationFrame(frame);
  if(theme==="subj"){storySeq();return}
  if(theme==="past"){pastSeq();return}
  if(theme==="future"){futureSeq();return}
  (async()=>{
    // 1. the statement rises out of smoke
    word.className="fx-word";word.textContent="";smoke.className="fx-smoke in";
    const sb=box(smoke);emit=()=>{for(let i=0;i<2;i++)add({t:"smoke",x:sb.x+Math.random()*sb.w,y:sb.y+sb.h*(.6+Math.random()*.6),vx:(Math.random()-.5)*.6,vy:-.3-Math.random()*.5,s:12+Math.random()*14,life:0,max:70+Math.random()*40})};
    await wait(2600);if(!alive)return;
    smoke.className="fx-smoke out";await wait(700);emit=null;if(!alive)return;
    // 2. each use bursts out of flame, burns, then the next one
    for(const u of uses){
      word.textContent=u;word.style.setProperty("--b","-10%");word.className="fx-word ignite";
      const b=box(word);
      for(let i=0;i<45;i++)add({t:"fire",x:b.x+Math.random()*b.w,y:b.y+b.h*(.4+Math.random()*.7),vx:(Math.random()-.5)*2.4,vy:-1.2-Math.random()*2.6,s:10+Math.random()*16,life:0,max:30+Math.random()*25});
      emit=()=>{for(let i=0;i<3;i++)add({t:"fire",x:b.x+Math.random()*b.w,y:b.y+b.h*(.85+Math.random()*.3),vx:(Math.random()-.5)*.8,vy:-1-Math.random()*1.8,s:7+Math.random()*11,life:0,max:28+Math.random()*22})};
      await wait(500);if(!alive)return;word.className="fx-word lit";
      await wait(1400);if(!alive)return;
      // burn to a crisp: a glowing edge eats the word from the bottom up
      word.className="fx-word burn";const start=performance.now(),dur=1300;
      emit=now=>{const k=Math.min(1,(now-start)/dur);word.style.setProperty("--b",(k*110-10)+"%");const y=b.y+b.h*(1-k);
        for(let i=0;i<3;i++)add({t:"fire",x:b.x+Math.random()*b.w,y:y+Math.random()*8,vx:(Math.random()-.5),vy:-1.4-Math.random()*1.6,s:6+Math.random()*10,life:0,max:20+Math.random()*16});
        for(let i=0;i<3;i++)add({t:"ember",x:b.x+Math.random()*b.w,y,vx:(Math.random()-.5)*1.6,vy:-1.6-Math.random()*2.4,g:.015,s:1.5+Math.random()*2,life:0,max:50+Math.random()*40});
        if(Math.random()<.5)add({t:"smoke",x:b.x+Math.random()*b.w,y,vx:(Math.random()-.5)*.4,vy:-.6,s:10+Math.random()*10,life:0,max:90})};

    }

  })();

  // SUBJUNCTIVE: a short story in which every step is something the subjunctive is used for
  async function storySeq(){
    smoke.hidden=true;word.hidden=true;
    const say0=el=>{el.textContent="";el.classList.remove("on")};
    const svg=stage.querySelector(".st-svg"),q=c=>svg.querySelector(c),cap=stage.querySelector(".st-cap"),bm=stage.querySelector(".st-bub.man"),bg=stage.querySelector(".st-bub.genie");
    const L=STORY[S.lang],ttl=dispTitle(title),GR=222;
    q(".b-chunk").setAttribute("opacity",1);q(".b-in path").setAttribute("opacity",1);q(".b-hole").setAttribute("opacity",0);say0(bm);say0(bg);cap.classList.remove("on");
    let sc=1,ox=0,oy=0;const map=()=>{sc=Math.min(W/350,H/214);ox=(W-350*sc)/2-30*sc;oy=(H-214*sc)/2-34*sc};map();

    const all=(...p)=>Promise.all(p);
    const pause=async ms=>{await wait(ms);if(!alive)throw 0};
    const say=(el,t)=>{el.textContent=t||"";el.classList.toggle("on",!!t)};

    const lerp=(a,b,t)=>a+(b-a)*t;

      const sh=[hip[0]+dir(Math.PI-m.lean,28,f)[0]*-1*-1,hip[1]-Math.cos(m.lean)*28];sh[0]=hip[0]+f*Math.sin(m.lean)*28;
      const hd=[sh[0]+f*Math.sin(m.lean)*11,sh[1]-Math.cos(m.lean)*11];
      const arm=(a,e)=>{const el=[sh[0]+dir(a,12,f)[0],sh[1]+dir(a,12,f)[1]];return [el,[el[0]+dir(a+e,12,f)[0],el[1]+dir(a+e,12,f)[1]]]};
      const A1=arm(m.a1,m.e1),A2=arm(m.a2,m.e2);
      J={hip,sh,hd,hand1:A1[1],hand2:A2[1]};

      q(".m-body").setAttribute("d",[P([l1[1],l1[0],hip,l2[0],l2[1]]),P([hip,sh]),P([A1[1],A1[0],sh,A2[0],A2[1]])].join(" "));

      q(".m-sweat").setAttribute("transform",`translate(${hd[0]-f*7},${hd[1]-4+((now/9)%10)})`);q(".m-sweat").setAttribute("opacity",m.sweat);
      q(".bz").setAttribute("opacity",m.bz);q(".bz").setAttribute("transform",`translate(${sh[0]},${sh[1]-2}) scale(${f},1) rotate(${-m.bza})`);
    };
    const render=now=>{
      for(let i=tws.length-1;i>=0;i--){const t=tws[i],k=Math.min(1,(now-t.t0)/t.ms);t.o[t.k]=t.a+(t.b-t.a)*ease[t.e](k);if(k>=1){tws.splice(i,1);t.r()}}
      if(man.walk)man.ph+=.16;

      q(".b-out").setAttribute("transform",`translate(${B.x},${B.y}) rotate(${B.rot})`);q(".b-out").setAttribute("opacity",B.show);
      q(".b-in").setAttribute("transform",`translate(230,${190-IN.lift}) scale(${IN.s})`);q(".b-in").setAttribute("opacity",IN.o);
      q(".b-in path").setAttribute("opacity",IN.rock);q(".b-in").style.filter=IN.glow?`drop-shadow(0 0 ${IN.glow*10}px rgba(255,210,90,${IN.glow}))`:"";
      q(".b-word").setAttribute("fill",IN.glow>.5?"#fff3c4":"#3b2414");
      const lx=lerp(LP.x,J.hand1[0]+man.f*2,LP.hold),ly=lerp(LP.y,J.hand1[1]-3,LP.hold)+Math.sin(now*.06)*LP.jit;

      const gy=G.y+Math.sin(now*.003)*3;
      q(".g-body").setAttribute("transform",`translate(${G.x},${gy}) scale(${G.s})`);q(".genie").setAttribute("opacity",G.o);
      const sx=lx+17*.8,sy=ly-5*.8;q(".g-tail").setAttribute("d",`M${sx},${sy} C${sx+18},${sy-14} ${G.x+16},${gy+28} ${G.x},${gy+2}`);

      q(".g-brow").setAttribute("d",G.sad>.5?"M-6,-41 L-1.5,-43.5 M6,-41 L1.5,-43.5":"M-6,-42 L-1.5,-41.5 M6,-42 L1.5,-41.5");

function trumpCard(kind,num,label,sub,unit){
  const neon=kind==="neon",id="g"+Math.random().toString(36).slice(2,8);
  return `<div class="tcard ${kind}"><div class="tc-face">${cardSVG(id,neon)}

    <div class="tc-mid"><span class="tc-num"${String(num).length>3?' style="font-size:20cqw"':String(num).length>2?' style="font-size:26cqw"':""}>${num}${unit?`<small>${unit}</small>`:""}</span><span class="tc-lbl">${esc(label)}</span></div>

}

  const out=[];
  for(const [v] of G.verbs)personsOf(L).forEach((per,i)=>{
    const ok=tenses.filter(x=>!NU.test(G.conj(v,x[0])[i])),t=ok[Math.random()*ok.length|0],ans=G.conj(v,t[0])[i];
    const indicForms=new Set(tenses.map(x=>unPrefix(G.conj(v,x[0])[i])));
    const extra=L==="en"&&v!=="be"?[`${per} would be ${ENV[v][4]}`,`${per} would have been ${ENV[v][4]}`]:[];
    const wrong=[...new Set(marked.map(x=>G.conj(v,x[0])[i]).concat(extra))].filter(w=>!NU.test(w)&&!indicForms.has(unPrefix(w))&&w!==ans);
    if(wrong.length>=3)out.push({p:T("Which of these is in the {mood}? (“{v}”, {per})",{mood:dispTitle(it[1]),v,per}),a:ans,w:pick(wrong,3)});
  });
  return pick(out,QN);
}
function verbQuestions(L,it){
  if(INDIC.includes(it[1]))return indicativeQuestions(L,it);
  const G=GRAM[L],k=it[0],title=it[1],verbs=G.verbs.map(v=>v[0]);
  const others=allItems(L).filter(x=>x[0]&&x[0]!==k&&x[0]!=="imper"&&!INDIC.includes(x[1]));
  const A=[],B=[];
  for(const v of verbs){
    const rows=G.conj(v,k);
    rows.forEach((row,i)=>{
      if(k==="imper"){
        let label=(row.match(/^\(([^)]*)\)/)||[])[1]||row.split(" ").slice(-1)[0].replace(/[!.]/g,"");
        if(L==="en")label=T(/Don't/.test(row)?"you, negative":label==="you"?"you, positive":"we (suggestion)");
        const ans=unPrefix(row),wrong=[...new Set(rows.filter((_,j)=>j!==i).map(unPrefix).concat(unPrefix(G.conj(v,"pres")[2]),unPrefix(G.conj(v,"pres")[4])))].filter(w=>w!==ans);
        if(wrong.length>=3)A.push({p:T("Imperative of “{v}” for {who}:",{v,who:label}),a:ans,w:pick(wrong,3)});
        const tt=[...new Set(others.map(o=>o[1]))];if(tt.length>=3)B.push({p:T("Which tense or mood is “{form}”?",{form:row}),a:title,w:pick(tt,3),tr:1});
        return;
      }
      if(NU.test(row))return;
      const ans=unPrefix(row);
      const wrong=[...new Set(others.map(o=>unPrefix(G.conj(v,o[0])[i])))].filter(w=>w!==ans&&!NU.test(w));
      if(wrong.length>=3)A.push({p:T("{tense}: “{v}” with {per}",{tense:dispTitle(title),v,per:personsOf(L)[i]}),a:ans,w:pick(wrong,3)});
      const clash=others.some(o=>unPrefix(G.conj(v,o[0])[i])===ans);
      if(!clash){const t=[...new Set(others.filter(o=>unPrefix(G.conj(v,o[0])[i])!==ans&&!NU.test(G.conj(v,o[0])[i])).map(o=>o[1]))].filter(t2=>t2!==title);
        if(t.length>=3)B.push({p:T("Which tense or mood is “{form}”?",{form:row}),a:title,w:pick(t,3),tr:1})}
    });
  }
  const nb=Math.min(4,B.length);return shuffle([...pick(A,QN-nb),...pick(B,nb)]).slice(0,QN);
}
function parseQ(s){const [p,a,...w]=tx(s).split("|");return {p,a,w}}
function quizFor(L,it){return it[0]?verbQuestions(L,it):shuffle((OQ[L][it[1]]||[]).map(parseQ)).slice(0,QN)}

function quiz(id,title,qs,back){
  run++;const lg=LG();document.body.className=lg.cls;
  qs=qs.map(q=>{const f=q.tr?dispTitle:(x=>x);return {p:q.p,a:f(q.a),o:shuffle([q.a,...q.w]).map(f)}});
  let pos=0,right=0;const res=[];
  const draw=()=>{
    const q=qs[pos];
    $("#app").innerHTML=`${topbar()}
    <section style="display:flex;flex-direction:column;gap:8px"><span class="label">${id===FINAL_ID?T("Final quiz · intermediate"):T("Quiz")} · ${esc(title)}</span>
      <div class="dots">${qs.map((_,i)=>`<i class="${res[i]===true?"ok":res[i]===false?"no":i===pos?"now":""}"></i>`).join("")}</div></section>
    <section class="panel turn" style="gap:14px;max-width:680px">
      <span class="label">${T("Question {n} of {m}",{n:pos+1,m:qs.length})}</span>
      <h2 class="qp">${esc(q.p)}</h2>
      <div class="qopts" id="qopts">${q.o.map((o,i)=>`<button class="qo" data-i="${i}" lang="${S.lang}">${esc(o)}</button>`).join("")}</div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="btns" id="acts"></div>
    </section>`;
    wireTop();
    $("#qopts").onclick=e=>{const b=e.target.closest(".qo");if(!b||res[pos]!=null)return;
      const ok=q.o[+b.dataset.i]===q.a;res[pos]=ok;if(ok)right++;
      document.querySelectorAll(".qo").forEach((x,i)=>{x.disabled=true;if(q.o[i]===q.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const f=$("#fb");f.className="fb "+(ok?"ok":"no");f.textContent=ok?T("Correct!"):T("Not quite. The answer is “{a}”.",{a:q.a});
      $("#acts").innerHTML=`<button class="btn" id="nx">${T(pos<qs.length-1?"Next question":"See my score")} →</button>`;
      $("#nx").onclick=()=>{pos++;if(pos<qs.length)draw();else end()};$("#nx").focus();
      document.querySelectorAll(".dots i")[pos].className=ok?"ok":"no";
    };
  };
  const end=()=>{
    const prev=qzBest(id)||0,gain=Math.max(0,right-prev);
    S.qz=S.qz||{};if(qzBest(id)==null||right>prev)S.qz[id]=right;bumpScore(gain);saveProg();
    const unlocked=id!==FINAL_ID&&allItems(S.lang).every(it=>qzBest(it[1])!=null)&&qzBest(FINAL_ID)==null;
    $("#app").innerHTML=`${topbar()}
    <section class="panel" style="align-items:flex-start;gap:12px;max-width:680px">
      <span class="label">${id===FINAL_ID?T("Final quiz complete"):T("Quiz complete")} · ${esc(title)}</span>
      <div class="tcards">${trumpCard("gold",right,T("Quiz points"),`${title} · ${right}/${qs.length}`)}${trumpCard("neon",S.score,T("Total score"),T(lg.name))}</div>
      <p class="lede">${gain?(gain===1?T("+1 point added."):T("+{n} points added.",{n:gain})):prev&&right<=prev?T("Your best on this quiz is {b}/{n}. Beat it to earn more points.",{b:prev,n:qs.length}):T("No points this time.")} ${T("1 point for each correct answer.")}</p>
      ${unlocked?`<p class="note">${T("You've finished every topic quiz. The final quiz is now unlocked at the bottom of the grammar list.")}</p>`:""}
      <div class="btns"><button class="btn" id="again">${T("Retake quiz")}</button><button class="btn ghost" id="bk">${T("Back to grammar")}</button></div>
    </section>`;
    wireTop();
    $("#again").onclick=()=>quiz(id,title,id===FINAL_ID?finalQs():quizFor(S.lang,allItems(S.lang).find(it=>it[1]===id)),back);
    $("#bk").onclick=back;
  };
  draw();
}
function finalQs(){return shuffle(FINALQ[S.lang].map(parseQ))}

/* ---------------- DONE ---------------- */
function done(){
  run++;const lg=LG();S.score=calcScore(S);saveProg();
  const hard=[...lg.letters.filter(x=>S.miss.includes(x.l)),...lg.teams.filter(x=>S.tmiss.includes(kid(x)))];
  $("#app").innerHTML=`${topbar()}
  <section class="panel" style="align-items:flex-start;gap:14px">
    <span class="label">${T("{lang} complete: letters, letter teams and reading",{lang:T(lg.name)})}</span>
    <div class="big">${S.score} ${T("pts")}</div>
    ${strengths()}
    <p class="lede">${T("+{a} for letters and letter teams said correctly, −{b} for the ones you struggled with, +{c} for reading (best score on each of the {n} texts), +{d} from grammar quizzes. Each letter or letter team counts only once.",{a:S.got.length+S.tgot.length,b:S.miss.length+S.tmiss.length,c:rbSum(),n:RD().texts.length,d:qzSum(S)})}</p>
    <section style="display:flex;flex-direction:column;gap:8px;width:100%"><span class="label">${T("Struggled with · {n}",{n:hard.length})}</span>
      ${hard.length?`<div class="chips">${hard.map(x=>`<span class="chip miss" style="cursor:default"><b lang="${S.lang}">${esc(disp(x))}</b><span class="ipa">${esc(ipaTxt(x.snd))}</span></span>`).join("")}</div>`:`<p>${T("None. You pronounced every letter and letter team correctly.")}</p>`}</section>
    <span class="label">${T("Letters · green = point earned · red = struggled")}</span>
    <div class="chips">${lg.letters.map(x=>`<span class="chip ${S.miss.includes(x.l)?"miss":S.got.includes(x.l)?"ok":""}" style="cursor:default"><b>${up(x.l)}</b></span>`).join("")}</div>
    <span class="label">${T("Letter teams")}</span>
    <div class="chips">${lg.teams.map(x=>`<span class="chip ${S.tmiss.includes(kid(x))?"miss":S.tgot.includes(kid(x))?"ok":""}" style="cursor:default"><b lang="${S.lang}">${esc(x.l)}</b></span>`).join("")}</div>
    <div class="btns"><button class="btn" id="toNext">${T("Continue: what's next")} →</button>${hard.length?`<button class="btn" id="rvH">${T("Practise the ones I struggled with")}</button>`:""}<button class="btn" id="rvL">${T("Review 5 random letters")}</button><button class="btn" id="rvT">${T("Review 5 random teams")}</button><button class="btn" id="rdA">${T("Reading practice")}</button><button class="btn ghost" id="restart">${T("Start again from A")}</button><button class="btn ghost" id="other">${T("Home")}</button></div>
  </section>`;
  wireTop();
  $("#toNext").onclick=hub;
  if($("#rvH"))$("#rvH").onclick=()=>review(shuffle(hard),done);
  $("#rvL").onclick=()=>review(shuffle(lg.letters).slice(0,5),done);
  $("#rvT").onclick=()=>review(shuffle(lg.teams).slice(0,5),done);
  $("#rdA").onclick=()=>{S.ph="reading";saveProg();readingPage(0)};
  $("#restart").onclick=()=>{S.ph="letters";S.idx=0;S.tidx=0;S.score=0;S.got=[];S.tgot=[];S.miss=[];S.tmiss=[];S.rb=[0,0,0,0];S.qz={};learn()};
  $("#other").onclick=home;
}

/* ---------------- RULES ---------------- */
function rules(){
  run++;const lg=LG();
  $("#app").innerHTML=`<div class="top"><div class="left"><button class="btn ghost" id="backL">← ${T("Back to lessons")}</button><h2>${T("{lang} pronunciation rules",{lang:T(lg.name)})}</h2></div><span class="score" id="score">${S.score} ${T("pts")}</span></div>
  <p class="lede">${esc(tx(lg.intro))} ${T("Tap any example to hear it.")}</p>
  <div class="rules" id="rulesG">${lg.rules.map(r=>`<section class="panel"><h3>${esc(tx(r.t))}</h3><p>${esc(tx(r.d))}</p>
    <div class="chips">${r.ex.map(s=>{const e=pw(s),m=mean(e);return `<button class="chip" data-say="${esc(e.w)}">${SPK_SVG}<b lang="${S.lang}">${esc(e.w)}</b>${m?`<span>${esc(m)}</span>`:""}</button>`}).join("")}</div></section>`).join("")}</div>`;
  $("#backL").onclick=learn;
  wireChips($("#rulesG"));
}

home();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
