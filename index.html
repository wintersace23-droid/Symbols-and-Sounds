<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1119">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Symbols &amp; Sounds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Charis+SIL:wght@400;700&family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a phonics bench. A single keycap-like letter sits on the left (top on phones); the sound, the two words, the variations and "your turn" stack beside it. A rail of the whole alphabet runs above, with a dot under every 6th letter marking a review stop. */
:root{
  --bg:#eff1f6; --surface:#ffffff; --ink:#161a2b; --muted:#585e76; --line:#d9dce8;
  --en:#2c5ee8; --es:#cf3f22; --fr:#6a3dd0; --de:#0b7f61; --on-acc:#ffffff;
  --good:#1d8150; --bad:#c23a32; --warn:#a35f00;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;
  --acc:var(--en);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}
.l-en{--acc:var(--en)} .l-es{--acc:var(--es)} .l-fr{--acc:var(--fr)} .l-de{--acc:var(--de)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px;--soft:color-mix(in srgb,var(--acc) 13%,var(--surface))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:900;font-variation-settings:"wdth" 118;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:800;font-variation-settings:"wdth" 110}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.lede{color:var(--muted);max-width:60ch;font-size:1.08rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--muted)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--on-acc)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* Home */
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:820px){.langs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lang{appearance:none;cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 6px 0 var(--acc);transition:transform .15s}
.lang:hover{transform:translateY(-3px)}
.lang .spec{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(3.6rem,14vw,5.4rem);line-height:1;color:var(--acc)}
.lang .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variation-settings:"wdth" 110;letter-spacing:.02em}
.lang .meta{color:var(--muted);font-size:.9rem}
.lang .prog{font-size:.82rem;font-weight:700;color:var(--acc)}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.howto b{display:block;font-family:var(--display);font-weight:800}
.note{font-size:.92rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}

/* Learn */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.top .left{display:flex;align-items:center;gap:10px;min-width:0}
.score{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:6px 14px;font-size:1.05rem}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.rail-wrap{overflow-x:auto;padding-bottom:6px}
.rail{display:flex;gap:4px;min-width:max-content}
.rail button{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:38px;cursor:pointer;font-family:var(--display);font-weight:800;position:relative;font-size:.95rem}
.rail button.done{background:var(--soft);border-color:var(--acc)}
.rail button.cur{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.rail button.miss{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.chip.ok{border-color:var(--good)} .chip.miss{border-color:var(--bad);color:var(--bad)}
.rail button.cp::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.bench{display:grid;gap:18px}
@media(min-width:780px){.bench{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.tilecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{appearance:none;cursor:pointer;width:100%;max-width:360px;aspect-ratio:1/1;border-radius:28px;border:2px solid var(--line);background:var(--surface);box-shadow:0 10px 0 var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:transform .12s, box-shadow .12s}
.tile:active{transform:translateY(6px);box-shadow:0 4px 0 var(--acc)}
.tile .g{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;line-height:.9;font-size:clamp(6rem,30vw,9.5rem);display:flex;align-items:baseline;gap:.08em}
.tile .g small{font-size:.55em;color:var(--acc)}
.tile .nm{font-size:1rem;color:var(--muted);font-weight:600}
.tile.playing{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 10px 0 var(--acc),0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}100%{box-shadow:0 10px 0 var(--acc),0 0 0 22px transparent}}
.tapcap{font-weight:700;color:var(--acc);display:flex;gap:8px;align-items:center}
.ipa{font-family:var(--ipa);font-size:1.15em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.soundline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.soundline .ipa{font-size:2rem;color:var(--acc);font-weight:700}
.stage{min-height:112px;border-radius:14px;background:var(--soft);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stage .count{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage .w{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 108;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;overflow-wrap:anywhere}
.stage .w mark{background:none;color:var(--acc);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.stage .m{color:var(--muted)}
.stage.empty{color:var(--muted)}
.stage .w,.stage .m{animation:rise .35s ease-out}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}}
.vars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vars li{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.vars li:first-child{border-top:0;padding-top:0}
.vars .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vars .hd .ipa{color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;max-width:100%;text-align:left}
.chip b{font-weight:700}
.chip span{color:var(--muted);font-size:.88rem}
.chip:hover{border-color:var(--acc)}
.turn{border:2px solid var(--acc)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}}
.turnrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.turnrow>div{flex:1 1 200px;min-width:0}
.fb{font-weight:700;min-height:1.5em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--acc)}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rules .panel h3{font-size:1.05rem}
.big{font-family:var(--display);font-weight:900;font-size:clamp(3rem,12vw,5rem);font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--surface);align-self:flex-start;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button span{font-weight:600;opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.rail.teams button{width:auto;min-width:40px;padding:0 9px;font-size:.82rem;white-space:nowrap}
.tile .g.team{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;text-align:center;justify-content:center;flex-wrap:wrap;padding:0 14px;font-variation-settings:"wdth" 112}
@media(max-width:779px){.tile .g.team{font-size:clamp(2.2rem,11vw,3.4rem)}}
.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.syl{font-weight:600;letter-spacing:.01em}
.syl .st{color:var(--acc);font-weight:800}
.wd .st{color:inherit;font-weight:800;box-shadow:inset 0 -3px 0 var(--acc)}
.syl .dot{color:var(--muted);margin:0 1px}
.passage{appearance:none;text-align:left;cursor:pointer;background:var(--soft);border:2px dashed var(--acc);border-radius:16px;padding:18px;font-family:var(--body);font-size:clamp(1.15rem,4.4vw,1.45rem);line-height:1.9;color:var(--ink);max-width:70ch}
.passage.paused{border-style:dashed;border-color:var(--warn)}
.passage.on{border-style:solid;animation:ring 1.4s ease-out infinite}
.wd{border-radius:5px;padding:1px 2px;transition:background .2s,color .2s}
.wd.next{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.wd.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.wd.close{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);text-decoration:underline dotted}
.wd.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);text-decoration:underline wavy;text-underline-offset:4px}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally .t{font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.t.ok{color:var(--good)} .t.close{color:var(--warn)} .t.bad{color:var(--bad)}
.probs{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prob{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prob.close{border-left-color:var(--warn)}
.prob .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pw{font-family:var(--display);font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
mark.lx{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);border-radius:3px}
.tpick{display:flex;flex-wrap:wrap;gap:8px}
.tpick .chip.on{border-color:var(--acc);background:var(--soft)}
.tpick .chip b{font-family:var(--display)}
.lvl{font-weight:800;color:var(--acc);font-size:.8rem;letter-spacing:.06em}
.hubs{display:flex;flex-direction:column;gap:12px;max-width:680px}
.hubc{appearance:none;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 5px 0 var(--acc)}
.hubc:disabled{cursor:default;box-shadow:none;opacity:.6}
.hubc .hn{font-family:var(--display);font-weight:900;font-size:1.8rem;color:var(--acc);width:1.4em;flex:0 0 auto;text-align:center}
.hubc .ht{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hubc .ht b{font-family:var(--display);font-weight:800;font-size:1.15rem}
.hubc .ht span{color:var(--muted);font-size:.92rem}
.hubc .go{font-size:1.5rem;color:var(--acc);font-weight:800}
.hubc .soon{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.glist{display:flex;flex-direction:column;gap:18px;max-width:760px}
.gg{display:flex;flex-direction:column;gap:8px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.gi[open]{border-color:var(--acc)}
.gi summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:14px 16px;font-weight:700;font-size:1.05rem}
.gi summary::-webkit-details-marker{display:none}
.gi summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:14px}
.rn{font-family:var(--ipa);color:var(--acc);font-weight:700;min-width:3.4em;font-variant-numeric:tabular-nums}
.gt{flex:1;min-width:0}
.chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);align-self:center;transition:transform .2s}
.gi[open] .chev{transform:rotate(-135deg)}
.gbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.form{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.form p{font-weight:600}
.more{align-self:flex-start}
.extra{display:flex;flex-direction:column;gap:10px}
.vpick .chip.on{border-color:var(--acc);background:var(--soft)}
.conj{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.conj button,.tbl-wrap td button{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-weight:600}
.conj button{display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.conj button svg{flex:0 0 auto;color:var(--acc)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl-wrap table{border-collapse:collapse;width:100%;min-width:max-content}
.tbl-wrap th,.tbl-wrap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-wrap th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--soft)}
.tbl-wrap tr:last-child td{border-bottom:0}
.tbl-wrap td button:hover{color:var(--acc)}
.quizrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.qbadge{font-size:.78rem;font-weight:800;color:var(--good);border:1.5px solid var(--good);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;align-self:center}
.final{border:2px solid var(--acc)}
.final.locked{border-style:dashed;border-color:var(--line);opacity:.8}
.qp{font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:800;line-height:1.3}
.qopts{display:grid;gap:10px}
.qo{appearance:none;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-weight:600;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.qo:hover:not(:disabled){border-color:var(--acc)}
.qo:disabled{cursor:default}
.qo.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.qo.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fx{position:relative;height:clamp(220px,46vw,300px);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 115%,#3a1204 0%,#0d0604 55%,#050304 100%);cursor:pointer}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-smoke,.fx-word{position:absolute;left:0;right:0;top:50%;padding:0 18px;text-align:center;font-family:var(--display);translate:0 -50%}
.fx-smoke{font-weight:800;font-size:clamp(1.4rem,5.5vw,2.2rem);line-height:1.15;color:#ecebf2;opacity:0;filter:blur(14px);transform:translateY(16px) scale(1.05);transition:opacity 1.6s ease,filter 1.8s ease,transform 1.8s ease}
.fx-smoke span{font-size:.62em;font-weight:600;color:#bdb9c9}
.fx-smoke.in{opacity:1;filter:blur(0);transform:none}
.fx-smoke.out{opacity:0;filter:blur(16px);transform:translateY(-26px) scale(1.08);transition-duration:.7s}
.fx-word{padding-block:60px 40px;font-weight:900;font-variation-settings:"wdth" 110;font-size:clamp(1.9rem,8vw,3.2rem);line-height:1.05;color:#fff6d8;opacity:0;text-wrap:balance;--b:-10%;-webkit-mask-image:linear-gradient(to top,transparent var(--b),#000 calc(var(--b) + 12%));mask-image:linear-gradient(to top,transparent var(--b),#000 calc(var(--b) + 12%))}
.fx-word.ignite{opacity:1;animation:ignite .5s ease-out both}
.fx-word.lit{opacity:1;animation:flicker .18s infinite alternate}
.fx-word.burn{opacity:1;color:#3a2416;text-shadow:0 0 6px #ff6a00,0 0 18px #b32000;transition:color .5s,text-shadow .5s}
.fx-word.gone{opacity:0;transition:opacity .4s}
@keyframes ignite{0%{opacity:0;transform:scale(.85) translateY(20px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes flicker{0%{text-shadow:0 0 4px #fff,0 -4px 10px #ffd23f,0 -10px 20px #ff8a00,0 -18px 34px #ff3d00}100%{text-shadow:0 0 6px #fff,0 -6px 14px #ffe066,0 -14px 26px #ff9a1f,0 -24px 42px #ff2a00}}
.fx-skip{position:absolute;right:12px;bottom:10px;font-size:.7rem;color:#9c8f88;letter-spacing:.08em;text-transform:uppercase}
.uses{display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--acc);padding-left:12px}
.uses ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:1.05rem}
.uses .fx-replay{align-self:flex-start}
.tcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;padding-block:6px}
.tcard{width:min(37vw,210px);aspect-ratio:5/7;perspective:900px}
.tc-face{container-type:inline-size;position:relative;width:100%;height:100%;border-radius:14px;display:grid;place-items:center;overflow:hidden;animation:flipin .8s cubic-bezier(.2,.8,.2,1) both}
.tcard.neon .tc-face{animation-delay:.3s}
.tcard.gold .tc-face{background:radial-gradient(ellipse at 50% 30%,#1f1c17,#050505 72%);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #6b5420}
.tc-orn{position:absolute;inset:0;width:100%;height:100%}
.tc-mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.tc-num{font-family:var(--display);font-weight:900;font-size:34cqw;line-height:1;font-variant-numeric:tabular-nums}
.tc-lbl{font-size:6cqw;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.tc-c{position:absolute;font-family:var(--display);font-weight:900;font-size:8.5cqw;font-variant-numeric:tabular-nums}
.tc-c.tl{top:9.5%;left:15%} .tc-c.br{bottom:9.5%;right:15%;transform:rotate(180deg)}
.tc-sub{position:absolute;bottom:12.5%;left:22%;right:22%;text-align:center;font-size:5.4cqw;letter-spacing:.06em;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .tc-face{box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px #6b5420}
.tcard.gold .tc-face{background:radial-gradient(ellipse at 50% 30%,#1f1c17,#050505 72%)}
.tcard.neon .tc-face{background:radial-gradient(ellipse at 50% 42%,#2a0a5e 0%,#6a12c9 42%,#ff2bd6 82%,#ff6ae6 100%)}
.tcard.silver .tc-face{background:linear-gradient(135deg,#dfe2e6 0%,#9fa4ad 28%,#cdd0d5 50%,#858a94 74%,#c6c9cf 100%)}
.tc-num{background:linear-gradient(180deg,#fbeab0,#c9982f 55%,#f3d98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tc-lbl,.tc-c{color:#e9c96b} .tc-sub{color:#e3c46c}
.tc-mid,.tc-c,.tc-sub{filter:drop-shadow(0 1px 1px rgba(0,0,0,.8)) drop-shadow(0 0 3px rgba(0,0,0,.35))}
.tc-num small{font-size:.38em;margin-left:.04em}
.tcards.three{gap:8px;flex-wrap:nowrap}
.tcards.three .tcard{width:min(27vw,190px)}
.tcards.three .tc-sub{white-space:pre-line;line-height:1.15;bottom:10.5%;left:16%;right:16%}
.tcards.three .tcard:nth-child(2) .tc-face{animation-delay:.15s}
.tcards.three .tcard:nth-child(3) .tc-face{animation-delay:.3s}
.strengths{display:flex;flex-direction:column;gap:8px;width:100%}
@keyframes flipin{0%{transform:rotateY(90deg) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.hidden{display:none}
@media(max-width:779px){.tile{max-width:min(240px,64vw)}.tile .g{font-size:clamp(5rem,24vw,7rem)}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}

function pickVoice(tag){const b=tag.slice(0,2).toLowerCase();
  const g=voices.filter(v=>v.lang&&/google/i.test(v.name));
  return g.find(v=>v.lang.replace("_","-").toLowerCase()===tag.toLowerCase())||g.find(v=>v.lang.toLowerCase().startsWith(b))||voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase()===tag.toLowerCase())||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(b))}
function speak(text,tag,rate){return new Promise(res=>{
  if(!hasTTS){setTimeout(res,700);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=tag;const v=pickVoice(tag);if(v)u.voice=v;u.rate=rate||.8;
    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,3000+text.length*250);
    setTimeout(()=>speechSynthesis.speak(u),60)}catch(e){setTimeout(res,700)}})}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let mode=SR?"voice":"self";

function listen(tag){return new Promise(res=>{
  let r;try{r=new SR()}catch(e){res({err:"unsupported"});return}
  r.lang=tag;r.maxAlternatives=5;r.interimResults=false;r.continuous=false;
  let alts=null,err=null,ended=false;
  r.onresult=e=>{try{alts=[...e.results[0]].map(a=>a.transcript)}catch(x){alts=[]}};
  r.onerror=e=>{err=e.error||"error"};
  r.onend=()=>{if(ended)return;ended=true;res(alts&&alts.length?{alts}:{err:err||"no-speech"})};

  setTimeout(()=>{try{r.stop()}catch(e){}},6500)})}
const HARD=["not-allowed","service-not-allowed","unsupported","language-not-supported"];
const norm=s=>s.toLowerCase().replace(/[.,!?¿¡"“”«»:;()\-]/g," ").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function accepts(x,alts){
  const special="äöüñß".includes(x.l);
  const set=new Set(x.al.map(norm));
  const sset=new Set([...set].map(strip));
  for(const a of alts){
    const t=norm(a);if(!t)continue;
    if(set.has(t))return true;
    const toks=t.split(" ");
    if(toks.length<=3&&toks.some(k=>set.has(k)))return true;
    if(!special){const st=strip(t);if(sset.has(st))return true;if(toks.length<=3&&toks.map(strip).some(k=>sset.has(k)))return true}
  }
  return false;
}
function hl(word,letter){
  const re=new RegExp("("+letter.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc(word).replace(re,"<mark>$1</mark>");
}

let S={lang:null,ph:"letters",idx:0,tidx:0,score:0,got:[],tgot:[],miss:[],tmiss:[],rb:[0,0,0,0],qz:{}};
let run=0; // cancels audio sequences
function loadProg(lang){try{return JSON.parse(localStorage.getItem("aa-"+lang)||"null")}catch(e){return null}}
function saveProg(){try{localStorage.setItem("aa-"+S.lang,JSON.stringify({ph:S.ph,idx:S.idx,tidx:S.tidx,score:S.score,got:S.got,tgot:S.tgot,miss:S.miss,tmiss:S.tmiss,rb:S.rb,qz:S.qz||{}}))}catch(e){}}
const LG=()=>LANGS[S.lang];
const isT=()=>S.ph==="teams";
const items=()=>isT()?LG().teams:LG().letters;
const ci=()=>isT()?S.tidx:S.idx;
const setCi=i=>{if(isT())S.tidx=i;else S.idx=i};
const gotArr=()=>isT()?S.tgot:S.got;
const kid=x=>x.team?x.l+"|"+x.snd:x.l;
const disp=x=>x.team?x.l:up(x.l);
const unitWord=()=>isT()?"team":"letter";
const calcScore=p=>(p.got||[]).length+(p.tgot||[]).length-(p.miss||[]).length-(p.tmiss||[]).length+rbFrom(p).reduce((a,b)=>a+b,0)+qzSum(p);
const Gx=x=>x.team?S.tgot:S.got, Mx=x=>x.team?S.tmiss:S.miss;
// +1 once per item for a correct pronunciation; −1 once per item for a mistake (and it's recorded)
function award(x){const g=Gx(x);if(g.includes(kid(x)))return 0;g.push(kid(x));refreshScore();return 1}
function penalise(x){const m=Mx(x);if(m.includes(kid(x)))return 0;m.push(kid(x));refreshScore();return -1}
function refreshScore(){bumpScore(0)}
function bumpScore(d){const before=S.score;S.score=calcScore(S);saveProg();if(S.score===before)return;const el=$("#score");if(el){el.textContent=S.score+" pts";el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function matchWord(target,alts){
  const t=norm(target),ts=strip(t);
  for(const a of alts){const n=norm(a);if(!n)continue;
    if(n===t||strip(n)===ts)return true;
    if((" "+n+" ").includes(" "+t+" ")||(" "+strip(n)+" ").includes(" "+ts+" "))return true;
    if(ts.length>=5&&n.split(" ").some(k=>lev(strip(k),ts)<=1))return true;
  }
  return false;
}
function hlx(word,x){
  const pats=x.team?x.pat:[x.l];
  const re=new RegExp("("+pats.map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return esc(word).replace(re,"<mark>$1</mark>");
}

let micReady=false,meterStop=null;
function framePolicyBlocksMic(){try{const p=document.permissionsPolicy||document.featurePolicy;return !!(p&&p.allowsFeature&&p.allowsFeature("microphone")===false)}catch(e){return false}}
function micSetup(){
  run++;const lg=LG();document.body.className=lg.cls;
  $("#app").innerHTML=`<div class="top"><div class="left"><button class="btn ghost" id="back">← Languages</button><h2>${lg.name}</h2></div></div>

    <div class="turnrow"><button class="mic" id="askMic" aria-label="Allow microphone">${MIC_SVG}</button>
      <div><p><b>Tap to allow the microphone</b></p><p class="label" id="micMsg" style="margin-top:4px">Then choose “Allow” in the browser's prompt</p></div></div>
    <div id="meterBox" hidden style="display:flex;flex-direction:column;gap:6px"><span class="label">Say something to test it</span>
      <div style="height:14px;border-radius:7px;background:var(--line);overflow:hidden"><div id="meter" style="height:100%;width:0;background:var(--good);transition:width .08s"></div></div></div>
    <div class="fb" id="micFb" aria-live="polite"></div>
    <div class="btns" id="micActs"><button class="btn ghost" id="selfGo">Continue without the microphone</button></div>
  </section>`;
  $("#back").onclick=()=>{stopMeter();home()};
  $("#selfGo").onclick=()=>{stopMeter();mode="self";micReady=true;micNote=micNote||"You chose to continue without the microphone, so you'll mark your own answers.";learn()};
  const fb=(k,t)=>{const f=$("#micFb");f.className="fb "+k;f.textContent=t};
  const fail=(t)=>{fb("no",t);mode="self";micNote=t;$("#selfGo").textContent="Continue and mark my own answers";$("#selfGo").className="btn"};
  if(!SR){fail("This browser can't turn speech into text, so it can't check pronunciation. Open this file in Google Chrome.");return}
  if(!window.isSecureContext){fail("Chrome only allows the microphone on pages opened from a secure web address (https://…). On a phone, open the app from its web link instead of from a downloaded file.");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail("This browser doesn't allow microphone access here. Open this file in Google Chrome.");return}
  $("#askMic").onclick=async()=>{
    $("#micMsg").textContent="Waiting for your permission…";fb("","");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mode="voice";micReady=true;micNote="";
      $("#askMic").disabled=true;$("#micMsg").textContent="Microphone allowed";
      fb("ok","Microphone is on. Say something and watch the bar move.");
      startMeter(stream);
      $("#micActs").innerHTML=`<button class="btn" id="goLearn">Start learning →</button>`;
      $("#goLearn").onclick=()=>{stopMeter();learn()};$("#goLearn").focus();
    }catch(e){
      const n=e&&e.name;
      $("#micMsg").textContent="Microphone not available";
      if(framePolicyBlocksMic()||(window.top!==window&&(n==="NotAllowedError"||n==="SecurityError")))
        fail("This page isn't allowed to use the microphone. Open the file directly in Google Chrome, not inside another app.");
      else if(n==="NotAllowedError")fail("Microphone permission was denied. Click the microphone icon at the right of Chrome's address bar, choose Allow, then reload the page.");
      else if(n==="NotFoundError")fail("No microphone was found. Connect one and reload the page.");
      else fail("The microphone couldn't be started ("+(n||"unknown error")+").");
    }
  };
}
function startMeter(stream){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();const src=ctx.createMediaStreamSource(stream);const an=ctx.createAnalyser();an.fftSize=512;src.connect(an);
    const buf=new Uint8Array(an.fftSize);let raf;$("#meterBox").hidden=false;
    const loop=()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));const el=$("#meter");if(el)el.style.width=Math.min(100,m/64*100)+"%";raf=requestAnimationFrame(loop)};loop();
    meterStop=()=>{cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());try{ctx.close()}catch(e){}};
  }catch(e){stream.getTracks().forEach(t=>t.stop())}
}
function stopMeter(){if(meterStop){meterStop();meterStop=null}}

      }

  };

function assess(T,H,words,rawHeard,spans,ti){
  const al=align(T,H);
  const c={ok:0,close:0,sub:0,miss:0};al.forEach(a=>c[a.st]++);
  const acc=(c.ok+.5*c.close)/T.length,score=Math.round(acc*5);
  const prev=S.rb[ti]||0,gain=Math.max(0,score-prev);if(score>prev)S.rb[ti]=score;bumpScore(gain);
  const rt=$("#rbestTab");if(rt)rt.textContent=rbSum()+"/"+RD().texts.length*5;
  const pk=$("#tpick [data-t='"+ti+"'] span");if(pk)pk.innerHTML=`<span class="lvl">${RD().texts[ti].lvl}</span> ${esc(RD().texts[ti].title)} · ${S.rb[ti]}/5`;
  spans.forEach((s,k)=>{s.className="wd "+({ok:"ok",close:"close",sub:"bad",miss:"bad"}[al[k].st])});
  const probs=al.map((a,k)=>({a,k,w:words[k].t,heard:a.h!=null?rawHeard[a.h]||"":""})).filter(p=>p.a.st!=="ok");
  const stressLine=w=>{const s=stressInfo(w);if(!s)return `<p class="label">One syllable: no stress to place</p>`;
    return `<p><span class="label">Stress</span> <b class="syl" lang="${S.lang}">${sylHTML(RD().map[rkey(w)])}</b> · stress the ${s.where} syllable</p>`};
  const card=p=>{
    const what=p.a.st==="miss"?"Not heard. Say this word clearly."
      :p.a.st==="close"?`Almost. I heard “${esc(p.heard)}”.`
      :`I heard “${esc(p.heard)}”. Check the highlighted letters.`;
    const wordH=p.a.st==="miss"?esc(p.w):letterDiff(p.w,p.heard);
    return `<li class="prob ${p.a.st}"><div class="hd"><b class="pw" lang="${S.lang}">${wordH}</b><button class="chip" data-say="${esc(p.w)}">${SPK_SVG}Hear it</button></div><p>${what}</p>${stressLine(p.w)}</li>`};
  $("#results").innerHTML=`<section class="panel" style="gap:14px">
    <span class="label">Your reading</span>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><div class="big">${score}/5</div><p class="lede">${gain?`+${gain} point${gain>1?"s":""} added`:score===5?"Perfect reading!":"Your best on this text is "+S.rb[ti]+"/5. Beat it to earn more points"}</p></div>
    <div class="tally"><span class="t ok">${c.ok} read well</span><span class="t close">${c.close} nearly right</span><span class="t bad">${c.sub} misread</span><span class="t bad">${c.miss} missed</span></div>
    ${probs.length?`<span class="label">Words to practise</span><ul class="probs" id="probs">${probs.map(card).join("")}</ul>`
      :`<p>Every word was recognised. Now compare your stress with the guide: tap <b>Show stress</b> above and read once more.</p>`}
    <p class="note">The app checks which words were recognised. It can't measure stress from your voice, so for each word it shows where the stress belongs. Tap “Hear it” and compare.</p>
    <div class="btns"><button class="btn" id="again">Read it again</button>${ti<RD().texts.length-1?`<button class="btn" id="nextT">Next text: ${esc(RD().texts[ti+1].lvl)} →</button>`:""}<button class="btn ghost" id="fin">See final results →</button></div>
  </section>`;
  if($("#probs"))wireChips($("#probs"));
  $("#again").onclick=()=>{$("#results").innerHTML="";spans.forEach(s=>s.className="wd");scrollTo({top:0,behavior:"smooth"});$("#rstate").textContent="Tap the text to begin"};
  $("#fin").onclick=done;
  if($("#nextT"))$("#nextT").onclick=()=>{scrollTo(0,0);readingPage(ti+1)};
  $("#results").scrollIntoView({behavior:"smooth",block:"start"});
}

  ["","Reported speech","When you report what someone said, the tense usually moves one step back, and pronouns and time words change.","say (that) … · tell someone (that) … · ask if / whether …",["today → that day","tomorrow → the next day","yesterday → the day before","here → there"],

  ["","Adjectives","Adjectives never change for gender or number. They go before the noun or after be. Short adjectives add -er / -est to compare; long ones use more / most.","short: -er / -est · long: more / most · irregular: good, bad, far",["a red car","The car is red.","My brother is taller than me.","This is the most beautiful beach."],

  ["","Questions","Questions start with ¿ and end with ?. For yes/no questions, the word order can stay the same and your voice rises at the end. Question words always have an accent.","¿(question word) + verb + subject?",["¿Dónde vives?=Where do you live?","¿Qué quieres?=What do you want?","¿Cuándo llegas?=When do you arrive?","¿Por qué estudias español?=Why are you studying Spanish?","¿Cómo te llamas?=What's your name?","¿Cuánto cuesta?=How much is it?"],

fr:{verbs:[["parler","to speak · -er"],["finir","to finish · -ir"],["aller","to go · irregular"]],conj:frConj,groups:[
 ["Tenses",[

  ["","Reported speech","After a past reporting verb (il a dit, elle a demandé), the tense moves back, and pronouns and time words change.","dire que … · demander si … · dire de + infinitive",["aujourd'hui → ce jour-là","demain → le lendemain","hier → la veille","ici → là"],

  ["","Negation","Put ne … pas around the conjugated verb (ne → n' before a vowel). In compound tenses, it goes around the auxiliary. In everyday speech, ne is often dropped.","ne + verb + pas / plus / jamais / rien · personne ne …",["Je n'ai pas fini.=I haven't finished.","Personne ne vient.=Nobody is coming."],
   {h:["Affirmatif","Négatif"],s:[0,1],r:[["Je parle anglais.","Je ne parle pas anglais."],["J'aime le café.","Je n'aime pas le café."],["J'ai fini.","Je n'ai pas fini."],["Je mange encore.","Je ne mange plus."],["Je vais toujours au cinéma.","Je ne vais jamais au cinéma."],["Je vois quelque chose.","Je ne vois rien."],["Quelqu'un vient.","Personne ne vient."]]}],
  ["","Questions","There are three ways to ask: rising intonation (informal), est-ce que (neutral), or swapping the verb and subject (formal).","intonation · est-ce que + statement · verb-subject inversion",["Où habites-tu ?=Where do you live?","Qu'est-ce que tu veux ?=What do you want?","Quand est-ce que tu pars ?=When are you leaving?","Comment tu t'appelles ?=What's your name?","Combien ça coûte ?=How much is it?"],

  ["","Adjectives","Adjectives agree in gender and number, and usually go after the noun. A few common ones go before it: beau, bon, grand, petit, jeune, vieux, nouveau.","+ -e for feminine · + -s for plural · special endings below",["une voiture rouge=a red car","un petit chat=a small cat","Elle est plus grande que moi.=She is taller than me."],

  ["","Adverbs","Add -ment to the feminine adjective. If the adjective ends in a vowel, use the masculine. -ant and -ent become -amment and -emment.","feminine adjective + -ment",["Il parle lentement.=He speaks slowly.","Elle parle couramment.=She speaks fluently."],

  ["","Plural formation","Most nouns add -s, which isn't pronounced. The article (les, des) tells the listener it's plural.","+ -s · -eau / -eu → + -x · -al → -aux",["le livre → les livres=the book → the books","le gâteau → les gâteaux=the cake → the cakes"],

  ["","Feminine formation","Nouns for people and many adjectives change for gender. Usually you add -e, but some endings change.","+ -e · -eur → -euse · -teur → -trice · -ien → -ienne",["un ami → une amie=a friend (m → f)","un acteur → une actrice=an actor → an actress"],

/* ---------------- WHAT EACH TENSE AND MOOD IS USED FOR ---------------- */
const USES={
en:{"Simple present":"Habits and routines|General truths|Facts|Timetables and schedules","Present continuous":"Actions happening now|Temporary situations|Fixed future plans|Changing situations","Present perfect":"Life experiences|Recent actions with a result now|Situations that are still true|Unfinished time: today, this week","Present perfect continuous":"Actions still going on|How long something has lasted|Recent activities with visible results","Simple past":"Finished past actions|Past habits|A series of past events|Stories","Past continuous":"Actions in progress in the past|The background to a story|An action that was interrupted|Two actions at the same time","Past perfect":"An action before another past action|Reasons for a past situation|Regrets: if I had known…","Past perfect continuous":"Long actions before a past moment|Causes of a past result|How long something had lasted","Simple future (will)":"Predictions|Promises|Offers|Decisions made on the spot","Future with going to":"Plans|Intentions|Predictions from what you see now","Future continuous":"Actions in progress at a future time|Polite questions about plans","Future perfect":"Actions finished before a future time|Deadlines","Future perfect continuous":"How long an action will have lasted|Duration up to a future moment","Indicative":"Facts|Statements|Questions|Certainty","Imperative":"Orders|Instructions|Advice|Invitations","Conditional":"Imagined situations|Polite requests|Advice: I would…","Conditional perfect":"Imagined past situations|Regrets|Results that never happened","Present subjunctive":"Formal demands|Recommendations|Necessity: it's vital that…","Past subjunctive":"Wishes|Unreal situations|Advice: if I were you…"},
es:{"Presente":"Habits|Facts|Actions happening now|Near-future plans","Presente continuo":"Actions happening right now|Temporary situations","Pretérito perfecto":"Actions in an unfinished time: hoy, este año|Life experiences|Recent actions","Pretérito indefinido":"Finished actions at a specific time|A series of past events|Completed periods","Pretérito imperfecto":"Past habits|Descriptions in the past|Actions in progress in the past|Age and time in the past","Pretérito imperfecto continuo":"Actions in progress at a past moment|An action that was interrupted","Pretérito pluscuamperfecto":"An action before another past action|Reported past events","Pretérito anterior":"An action just before another past action|Literary texts","Futuro próximo (ir a + infinitivo)":"Plans|Intentions|Things about to happen","Futuro simple":"Future actions|Predictions|Promises|Guesses about the present","Futuro continuo":"Actions in progress at a future moment|Guesses about what's happening now","Futuro perfecto":"Actions finished by a future time|Guesses about the recent past","Condicional simple":"Hypothetical situations|Polite requests|Advice|The future seen from the past","Condicional compuesto":"What would have happened|Regrets|Guesses about the past","Indicativo":"Facts|Certainty|Statements|Questions","Subjuntivo presente":"Wishes|Doubts|Emotions|Requests after que","Subjuntivo perfecto":"Wishes about finished actions|Doubts about the recent past","Subjuntivo imperfecto":"Unreal conditions with si|Past wishes|Polite requests: quisiera…","Subjuntivo pluscuamperfecto":"Unreal past conditions|Regrets about the past","Imperativo":"Orders|Instructions|Advice|Invitations"},
fr:{"Présent":"Habits|General truths|Actions happening now|The near future","Présent progressif":"Actions happening right now|Stressing that something is ongoing","Passé composé":"Finished past actions|A series of past events|Experiences","Passé récent":"Actions that have just happened","Imparfait":"Past habits|Descriptions|Actions in progress in the past|The background to a story","Plus-que-parfait":"An action before another past action|Regrets with si","Passé simple":"Finished actions in literature|Historical texts","Passé antérieur":"An action just before another past action|Literary texts","Futur proche":"Plans|Things about to happen","Futur simple":"Future actions|Predictions|Promises","Futur antérieur":"Actions finished before a future moment|Guesses about the past","Conditionnel présent":"Hypothetical situations|Polite requests|Advice|Wishes","Conditionnel passé":"What would have happened|Regrets|Reproaches","Indicatif":"Facts|Certainty|Statements|Questions","Subjonctif présent":"Wishes|Necessity: il faut que…|Emotions|Doubt","Subjonctif passé":"Finished actions after que|Feelings about the past","Impératif":"Orders|Instructions|Advice|Invitations"},
de:{"Präsens":"Habits|Facts|Actions happening now|The future, with a time word","Perfekt":"Finished past actions|The past in everyday speech","Präteritum":"The past in writing and stories|sein, haben and modal verbs in speech","Plusquamperfekt":"An action before another past action|The background to a past story","Futur I":"Plans|Predictions|Assumptions about the present","Futur II":"Actions finished by a future time|Assumptions about the past","Indikativ":"Facts|Certainty|Statements|Questions","Imperativ":"Orders|Requests|Instructions|Advice","Konjunktiv II":"Wishes|Unreal situations|Polite requests|Advice","Konjunktiv II der Vergangenheit":"Unreal past situations|Regrets","Konjunktiv I":"Reported speech|News and formal writing"}

/* ---------------- SMOKE AND FIRE ANIMATION ---------------- */
let fxStop=null;
const reduceMotion=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
function fxHTML(title,uses){
  return `<div class="fx" role="img" aria-label="${esc(title)} is used to describe: ${esc(uses.join(", "))}">
    <canvas></canvas><div class="fx-smoke">${esc(title)}<br><span>is used to describe…</span></div><div class="fx-word"></div>
    <span class="fx-skip">Tap to skip</span></div>
  <div class="uses" hidden><span class="label">${esc(title)} is used to describe</span><ul>${uses.map(u=>`<li>${esc(u)}</li>`).join("")}</ul><button class="btn ghost fx-replay">Replay animation</button></div>`;
}
function playFx(body,title,instant){
  if(fxStop)fxStop();
  const uses=usesOf(title);if(!uses)return;
  const stage=body.querySelector(".fx"),list=body.querySelector(".uses"),cv=stage.querySelector("canvas"),smoke=stage.querySelector(".fx-smoke"),word=stage.querySelector(".fx-word");
  const finish=()=>{stop();stage.hidden=true;list.hidden=false};
  if(instant||reduceMotion()){finish();return}
  stage.hidden=false;list.hidden=true;
  const ctx=cv.getContext("2d"),dpr=Math.min(2,window.devicePixelRatio||1);
  let W=0,H=0;const size=()=>{const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const P=[];let raf=0,alive=true,t0=performance.now(),emit=null;
  const add=(o)=>{if(P.length<700)P.push(o)};
  const box=el=>{const a=el.getBoundingClientRect(),b=stage.getBoundingClientRect();return {x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height}};
  const frame=now=>{
    if(!alive)return;if(!stage.isConnected){stop();return}
    ctx.clearRect(0,0,W,H);
    if(emit)emit(now);
    ctx.globalCompositeOperation="source-over";
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=1;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.vx*=.99;
      const k=p.life/p.max;if(k>=1){P.splice(i,1);continue}
      if(p.t==="smoke"){const r=p.s*(1+k*1.6),a=.07*(1-k);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,`rgba(200,200,210,${a})`);g.addColorStop(1,"rgba(200,200,210,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill()}}
    ctx.globalCompositeOperation="lighter";
    for(const p of P){if(p.t==="smoke")continue;const k=p.life/p.max;
      if(p.t==="fire"){const r=p.s*(1-k*.6);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
        const c=k<.25?[255,240,190]:k<.55?[255,150,40]:[220,50,10];g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${.3*(1-k)})`);g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill()}
      else{ctx.fillStyle=`rgba(255,${180-120*k|0},60,${1-k})`;ctx.fillRect(p.x,p.y,p.s,p.s)}}
    raf=requestAnimationFrame(frame);
  };
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const stop=()=>{alive=false;cancelAnimationFrame(raf);emit=null;if(fxStop===stop)fxStop=null};
  fxStop=stop;stage.onclick=finish;
  raf=requestAnimationFrame(frame);
  (async()=>{
    // 1. the statement rises out of smoke
    word.className="fx-word";word.textContent="";smoke.className="fx-smoke in";
    const sb=box(smoke);emit=()=>{for(let i=0;i<2;i++)add({t:"smoke",x:sb.x+Math.random()*sb.w,y:sb.y+sb.h*(.6+Math.random()*.6),vx:(Math.random()-.5)*.6,vy:-.3-Math.random()*.5,s:12+Math.random()*14,life:0,max:70+Math.random()*40})};
    await wait(2600);if(!alive)return;
    smoke.className="fx-smoke out";await wait(700);emit=null;if(!alive)return;
    // 2. each use bursts out of flame, burns, then the next one
    for(const u of uses){
      word.textContent=u;word.style.setProperty("--b","-10%");word.className="fx-word ignite";
      const b=box(word);
      for(let i=0;i<45;i++)add({t:"fire",x:b.x+Math.random()*b.w,y:b.y+b.h*(.4+Math.random()*.7),vx:(Math.random()-.5)*2.4,vy:-1.2-Math.random()*2.6,s:10+Math.random()*16,life:0,max:30+Math.random()*25});
      emit=()=>{for(let i=0;i<3;i++)add({t:"fire",x:b.x+Math.random()*b.w,y:b.y+b.h*(.85+Math.random()*.3),vx:(Math.random()-.5)*.8,vy:-1-Math.random()*1.8,s:7+Math.random()*11,life:0,max:28+Math.random()*22})};
      await wait(500);if(!alive)return;word.className="fx-word lit";
      await wait(1400);if(!alive)return;
      // burn to a crisp: a glowing edge eats the word from the bottom up
      word.className="fx-word burn";const start=performance.now(),dur=1300;
      emit=now=>{const k=Math.min(1,(now-start)/dur);word.style.setProperty("--b",(k*110-10)+"%");const y=b.y+b.h*(1-k);
        for(let i=0;i<3;i++)add({t:"fire",x:b.x+Math.random()*b.w,y:y+Math.random()*8,vx:(Math.random()-.5),vy:-1.4-Math.random()*1.6,s:6+Math.random()*10,life:0,max:20+Math.random()*16});
        for(let i=0;i<3;i++)add({t:"ember",x:b.x+Math.random()*b.w,y,vx:(Math.random()-.5)*1.6,vy:-1.6-Math.random()*2.4,g:.015,s:1.5+Math.random()*2,life:0,max:50+Math.random()*40});
        if(Math.random()<.5)add({t:"smoke",x:b.x+Math.random()*b.w,y,vx:(Math.random()-.5)*.4,vy:-.6,s:10+Math.random()*10,life:0,max:90})};
      await wait(dur+150);if(!alive)return;emit=null;word.className="fx-word gone";await wait(450);if(!alive)return;
    }
    await wait(500);if(alive)finish();
  })();
}

function cardSVG(id,neon){

  return `<svg class="tc-orn" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">

    <rect x="4" y="4" width="92" height="132" rx="6" fill="none" ${st} stroke-width="1.6"/>
    <rect x="8" y="8" width="84" height="124" rx="4" fill="none" ${st} stroke-width=".7"/>
    ${cor(8,8,1,1)}${cor(92,8,-1,1)}${cor(8,132,1,-1)}${cor(92,132,-1,-1)}
    <path d="M30 44 H45 L50 39 L55 44 H70" fill="none" ${st} stroke-width="1"/><path d="M30 96 H45 L50 101 L55 96 H70" fill="none" ${st} stroke-width="1"/>
    <path d="M50 30 l4 5 -4 5 -4 -5z" fill="none" ${st} stroke-width="1"/><path d="M50 100 l4 5 -4 5 -4 -5z" fill="none" ${st} stroke-width="1"/>
  </svg>`;
}
function trumpCard(kind,num,label,sub,unit){
  const neon=kind==="neon",id="g"+Math.random().toString(36).slice(2,8);
  return `<div class="tcard ${kind}"><div class="tc-face">${cardSVG(id,neon)}
    <span class="tc-c tl">${num}</span><span class="tc-c br">${num}</span>
    <div class="tc-mid"><span class="tc-num">${num}${unit?`<small>${unit}</small>`:""}</span><span class="tc-lbl">${esc(label)}</span></div>
    <span class="tc-sub">${esc(sub)}</span></div></div>`;

const LEVELS=[[90,"Master"],[75,"Strong"],[50,"Good"],[25,"Developing"],[0,"Starting"]];
const levelOf=pc=>LEVELS.find(l=>pc>=l[0])[1];
function strengths(){
  const lg=LG(),pronMax=lg.letters.length+lg.teams.length+RD().texts.length*5;
  const pron=Math.max(0,S.got.length+S.tgot.length-S.miss.length-S.tmiss.length+rbSum());
  const gramMax=allItems(S.lang).length*QN+FINALQ[S.lang].length,gram=qzSum(S);

  const pp=pc(pron,pronMax),gp=pc(gram,gramMax);
  return `<section class="strengths"><span class="label">Your strengths · ${lg.name}</span>

      ${trumpCard("neon",pp,"Pronunciation",`${levelOf(pp)}\n${pron}/${pronMax} pts`,"%")}

const QN=10,FINAL_ID="__final";
const pick=(a,n)=>shuffle(a).slice(0,n);
const qzBest=id=>S.qz&&S.qz[id]!=null?S.qz[id]:null;
const qzSum=p=>Object.values((p&&p.qz)||{}).reduce((a,b)=>a+b,0);
function allItems(L){return GRAM[L].groups.flatMap(g=>g[1])}
const NU=/not normally used/;
const unPrefix=s=>s.replace(/^\([^)]*\)\s*/,"").replace(/^(que |qu'|\(that\) |if )/,"");
function personsOf(L){return {en:["I","you","he/she/it","we","you (plural)","they"],es:["yo","tú","él/ella/usted","nosotros","vosotros","ellos/ellas/ustedes"],fr:["je","tu","il/elle","nous","vous","ils/elles"],de:["ich","du","er/sie/es","wir","ihr","sie/Sie"]}[L]}
// questions for a tense or mood, built from the conjugation tables so every answer is right
const INDIC=["Indicative","Indicativo","Indicatif","Indikativ"];
function indicativeQuestions(L,it){
  const G=GRAM[L],tenses=G.groups.filter(g=>/tense/i.test(g[0])).flatMap(g=>g[1]).filter(x=>x[0]);
  const marked=G.groups.filter(g=>/Mood|Conditional/.test(g[0])).flatMap(g=>g[1]).filter(x=>x[0]&&x[0]!=="imper"&&!INDIC.includes(x[1]));
  const out=[];
  for(const [v] of G.verbs)personsOf(L).forEach((per,i)=>{
    const ok=tenses.filter(x=>!NU.test(G.conj(v,x[0])[i])),t=ok[Math.random()*ok.length|0],ans=G.conj(v,t[0])[i];
    const indicForms=new Set(tenses.map(x=>unPrefix(G.conj(v,x[0])[i])));
    const extra=L==="en"&&v!=="be"?[`${per} would be ${ENV[v][4]}`,`${per} would have been ${ENV[v][4]}`]:[];
    const wrong=[...new Set(marked.map(x=>G.conj(v,x[0])[i]).concat(extra))].filter(w=>!NU.test(w)&&!indicForms.has(unPrefix(w))&&w!==ans);
    if(wrong.length>=3)out.push({p:`Which of these is in the ${it[1]}? (“${v}”, ${per})`,a:ans,w:pick(wrong,3)});
  });
  return pick(out,QN);
}
function verbQuestions(L,it){
  if(INDIC.includes(it[1]))return indicativeQuestions(L,it);
  const G=GRAM[L],k=it[0],title=it[1],verbs=G.verbs.map(v=>v[0]);
  const others=allItems(L).filter(x=>x[0]&&x[0]!==k&&x[0]!=="imper"&&!INDIC.includes(x[1]));
  const A=[],B=[];
  for(const v of verbs){
    const rows=G.conj(v,k);
    rows.forEach((row,i)=>{
      if(k==="imper"){
        let label=(row.match(/^\(([^)]*)\)/)||[])[1]||row.split(" ").slice(-1)[0].replace(/[!.]/g,"");
        if(L==="en")label=/Don't/.test(row)?"you, negative":label==="you"?"you, positive":"we (suggestion)";
        const ans=unPrefix(row),wrong=[...new Set(rows.filter((_,j)=>j!==i).map(unPrefix).concat(unPrefix(G.conj(v,"pres")[2]),unPrefix(G.conj(v,"pres")[4])))].filter(w=>w!==ans);
        if(wrong.length>=3)A.push({p:`Imperative of “${v}” for ${label}:`,a:ans,w:pick(wrong,3)});
        const tt=[...new Set(others.map(o=>o[1]))];if(tt.length>=3)B.push({p:`Which tense or mood is “${row}”?`,a:title,w:pick(tt,3)});
        return;
      }
      if(NU.test(row))return;
      const ans=unPrefix(row);
      const wrong=[...new Set(others.map(o=>unPrefix(G.conj(v,o[0])[i])))].filter(w=>w!==ans&&!NU.test(w));
      if(wrong.length>=3)A.push({p:`${title}: “${v}” with ${personsOf(L)[i]}`,a:ans,w:pick(wrong,3)});
      const clash=others.some(o=>unPrefix(G.conj(v,o[0])[i])===ans);
      if(!clash){const t=[...new Set(others.filter(o=>unPrefix(G.conj(v,o[0])[i])!==ans&&!NU.test(G.conj(v,o[0])[i])).map(o=>o[1]))].filter(t2=>t2!==title);
        if(t.length>=3)B.push({p:`Which tense or mood is “${row}”?`,a:title,w:pick(t,3)})}
    });
  }
  const nb=Math.min(4,B.length);return shuffle([...pick(A,QN-nb),...pick(B,nb)]).slice(0,QN);
}
function parseQ(s){const [p,a,...w]=s.split("|");return {p,a,w}}
function quizFor(L,it){return it[0]?verbQuestions(L,it):shuffle((OQ[L][it[1]]||[]).map(parseQ)).slice(0,QN)}

function quiz(id,title,qs,back){
  run++;const lg=LG();document.body.className=lg.cls;
  qs=qs.map(q=>({p:q.p,a:q.a,o:shuffle([q.a,...q.w])}));
  let pos=0,right=0;const res=[];
  const draw=()=>{
    const q=qs[pos];
    $("#app").innerHTML=`${topbar()}
    <section style="display:flex;flex-direction:column;gap:8px"><span class="label">${id===FINAL_ID?"Final quiz · intermediate":"Quiz"} · ${esc(title)}</span>
      <div class="dots">${qs.map((_,i)=>`<i class="${res[i]===true?"ok":res[i]===false?"no":i===pos?"now":""}"></i>`).join("")}</div></section>
    <section class="panel turn" style="gap:14px;max-width:680px">
      <span class="label">Question ${pos+1} of ${qs.length}</span>
      <h2 class="qp" lang="${S.lang}">${esc(q.p)}</h2>
      <div class="qopts" id="qopts">${q.o.map((o,i)=>`<button class="qo" data-i="${i}" lang="${S.lang}">${esc(o)}</button>`).join("")}</div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="btns" id="acts"></div>
    </section>`;
    wireTop();
    $("#qopts").onclick=e=>{const b=e.target.closest(".qo");if(!b||res[pos]!=null)return;
      const ok=q.o[+b.dataset.i]===q.a;res[pos]=ok;if(ok)right++;
      document.querySelectorAll(".qo").forEach((x,i)=>{x.disabled=true;if(q.o[i]===q.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const f=$("#fb");f.className="fb "+(ok?"ok":"no");f.textContent=ok?"Correct!":`Not quite. The answer is “${q.a}”.`;
      $("#acts").innerHTML=`<button class="btn" id="nx">${pos<qs.length-1?"Next question":"See my score"} →</button>`;
      $("#nx").onclick=()=>{pos++;if(pos<qs.length)draw();else end()};$("#nx").focus();
      document.querySelectorAll(".dots i")[pos].className=ok?"ok":"no";
    };
  };
  const end=()=>{
    const prev=qzBest(id)||0,gain=Math.max(0,right-prev);
    S.qz=S.qz||{};if(qzBest(id)==null||right>prev)S.qz[id]=right;bumpScore(gain);saveProg();
    const unlocked=id!==FINAL_ID&&allItems(S.lang).every(it=>qzBest(it[1])!=null)&&qzBest(FINAL_ID)==null;
    $("#app").innerHTML=`${topbar()}
    <section class="panel" style="align-items:flex-start;gap:12px;max-width:680px">
      <span class="label">${id===FINAL_ID?"Final quiz":"Quiz"} complete · ${esc(title)}</span>
      <div class="tcards">${trumpCard("gold",right,"Quiz points",`${title} · ${right}/${qs.length}`)}${trumpCard("neon",S.score,"Total score",lg.name)}</div>
      <p class="lede">${gain?`+${gain} point${gain>1?"s":""} added.`:prev&&right<=prev?`Your best on this quiz is ${prev}/${qs.length}. Beat it to earn more points.`:"No points this time."} 1 point for each correct answer.</p>
      ${unlocked?`<p class="note">You've finished every topic quiz. The final quiz is now unlocked at the bottom of the grammar list.</p>`:""}
      <div class="btns"><button class="btn" id="again">Retake quiz</button><button class="btn ghost" id="bk">Back to grammar</button></div>
    </section>`;
    wireTop();
    $("#again").onclick=()=>quiz(id,title,id===FINAL_ID?finalQs():quizFor(S.lang,allItems(S.lang).find(it=>it[1]===title)).map(q=>({p:q.p,a:q.a,w:q.w})),back);
    $("#bk").onclick=back;
  };
  draw();
}
function finalQs(){return shuffle(FINALQ[S.lang].map(parseQ))}

/* ---------------- DONE ---------------- */
function done(){
  run++;const lg=LG();S.score=calcScore(S);saveProg();
  const hard=[...lg.letters.filter(x=>S.miss.includes(x.l)),...lg.teams.filter(x=>S.tmiss.includes(kid(x)))];
  $("#app").innerHTML=`${topbar()}
  <section class="panel" style="align-items:flex-start;gap:14px">
    <span class="label">${lg.name} complete: letters, letter teams and reading</span>
    <div class="big">${S.score} pts</div>
    ${strengths()}
    <p class="lede">+${S.got.length+S.tgot.length} for letters and letter teams said correctly, −${S.miss.length+S.tmiss.length} for the ones you struggled with, +${rbSum()} for reading (best score on each of the ${RD().texts.length} texts), +${qzSum(S)} from grammar quizzes. Each letter or letter team counts only once.</p>
    <section style="display:flex;flex-direction:column;gap:8px;width:100%"><span class="label">Struggled with · ${hard.length}</span>
      ${hard.length?`<div class="chips">${hard.map(x=>`<span class="chip miss" style="cursor:default"><b lang="${S.lang}">${esc(disp(x))}</b><span class="ipa">${esc(ipaTxt(x.snd))}</span></span>`).join("")}</div>`:`<p>None. You pronounced every letter and letter team correctly.</p>`}</section>
    <span class="label">Letters · green = point earned · red = struggled</span>
    <div class="chips">${lg.letters.map(x=>`<span class="chip ${S.miss.includes(x.l)?"miss":S.got.includes(x.l)?"ok":""}" style="cursor:default"><b>${up(x.l)}</b></span>`).join("")}</div>
    <span class="label">Letter teams</span>
    <div class="chips">${lg.teams.map(x=>`<span class="chip ${S.tmiss.includes(kid(x))?"miss":S.tgot.includes(kid(x))?"ok":""}" style="cursor:default"><b lang="${S.lang}">${esc(x.l)}</b></span>`).join("")}</div>
    <div class="btns"><button class="btn" id="toNext">Continue: what's next →</button>${hard.length?`<button class="btn" id="rvH">Practise the ones I struggled with</button>`:""}<button class="btn" id="rvL">Review 5 random letters</button><button class="btn" id="rvT">Review 5 random teams</button><button class="btn" id="rdA">Reading practice</button><button class="btn ghost" id="restart">Start again from A</button><button class="btn ghost" id="other">Choose another language</button></div>
  </section>`;
  wireTop();
  $("#toNext").onclick=hub;
  if($("#rvH"))$("#rvH").onclick=()=>review(shuffle(hard),done);
  $("#rvL").onclick=()=>review(shuffle(lg.letters).slice(0,5),done);
  $("#rvT").onclick=()=>review(shuffle(lg.teams).slice(0,5),done);
  $("#rdA").onclick=()=>{S.ph="reading";saveProg();readingPage(0)};
  $("#restart").onclick=()=>{S.ph="letters";S.idx=0;S.tidx=0;S.score=0;S.got=[];S.tgot=[];S.miss=[];S.tmiss=[];S.rb=[0,0,0,0];S.qz={};learn()};
  $("#other").onclick=home;
}

/* ---------------- RULES ---------------- */
function rules(){
  run++;const lg=LG();
  $("#app").innerHTML=`<div class="top"><div class="left"><button class="btn ghost" id="backL">← Back to lessons</button><h2>${lg.name} pronunciation rules</h2></div><span class="score" id="score">${S.score} pts</span></div>
  <p class="lede">${esc(lg.intro)} Tap any example to hear it.</p>
  <div class="rules" id="rulesG">${lg.rules.map(r=>`<section class="panel"><h3>${esc(r.t)}</h3><p>${esc(r.d)}</p>
    <div class="chips">${r.ex.map(s=>{const e=pw(s);return `<button class="chip" data-say="${esc(e.w)}">${SPK_SVG}<b lang="${S.lang}">${esc(e.w)}</b>${e.m?`<span>${esc(e.m)}</span>`:""}</button>`}).join("")}</div></section>`).join("")}</div>`;
  $("#backL").onclick=learn;
  wireChips($("#rulesG"));
}

home();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
