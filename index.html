<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1119">
<meta name="mobile-web-app-capable" content="yes">
<title>Symbols &amp; Sounds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Charis+SIL:wght@400;700&family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a phonics bench. A single keycap-like letter sits on the left (top on phones); the sound, the two words, the variations and "your turn" stack beside it. A rail of the whole alphabet runs above, with a dot under every 6th letter marking a review stop. */
:root{
  --bg:#eff1f6; --surface:#ffffff; --ink:#161a2b; --muted:#585e76; --line:#d9dce8;
  --en:#2c5ee8; --es:#cf3f22; --fr:#6a3dd0; --de:#0b7f61; --on-acc:#ffffff;
  --good:#1d8150; --bad:#c23a32; --warn:#a35f00;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;
  --acc:var(--en);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}
.l-en{--acc:var(--en)} .l-es{--acc:var(--es)} .l-fr{--acc:var(--fr)} .l-de{--acc:var(--de)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px;--soft:color-mix(in srgb,var(--acc) 13%,var(--surface))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:900;font-variation-settings:"wdth" 118;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:800;font-variation-settings:"wdth" 110}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.lede{color:var(--muted);max-width:60ch;font-size:1.08rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--muted)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--on-acc)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* Home */
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:820px){.langs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lang{appearance:none;cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 6px 0 var(--acc);transition:transform .15s}
.lang:hover{transform:translateY(-3px)}
.lang .spec{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(3.6rem,14vw,5.4rem);line-height:1;color:var(--acc)}
.lang .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variation-settings:"wdth" 110;letter-spacing:.02em}
.lang .meta{color:var(--muted);font-size:.9rem}
.lang .prog{font-size:.82rem;font-weight:700;color:var(--acc)}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.howto b{display:block;font-family:var(--display);font-weight:800}
.note{font-size:.92rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}

/* Learn */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.top .left{display:flex;align-items:center;gap:10px;min-width:0}
.score{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:6px 14px;font-size:1.05rem}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.rail-wrap{overflow-x:auto;padding-bottom:6px}
.rail{display:flex;gap:4px;min-width:max-content}
.rail button{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:38px;cursor:pointer;font-family:var(--display);font-weight:800;position:relative;font-size:.95rem}
.rail button.done{background:var(--soft);border-color:var(--acc)}
.rail button.cur{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.rail button.cp::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.bench{display:grid;gap:18px}
@media(min-width:780px){.bench{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.tilecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{appearance:none;cursor:pointer;width:100%;max-width:360px;aspect-ratio:1/1;border-radius:28px;border:2px solid var(--line);background:var(--surface);box-shadow:0 10px 0 var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:transform .12s, box-shadow .12s}
.tile:active{transform:translateY(6px);box-shadow:0 4px 0 var(--acc)}
.tile .g{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;line-height:.9;font-size:clamp(6rem,30vw,9.5rem);display:flex;align-items:baseline;gap:.08em}
.tile .g small{font-size:.55em;color:var(--acc)}
.tile .nm{font-size:1rem;color:var(--muted);font-weight:600}
.tile.playing{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 10px 0 var(--acc),0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}100%{box-shadow:0 10px 0 var(--acc),0 0 0 22px transparent}}
.tapcap{font-weight:700;color:var(--acc);display:flex;gap:8px;align-items:center}
.ipa{font-family:var(--ipa);font-size:1.15em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.soundline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.soundline .ipa{font-size:2rem;color:var(--acc);font-weight:700}
.stage{min-height:112px;border-radius:14px;background:var(--soft);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stage .count{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage .w{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 108;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;overflow-wrap:anywhere}
.stage .w mark{background:none;color:var(--acc);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.stage .m{color:var(--muted)}
.stage.empty{color:var(--muted)}
.stage .w,.stage .m{animation:rise .35s ease-out}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}}
.vars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vars li{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.vars li:first-child{border-top:0;padding-top:0}
.vars .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vars .hd .ipa{color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;max-width:100%;text-align:left}
.chip b{font-weight:700}
.chip span{color:var(--muted);font-size:.88rem}
.chip:hover{border-color:var(--acc)}
.turn{border:2px solid var(--acc)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}}
.turnrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.turnrow>div{flex:1 1 200px;min-width:0}
.fb{font-weight:700;min-height:1.5em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--acc)}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rules .panel h3{font-size:1.05rem}
.big{font-family:var(--display);font-weight:900;font-size:clamp(3rem,12vw,5rem);font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--surface);align-self:flex-start;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button span{font-weight:600;opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.rail.teams button{width:auto;min-width:40px;padding:0 9px;font-size:.82rem;white-space:nowrap}
.tile .g.team{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;text-align:center;justify-content:center;flex-wrap:wrap;padding:0 14px;font-variation-settings:"wdth" 112}
@media(max-width:779px){.tile .g.team{font-size:clamp(2.2rem,11vw,3.4rem)}}
.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.syl{font-weight:600;letter-spacing:.01em}
.syl .st{color:var(--acc);font-weight:800}
.wd .st{color:inherit;font-weight:800;box-shadow:inset 0 -3px 0 var(--acc)}
.syl .dot{color:var(--muted);margin:0 1px}
.passage{appearance:none;text-align:left;cursor:pointer;background:var(--soft);border:2px dashed var(--acc);border-radius:16px;padding:18px;font-family:var(--body);font-size:clamp(1.15rem,4.4vw,1.45rem);line-height:1.9;color:var(--ink);max-width:70ch}
.passage.on{border-style:solid;animation:ring 1.4s ease-out infinite}
.wd{border-radius:5px;padding:1px 2px;transition:background .2s,color .2s}
.wd.next{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.wd.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.wd.close{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);text-decoration:underline dotted}
.wd.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);text-decoration:underline wavy;text-underline-offset:4px}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally .t{font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.t.ok{color:var(--good)} .t.close{color:var(--warn)} .t.bad{color:var(--bad)}
.probs{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prob{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prob.close{border-left-color:var(--warn)}
.prob .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pw{font-family:var(--display);font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
mark.lx{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);border-radius:3px}
.hidden{display:none}
@media(max-width:779px){.tile{max-width:min(240px,64vw)}.tile .g{font-size:clamp(5rem,24vw,7rem)}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

const pw=s=>{const [w,m]=s.split("=");return {w:w.trim(),m:(m||"").trim()}};
function L(l,name,snd,w1,w2,o,al,say){return {l,name,snd,say,w:[pw(w1),pw(w2)],
  o:o.map(s=>{const [d,ss,a,b]=s.split(";");return {d,s:ss,ex:[pw(a),pw(b)]}}),
  al:al.split(",").map(x=>x.trim().toLowerCase())}}

 L("b","bee","/b/","ball","bed",["Silent after m;silent;lamb;thumb","Silent before t;silent;debt;doubt"],"b,be,bee,bea,b."),

 L("n","en","/n/","nose","net",["Silent after m;silent;autumn;column"],"n,en,and,in,an,n."),
 L("o","oh","/ɒ/","dog","hot",["Long O with a silent e;/əʊ/;home;nose","oo (long);/uː/;moon;food","oo (short);/ʊ/;book;look","ou or ow;/aʊ/;house;cow","oi or oy;/ɔɪ/;coin;boy"],"o,oh,owe,0,o."),

 ]},

 L("g","ge","/ɡ/","gato=cat","gota=drop",["Before e or i, like J (a throat sound);/x/;gente=people;girasol=sunflower","gue, gui: hard g, silent u;/ɡ/;guerra=war;guitarra=guitar","güe, güi: the u is spoken;/ɡw/;pingüino=penguin;cigüeña=stork"],"g,ge,je,gé","ge"),

 {t:"Where the stress goes",d:"Words ending in a vowel, n or s stress the second-to-last syllable. Others stress the last. A written accent overrides both.",ex:["casa=house","joven=young","hablar=to speak","canción=song","árbol=tree"]},
 {t:"H is always silent",d:"Except in ch, the letter h is never pronounced.",ex:["hola=hello","ahora=now"]},
 {t:"B and V sound the same",d:"Both are /b/ at the start, and soft [β] between vowels.",ex:["vaca=cow","boca=mouth","uva=grape"]},
 {t:"ce, ci and z",d:"/θ/ (like th in think) in most of Spain, /s/ in Latin America and the Canaries.",ex:["cine=cinema","zapato=shoe"]},
 {t:"ge, gi and j",d:"A rough throat sound /x/. Add a silent u (gue, gui) to keep the g hard.",ex:["gente=people","jirafa=giraffe","guerra=war"]},
 {t:"R and RR",d:"A single r between vowels is a quick tap. rr, and r at the start of a word, is a rolled trill.",ex:["pero=but","perro=dog","rojo=red"]},
 {t:"Diphthongs",d:"i and u next to a, e or o join with it into one syllable.",ex:["bueno=good","aire=air","ciudad=city"]}

 rules:[
 {t:"Final consonants are usually silent",d:"Most final consonants are dropped. C, R, F and L are often spoken (think “CaReFuL”).",ex:["grand=tall","trop=too much","avec=with","sel=salt"]},
 {t:"Final -e is silent",d:"It isn't spoken, but it makes the consonant before it heard.",ex:["petit=small","petite=small (f.)","grand=tall","grande=tall (f.)"]},
 {t:"Liaison",d:"A silent final consonant links to the next word when that word starts with a vowel.",ex:["les amis=the friends","vous avez=you have","petit ami=boyfriend"]},
 {t:"Nasal vowels",d:"A vowel followed by n or m (at the end, or before another consonant) is said through the nose.",ex:["enfant=child","bon=good","vin=wine","un=one"]},
 {t:"Vowel teams",d:"ou /u/, oi /wa/, au and eau /o/, ai /ɛ/, eu /ø/.",ex:["nous=we","moi=me","beau=beautiful","lait=milk","bleu=blue"]},
 {t:"Accents change the sound",d:"é is /e/, è and ê are /ɛ/. ç is always /s/.",ex:["été=summer","mère=mother","fête=party","garçon=boy"]},
 {t:"Even rhythm, last syllable heavier",d:"Syllables are evenly timed, with a little extra weight on the last one of a phrase.",ex:["chocolat=chocolate","Paris","téléphone=phone"]},
 {t:"H is never pronounced",d:"Some words have an “h aspiré”, which blocks liaison even though it is silent.",ex:["homme=man","hôtel=hotel","les héros=the heroes"]}
 ]},

function pickVoice(tag){const b=tag.slice(0,2).toLowerCase();
  const g=voices.filter(v=>v.lang&&/google/i.test(v.name));
  return g.find(v=>v.lang.replace("_","-").toLowerCase()===tag.toLowerCase())||g.find(v=>v.lang.toLowerCase().startsWith(b))||voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase()===tag.toLowerCase())||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(b))}

    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,3000+text.length*250);

  let alts=null,err=null,ended=false;
  r.onresult=e=>{try{alts=[...e.results[0]].map(a=>a.transcript)}catch(x){alts=[]}};
  r.onerror=e=>{err=e.error||"error"};

const norm=s=>s.toLowerCase().replace(/[.,!?¿¡"“”«»:;()\-]/g," ").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function accepts(x,alts){
  const special="äöüñß".includes(x.l);
  const set=new Set(x.al.map(norm));
  const sset=new Set([...set].map(strip));
  for(const a of alts){
    const t=norm(a);if(!t)continue;
    if(set.has(t))return true;
    const toks=t.split(" ");
    if(toks.length<=3&&toks.some(k=>set.has(k)))return true;
    if(!special){const st=strip(t);if(sset.has(st))return true;if(toks.length<=3&&toks.map(strip).some(k=>sset.has(k)))return true}
  }
  return false;
}

}

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function matchWord(target,alts){
  const t=norm(target),ts=strip(t);
  for(const a of alts){const n=norm(a);if(!n)continue;
    if(n===t||strip(n)===ts)return true;
    if((" "+n+" ").includes(" "+t+" ")||(" "+strip(n)+" ").includes(" "+ts+" "))return true;
    if(ts.length>=5&&n.split(" ").some(k=>lev(strip(k),ts)<=1))return true;
  }

}

}

const rkey=w=>w.toLowerCase().replace(/’/g,"'");
const rnorm=w=>strip(w.toLowerCase().replace(/[’']/g,"").replace(/ß/g,"ss")).replace(/[^\p{L}\p{N}]/gu,"");

function stressInfo(word){
  const syl=RD().map[rkey(word)];if(!syl)return null;

// dotted syllables, stressed one highlighted (rule examples and problem cards)
function sylHTML(syl){return syl.split("·").map(p=>p.startsWith("ˈ")?`<b class="st">${esc(p.slice(1).toUpperCase())}</b>`:esc(p)).join("<span class=\"dot\">·</span>")}
// the word as written, stressed syllable highlighted (whole-text stress view)
function wordStressHTML(word){
  const syl=RD().map[rkey(word)];if(!syl||sylPlain(syl)!==rkey(word))return esc(word);
  let pos=0,out="";for(const p of syl.split("·")){const s=p.replace("ˈ",""),seg=word.slice(pos,pos+s.length);pos+=s.length;out+=p.startsWith("ˈ")?`<b class="st">${esc(seg)}</b>`:esc(seg)}

}
function tokenize(text){return text.match(/[\p{L}'’]+|[^\p{L}'’]+/gu).map(t=>({t,w:/\p{L}/u.test(t)}))}
function near(a,b){const d=lev(a,b);return (a.length>=4&&d<=1)||(a.length>=7&&d<=2)}
function align(T,H){
  const n=T.length,m=H.length,D=[];for(let i=0;i<=n;i++){D.push(new Array(m+1).fill(0));D[i][0]=i}for(let j=0;j<=m;j++)D[0][j]=j;
  const sc=(a,b)=>a===b?0:near(a,b)?.5:1;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j-1]+sc(T[i-1],H[j-1]),D[i-1][j]+1,D[i][j-1]+1);
  const out=new Array(n).fill(null);let i=n,j=m;
  while(i>0&&j>0){const c=sc(T[i-1],H[j-1]);
    if(D[i][j]===D[i-1][j-1]+c){out[i-1]={st:c===0?"ok":c===.5?"close":"sub",h:j-1};i--;j--}
    else if(D[i][j]===D[i-1][j]+1){out[i-1]={st:"miss"};i--}else j--}

}
function letterDiff(target,heard){
  const a=[...target],A=a.map(c=>rnorm(c)),B=[...rnorm(heard)],n=A.length,m=B.length,D=[];
  for(let i=0;i<=n;i++){D.push(new Array(m+1).fill(0));D[i][0]=i}for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j-1]+(A[i-1]&&A[i-1]===B[j-1]?0:1),D[i-1][j]+1,D[i][j-1]+1);
  const bad=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){const c=A[i-1]&&A[i-1]===B[j-1]?0:1;if(D[i][j]===D[i-1][j-1]+c){bad[i-1]=!!c&&!!A[i-1];i--;j--}else if(D[i][j]===D[i-1][j]+1){bad[i-1]=!!A[i-1];i--}else j--}
  while(i>0){bad[i-1]=!!A[i-1];i--}
  return a.map((c,k)=>bad[k]?`<mark class="lx">${esc(c)}</mark>`:esc(c)).join("");
}

function readingPage(){
  run++;const lg=LG(),R=RD(),tag=lg.tts;
  const toks=tokenize(R.text);const words=toks.filter(t=>t.w);const T=words.map(w=>rnorm(w.t));
  let wi=0;
  const passage=toks.map(t=>t.w?`<span class="wd" data-i="${wi++}">${esc(t.t)}</span>`:esc(t.t)).join("");
  $("#app").innerHTML=`${topbar()}${phaseTabs()}
  <section class="panel turn" style="gap:14px">
    <span class="label">Read aloud · A1 · Step 2 of 2</span>
    <p>${mode==="voice"?"Tap the text to start the microphone, then read it aloud at a calm pace. Words turn green as the app hears them.":"Reading is checked with the microphone, which isn't on. You can still listen to the text and read along."}</p>
    <button class="passage" id="passage" lang="${S.lang}" aria-label="Tap to start reading">${passage}</button>
    <p class="label" id="rstate">${mode==="voice"?"Tap the text to begin":"Microphone off"}</p>
    <div class="btns"><button class="btn" id="doneR" hidden>Done reading</button><button class="btn ghost" id="hearAll">${SPK_SVG}Hear it read</button><button class="btn ghost" id="stressT" aria-pressed="false">Show stress</button></div>
  </section>
  <div id="results"></div>`;
  wireTop();wirePhaseTabs();
  const spans=[...document.querySelectorAll("#passage .wd")];
  let netErr=0,showStress=false,listening=false,stopped=false,acc="",sess="",interim="",rec=null,hardErr=null,deadline=0,autoT=null;
  const paintStress=()=>spans.forEach((s,k)=>{s.innerHTML=showStress?wordStressHTML(words[k].t):esc(words[k].t)});
  $("#stressT").onclick=()=>{showStress=!showStress;$("#stressT").setAttribute("aria-pressed",showStress);$("#stressT").textContent=showStress?"Hide stress":"Show stress";paintStress()};
  $("#hearAll").onclick=()=>{if(listening)return;run++;speak(R.text,tag,.85)};
  const live=()=>{
    const H=(acc+" "+sess+" "+interim).split(/\s+/).map(rnorm).filter(Boolean);
    const al=align(T,H);let last=-1;
    al.forEach((a,k)=>{if(a&&(a.st==="ok"||a.st==="close"))last=k});
    spans.forEach((s,k)=>{s.className="wd"+(k<=last&&al[k]&&al[k].st!=="miss"?(al[k].st==="ok"?" ok":al[k].st==="close"?" close":""):"")+(k===last+1?" next":"")});
    if(last===spans.length-1&&!autoT)autoT=setTimeout(stop,1500);
  };
  const stop=()=>{stopped=true;try{rec&&rec.stop()}catch(e){}};
  const session=()=>{
    try{rec=new SR()}catch(e){hardErr="unsupported";finish();return}
    rec.lang=tag;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{const parts=[];let im="";
      for(let k=0;k<e.results.length;k++){const t=e.results[k][0].transcript.trim();
        if(e.results[k].isFinal){if(parts.length&&t.startsWith(parts[parts.length-1]))parts[parts.length-1]=t;else parts.push(t)}else im+=" "+t}
      sess=parts.join(" ");interim=im;live()};
    rec.onerror=e=>{if(HARD.includes(e.error))hardErr=e.error;if(e.error==="network"&&++netErr>=2)hardErr="network"};
    rec.onend=()=>{acc+=" "+sess;sess="";interim="";
      if(!stopped&&!hardErr&&Date.now()<deadline)setTimeout(()=>{if(!stopped)session();else finish()},120);else finish()};
    try{rec.start()}catch(e){hardErr="start";finish()}
  };
  let finished=false;
  const finish=()=>{if(finished)return;finished=true;listening=false;clearTimeout(autoT);
    $("#passage").classList.remove("on");$("#doneR").hidden=true;
    if(hardErr==="network"){$("#rstate").textContent="The speech service couldn't be reached. Check your internet connection, then tap the text again.";spans.forEach(s=>s.className="wd");return}
    if(hardErr){mode="self";micNote="Chrome couldn't use the microphone. Allow it for this page and reload.";$("#rstate").textContent=micNote;return}
    const H=acc.split(/\s+/).map(rnorm).filter(Boolean);
    if(!H.length){$("#rstate").textContent="I didn't hear any reading. Tap the text and try again.";spans.forEach(s=>s.className="wd");return}
    $("#rstate").textContent="Reading checked";
    assess(T,H,words,acc.split(/\s+/).filter(Boolean),spans);
  };
  const begin=()=>{
    if(mode!=="voice"){$("#rstate").textContent="Turn on the microphone to have your reading checked: go back to Languages and pick this language again.";return}
    if(listening){stop();return}
    run++;if(hasTTS)try{speechSynthesis.cancel()}catch(e){}
    netErr=0;listening=true;stopped=false;finished=false;acc="";sess="";interim="";hardErr=null;autoT=null;deadline=Date.now()+180000;
    $("#results").innerHTML="";spans.forEach(s=>s.className="wd");spans[0].classList.add("next");
    $("#passage").classList.add("on");$("#doneR").hidden=false;$("#rstate").textContent="Listening… read the text aloud";
    session();
  };
  $("#passage").onclick=begin;
  $("#doneR").onclick=stop;
}

function assess(T,H,words,rawHeard,spans){
  const al=align(T,H);
  const c={ok:0,close:0,sub:0,miss:0};al.forEach(a=>c[a.st]++);
  const acc=(c.ok+.5*c.close)/T.length,score=Math.round(acc*5);
  const gain=Math.max(0,score-(S.rbest||0));if(score>(S.rbest||0)){S.rbest=score}bumpScore(gain);const rt=$("#rbestTab");if(rt)rt.textContent=S.rbest+"/5";
  spans.forEach((s,k)=>{s.className="wd "+({ok:"ok",close:"close",sub:"bad",miss:"bad"}[al[k].st])});
  const probs=al.map((a,k)=>({a,k,w:words[k].t,heard:a.h!=null?rawHeard[a.h]||"":""})).filter(p=>p.a.st!=="ok");
  const stressLine=w=>{const s=stressInfo(w);if(!s)return `<p class="label">One syllable: no stress to place</p>`;
    return `<p><span class="label">Stress</span> <b class="syl" lang="${S.lang}">${sylHTML(RD().map[rkey(w)])}</b> · stress the ${s.where} syllable</p>`};
  const card=p=>{
    const what=p.a.st==="miss"?"Not heard. Say this word clearly."
      :p.a.st==="close"?`Almost. I heard “${esc(p.heard)}”.`
      :`I heard “${esc(p.heard)}”. Check the highlighted letters.`;
    const wordH=p.a.st==="miss"?esc(p.w):letterDiff(p.w,p.heard);
    return `<li class="prob ${p.a.st}"><div class="hd"><b class="pw" lang="${S.lang}">${wordH}</b><button class="chip" data-say="${esc(p.w)}">${SPK_SVG}Hear it</button></div><p>${what}</p>${stressLine(p.w)}</li>`};
  $("#results").innerHTML=`<section class="panel" style="gap:14px">
    <span class="label">Your reading</span>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><div class="big">${score}/5</div><p class="lede">${gain?`+${gain} point${gain>1?"s":""} added`:score===5?"Perfect reading!":"Beat your best score of "+S.rbest+"/5 to earn more points"}</p></div>
    <div class="tally"><span class="t ok">${c.ok} read well</span><span class="t close">${c.close} nearly right</span><span class="t bad">${c.sub} misread</span><span class="t bad">${c.miss} missed</span></div>
    ${probs.length?`<span class="label">Words to practise</span><ul class="probs" id="probs">${probs.map(card).join("")}</ul>`
      :`<p>Every word was recognised. Now compare your stress with the guide: tap <b>Show stress</b> above and read once more.</p>`}
    <p class="note">The app checks which words were recognised. It can't measure stress from your voice, so for each word it shows where the stress belongs. Tap “Hear it” and compare.</p>
    <div class="btns"><button class="btn" id="again">Read it again</button><button class="btn ghost" id="fin">See final results →</button></div>
  </section>`;
  if($("#probs"))wireChips($("#probs"));
  $("#again").onclick=()=>{$("#results").innerHTML="";spans.forEach(s=>s.className="wd");scrollTo({top:0,behavior:"smooth"});$("#rstate").textContent="Tap the text to begin"};
  $("#fin").onclick=done;
  $("#results").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------------- DONE ---------------- */
function done(){
  run++;const lg=LG();
  $("#app").innerHTML=`${topbar()}
  <section class="panel" style="align-items:flex-start;gap:14px">
    <span class="label">${lg.name} complete: letters, letter teams and reading</span>
    <div class="big">${S.score} pts</div>
    <p class="lede">You pronounced ${S.got.length} of ${lg.letters.length} letters and ${S.tgot.length} of ${lg.teams.length} letter teams correctly in the lessons. Best reading score: ${S.rbest||0}/5.</p>
    <div class="chips">${lg.letters.map(x=>`<span class="chip" style="cursor:default;${S.got.includes(x.l)?"border-color:var(--good)":""}"><b>${up(x.l)}</b></span>`).join("")}</div>
    <div class="chips">${lg.teams.map(x=>`<span class="chip" style="cursor:default;${S.tgot.includes(kid(x))?"border-color:var(--good)":""}"><b lang="${S.lang}">${esc(x.l)}</b></span>`).join("")}</div>
    <div class="btns"><button class="btn" id="rvL">Review 5 random letters</button><button class="btn" id="rvT">Review 5 random teams</button><button class="btn" id="rdA">Read the text again</button><button class="btn ghost" id="restart">Start again from A</button><button class="btn ghost" id="other">Choose another language</button></div>
  </section>`;
  wireTop();
  $("#rvL").onclick=()=>{S.ph="letters";S.idx=lg.letters.length-1;review(shuffle(lg.letters).slice(0,5))};
  $("#rvT").onclick=()=>{S.ph="teams";S.tidx=lg.teams.length-1;review(shuffle(lg.teams).slice(0,5))};
  $("#rdA").onclick=()=>{S.ph="reading";saveProg();readingPage()};
  $("#restart").onclick=()=>{S.ph="letters";S.idx=0;S.tidx=0;S.score=0;S.got=[];S.tgot=[];S.rbest=0;learn()};
  $("#other").onclick=home;
}

/* ---------------- RULES ---------------- */
function rules(){
  run++;const lg=LG();
  $("#app").innerHTML=`<div class="top"><div class="left"><button class="btn ghost" id="backL">← Back to lessons</button><h2>${lg.name} pronunciation rules</h2></div><span class="score" id="score">${S.score} pts</span></div>
  <p class="lede">${esc(lg.intro)} Tap any example to hear it.</p>
  <div class="rules" id="rulesG">${lg.rules.map(r=>`<section class="panel"><h3>${esc(r.t)}</h3><p>${esc(r.d)}</p>
    <div class="chips">${r.ex.map(s=>{const e=pw(s);return `<button class="chip" data-say="${esc(e.w)}">${SPK_SVG}<b lang="${S.lang}">${esc(e.w)}</b>${e.m?`<span>${esc(e.m)}</span>`:""}</button>`}).join("")}</div></section>`).join("")}</div>`;
  $("#backL").onclick=learn;
  wireChips($("#rulesG"));
}

home();
</script>
