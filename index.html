<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1119">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Symbols &amp; Sounds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Charis+SIL:wght@400;700&family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a phonics bench. A single keycap-like letter sits on the left (top on phones); the sound, the two words, the variations and "your turn" stack beside it. A rail of the whole alphabet runs above, with a dot under every 6th letter marking a review stop. */
:root{
  --bg:#eff1f6; --surface:#ffffff; --ink:#161a2b; --muted:#585e76; --line:#d9dce8;
  --en:#2c5ee8; --es:#cf3f22; --fr:#6a3dd0; --de:#0b7f61; --on-acc:#ffffff;
  --good:#1d8150; --bad:#c23a32; --warn:#a35f00;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Gentium Plus","Times New Roman",serif;
  --acc:var(--en);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d29; --ink:#eef0f8; --muted:#a2a8c0; --line:#2e3243;
  --en:#7f9dff; --es:#ff8266; --fr:#ac90ff; --de:#3fd0a6; --on-acc:#0f1119;
  --good:#4fd08e; --bad:#ff7a70; --warn:#ffb44a; color-scheme:dark}
.l-en{--acc:var(--en)} .l-es{--acc:var(--es)} .l-fr{--acc:var(--fr)} .l-de{--acc:var(--de)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px;--soft:color-mix(in srgb,var(--acc) 13%,var(--surface))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:900;font-variation-settings:"wdth" 118;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:800;font-variation-settings:"wdth" 110}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.lede{color:var(--muted);max-width:60ch;font-size:1.08rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--muted)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--acc);color:var(--on-acc);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--on-acc)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* Home */
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:820px){.langs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lang{appearance:none;cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 6px 0 var(--acc);transition:transform .15s}
.lang:hover{transform:translateY(-3px)}
.lang .spec{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(3.6rem,14vw,5.4rem);line-height:1;color:var(--acc)}
.lang .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variation-settings:"wdth" 110;letter-spacing:.02em}
.lang .meta{color:var(--muted);font-size:.9rem}
.lang .prog{font-size:.82rem;font-weight:700;color:var(--acc)}
.howto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.howto b{display:block;font-family:var(--display);font-weight:800}
.note{font-size:.92rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}

/* Learn */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.top .left{display:flex;align-items:center;gap:10px;min-width:0}
.score{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:6px 14px;font-size:1.05rem}
.score.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.rail-wrap{overflow-x:auto;padding-bottom:6px}
.rail{display:flex;gap:4px;min-width:max-content}
.rail button{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:38px;cursor:pointer;font-family:var(--display);font-weight:800;position:relative;font-size:.95rem}
.rail button.done{background:var(--soft);border-color:var(--acc)}
.rail button.cur{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.rail button.miss{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}
.chip.ok{border-color:var(--good)} .chip.miss{border-color:var(--bad);color:var(--bad)}
.rail button.cp::after{content:"";position:absolute;bottom:-7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted)}
.bench{display:grid;gap:18px}
@media(min-width:780px){.bench{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.tilecol{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{appearance:none;cursor:pointer;width:100%;max-width:360px;aspect-ratio:1/1;border-radius:28px;border:2px solid var(--line);background:var(--surface);box-shadow:0 10px 0 var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:transform .12s, box-shadow .12s}
.tile:active{transform:translateY(6px);box-shadow:0 4px 0 var(--acc)}
.tile .g{font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;line-height:.9;font-size:clamp(6rem,30vw,9.5rem);display:flex;align-items:baseline;gap:.08em}
.tile .g small{font-size:.55em;color:var(--acc)}
.tile .nm{font-size:1rem;color:var(--muted);font-weight:600}
.tile.playing{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 10px 0 var(--acc),0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}100%{box-shadow:0 10px 0 var(--acc),0 0 0 22px transparent}}
.tapcap{font-weight:700;color:var(--acc);display:flex;gap:8px;align-items:center}
.ipa{font-family:var(--ipa);font-size:1.15em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.soundline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.soundline .ipa{font-size:2rem;color:var(--acc);font-weight:700}
.stage{min-height:112px;border-radius:14px;background:var(--soft);padding:16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stage .count{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stage .w{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 108;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;overflow-wrap:anywhere}
.stage .w mark{background:none;color:var(--acc);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.stage .m{color:var(--muted)}
.stage.empty{color:var(--muted)}
.stage .w,.stage .m{animation:rise .35s ease-out}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}}
.vars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.vars li{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.vars li:first-child{border-top:0;padding-top:0}
.vars .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vars .hd .ipa{color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;max-width:100%;text-align:left}
.chip b{font-weight:700}
.chip span{color:var(--muted);font-size:.88rem}
.chip:hover{border-color:var(--acc)}
.turn{border:2px solid var(--acc)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}}
.turnrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.turnrow>div{flex:1 1 200px;min-width:0}
.fb{font-weight:700;min-height:1.5em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--acc)}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rules .panel h3{font-size:1.05rem}
.big{font-family:var(--display);font-weight:900;font-size:clamp(3rem,12vw,5rem);font-variant-numeric:tabular-nums;color:var(--acc);line-height:1}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--surface);align-self:flex-start;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button span{font-weight:600;opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.seg button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.rail.teams button{width:auto;min-width:40px;padding:0 9px;font-size:.82rem;white-space:nowrap}
.tile .g.team{font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;text-align:center;justify-content:center;flex-wrap:wrap;padding:0 14px;font-variation-settings:"wdth" 112}
@media(max-width:779px){.tile .g.team{font-size:clamp(2.2rem,11vw,3.4rem)}}
.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.syl{font-weight:600;letter-spacing:.01em}
.syl .st{color:var(--acc);font-weight:800}
.wd .st{color:inherit;font-weight:800;box-shadow:inset 0 -3px 0 var(--acc)}
.syl .dot{color:var(--muted);margin:0 1px}
.passage{appearance:none;text-align:left;cursor:pointer;background:var(--soft);border:2px dashed var(--acc);border-radius:16px;padding:18px;font-family:var(--body);font-size:clamp(1.15rem,4.4vw,1.45rem);line-height:1.9;color:var(--ink);max-width:70ch}
.passage.paused{border-style:dashed;border-color:var(--warn)}
.passage.on{border-style:solid;animation:ring 1.4s ease-out infinite}
.wd{border-radius:5px;padding:1px 2px;transition:background .2s,color .2s}
.wd.next{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.wd.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.wd.close{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);text-decoration:underline dotted}
.wd.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);text-decoration:underline wavy;text-underline-offset:4px}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally .t{font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.t.ok{color:var(--good)} .t.close{color:var(--warn)} .t.bad{color:var(--bad)}
.probs{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prob{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prob.close{border-left-color:var(--warn)}
.prob .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pw{font-family:var(--display);font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
mark.lx{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);border-radius:3px}
.tpick{display:flex;flex-wrap:wrap;gap:8px}
.tpick .chip.on{border-color:var(--acc);background:var(--soft)}
.tpick .chip b{font-family:var(--display)}
.lvl{font-weight:800;color:var(--acc);font-size:.8rem;letter-spacing:.06em}
.hubs{display:flex;flex-direction:column;gap:12px;max-width:680px}
.hubc{appearance:none;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 5px 0 var(--acc)}
.hubc:disabled{cursor:default;box-shadow:none;opacity:.6}
.hubc .hn{font-family:var(--display);font-weight:900;font-size:1.8rem;color:var(--acc);width:1.4em;flex:0 0 auto;text-align:center}
.hubc .ht{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hubc .ht b{font-family:var(--display);font-weight:800;font-size:1.15rem}
.hubc .ht span{color:var(--muted);font-size:.92rem}
.hubc .go{font-size:1.5rem;color:var(--acc);font-weight:800}
.hubc .soon{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.glist{display:flex;flex-direction:column;gap:18px;max-width:760px}
.gg{display:flex;flex-direction:column;gap:8px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.gi[open]{border-color:var(--acc)}
.gi summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:14px 16px;font-weight:700;font-size:1.05rem}
.gi summary::-webkit-details-marker{display:none}
.gi summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:14px}
.rn{font-family:var(--ipa);color:var(--acc);font-weight:700;min-width:3.4em;font-variant-numeric:tabular-nums}
.gt{flex:1;min-width:0}
.chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);align-self:center;transition:transform .2s}
.gi[open] .chev{transform:rotate(-135deg)}
.gbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.form{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.form p{font-weight:600}
.more{align-self:flex-start}
.extra{display:flex;flex-direction:column;gap:10px}
.vpick .chip.on{border-color:var(--acc);background:var(--soft)}
.conj{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.conj button,.tbl-wrap td button{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;color:var(--ink);font-weight:600}
.conj button{display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.conj button svg{flex:0 0 auto;color:var(--acc)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl-wrap table{border-collapse:collapse;width:100%;min-width:max-content}
.tbl-wrap th,.tbl-wrap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-wrap th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--soft)}
.tbl-wrap tr:last-child td{border-bottom:0}
.tbl-wrap td button:hover{color:var(--acc)}
.quizrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.qbadge{font-size:.78rem;font-weight:800;color:var(--good);border:1.5px solid var(--good);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;align-self:center}
.final{border:2px solid var(--acc)}
.final.locked{border-style:dashed;border-color:var(--line);opacity:.8}
.qp{font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:800;line-height:1.3}
.qopts{display:grid;gap:10px}
.qo{appearance:none;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 16px;font-weight:600;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.qo:hover:not(:disabled){border-color:var(--acc)}
.qo:disabled{cursor:default}
.qo.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.qo.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.fx{position:relative;height:clamp(220px,46vw,300px);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 115%,#3a1204 0%,#0d0604 55%,#050304 100%);cursor:pointer}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx.subj{height:clamp(300px,82vw,400px);background:linear-gradient(#141833 0%,#2d2347 55%,#4a3040 100%)}
.fx.subj .st-svg{position:absolute;inset:0;width:100%;height:100%}
.fx.subj .fx-skip{top:10px;bottom:auto}
.st-cap{position:absolute;left:12px;right:12px;bottom:8px;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(.85rem,3.6vw,1.05rem);color:#ffe7a8;text-shadow:0 1px 3px #000;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.st-cap.on{opacity:1;transform:none}
.st-bub{position:absolute;max-width:58%;padding:7px 11px;border-radius:14px;background:#fffaf0;color:#1a1420;font-weight:700;font-size:clamp(.8rem,3.4vw,1rem);line-height:1.25;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;pointer-events:none}
.st-bub.genie{background:#dff3ff}
.st-bub.on{opacity:1;transform:none}
.fx.past{background:radial-gradient(ellipse at 50% 115%,#0e4458 0%,#081a22 55%,#03080b 100%)}
.fx.future{background:radial-gradient(ellipse at 50% 115%,#124a22 0%,#06160c 55%,#020604 100%)}
.fx.past .fx-smoke{color:#e2f2f8}.fx.past .fx-smoke span{color:#a9c6d2}
.fx.future .fx-smoke{color:#eafff0}.fx.future .fx-smoke span{color:#a7d8b4}
.fx.past .fx-word{color:#b4b9c0;text-shadow:0 -1px 0 #e6e9ee,0 2px 0 #5c6067,0 3px 0 #464a50,0 6px 12px rgba(0,0,0,.75)}
.fx-word.slam{opacity:1;animation:slam .55s cubic-bezier(.3,1.5,.5,1) both}
.fx-word.set{opacity:1}
.fx .fx-word.wash{opacity:1;color:#7f97a3;transition:color .6s}
@keyframes slam{0%{opacity:0;transform:translateY(-90px) scale(1.12);filter:blur(3px)}60%{opacity:1;transform:translateY(6px);filter:none}100%{opacity:1;transform:none}}
.fx.future .fx-word{color:#f0fffd;text-shadow:0 0 5px #9ff7ff,0 0 14px #2fc8ff,0 0 30px #1a6bff}
.fx-word.strike{opacity:1;animation:strike .45s steps(1) both}
.fx-word.charged{opacity:1;animation:buzz .11s infinite alternate}
.fx .fx-word.wind{opacity:1;color:#c9f7d2;text-shadow:0 0 6px #49d16a,0 0 18px #1f7a35;transition:color .4s,text-shadow .4s;-webkit-mask-image:linear-gradient(to right,transparent var(--b),#000 calc(var(--b) + 12%));mask-image:linear-gradient(to right,transparent var(--b),#000 calc(var(--b) + 12%))}
@keyframes strike{0%{opacity:0}15%{opacity:1}30%{opacity:.15}45%{opacity:1}60%{opacity:.4}75%{opacity:1}}

or favor.","I would like to travel.":"Me gustaría viajar.","If I had time, I would be happy.":"Si tuviera tiempo, estaría contento.","Could you help me?":"¿Podría ayudarme?","I would have liked to do that.":"Me habría gustado hacerlo.","He says he is ill.":"Dice que está enfermo.","She said she would do it tomorrow.":"Dijo que lo haría mañana.","The house is being built.":"La casa se está construyendo.","The book was written in 1990.":"El libro fue escrito en 1990.","German is spoken here.":"Aquí se habla alemán.","He says that he's tired (everyday speech).":"Dice que está cansado (lenguaje cotidiano).","I don't have a car.":"No tengo coche.","When does the course start?":"¿Cuándo empieza el curso?","Why are you learning German?":"¿Por qué aprendes alemán?","The house is big.":"La casa es grande.","a big house":"una casa grande","I'm taller than you.":"Soy más alto que tú.","He drives fast.":"Conduce rápido.","She sings well.":"Canta bien.","I like drinking tea.":"Me gusta beber té.","the day → the days":"el día → los días","the woman → the women":"la mujer → las mujeres","the (female) teachers":"las profesoras","Silent E makes the vowel say its name":"La E muda hace que la vocal suene como su nombre","A final e is not spoken, but it makes the vowel before it long.":"La e final no se pronuncia, pero alarga la vocal anterior.","Soft C and soft G":"C suave y G suave","Before e, i or y, c usually sounds like s and g like j. Elsewhere they stay hard.":"Delante de e, i o y, la c suele sonar como s y la g como j inglesa. En los demás casos son fuertes.","Silent letters":"Letras mudas","Some pairs hide a letter: kn, wr, mb, gh.":"Algunas parejas esconden una letra: kn, wr, mb, gh.","Two vowels together":"Dos vocales juntas","Often the first vowel says its name and the second is silent. There are many exceptions.":"A menudo la primera vocal suena como su nombre y la segunda es muda. Hay muchas excepciones.","The three sounds of -ed":"Los tres sonidos de -ed","/t/ after voiceless sounds, /d/ after voiced sounds, /ɪd/ after t or d.":"/t/ después de sonidos sordos, /d/ después de sonidos sonoros, /ɪd/ después de t o d.","The three sounds of plural -s":"Los tres sonidos de la -s del plural","/s/ after voiceless sounds, /z/ after voiced sounds, /ɪz/ after s, z, sh, ch.":"/s/ después de sonidos sordos, /z/ después de sonidos sonoros, /ɪz/ después de s, z, sh, ch.","Stress and the schwa":"El acento y la schwa","Unstressed vowels often weaken to /ə/. Moving the stress can change the word.":"Las vocales átonas suelen debilitarse a /ə/. Cambiar el acento puede cambiar la palabra.","-tion and -sion":"-tion y -sion","-tion sounds like /ʃən/. -sion is /ʃən/ or /ʒən/.":"-tion suena /ʃən/. -sion es /ʃən/ o /ʒən/.","Five pure vowels":"Cinco vocales puras","a, e, i, o, u always keep the same short, clear sound. They never glide or weaken.":"a, e, i, o, u mantienen siempre el mismo sonido corto y claro. Nunca se deslizan ni se debilitan.","Where the stress goes":"Dónde va el acento","Words ending in a vowel, n or s stress the second-to-last syllable. Others stress the last. A written accent overrides both.":"Las palabras que terminan en vocal, n o s llevan el acento en la penúltima sílaba. Las demás, en la última. La tilde manda sobre ambas reglas.","H is always silent":"La H siempre es muda","Except in ch, the letter h is never pronounced.":"Salvo en ch, la letra h nunca se pronuncia.","B and V sound the same":"La B y la V suenan igual","Both are /b/ at the start, and soft [β] between vowels.":"Las dos son /b/ al principio y [β] suave entre vocales.","ce, ci and z":"ce, ci y z","/θ/ (like th in think) in most of Spain, /s/ in Latin America and the Canaries.":"/θ/ (como la th inglesa de think) en casi toda España, /s/ en Latinoamérica y Canarias.","ge, gi and j":"ge, gi y j","A rough throat sound /x/. Add a silent u (gue, gui) to keep the g hard.":"Un sonido áspero de garganta /x/. Añade una u muda (gue, gui) para que la g siga siendo fuerte.","R and RR":"R y RR","A single r between vowels is a quick tap. rr, and r at the start of a word, is a rolled trill.":"Una sola r entre vocales es un toque rápido. La rr, y la r al principio de palabra, es vibrante múltiple.","Diphthongs":"Diptongos","i and u next to a, e or o join with it into one syllable.":"i y u junto a a, e u o se unen con ella en una sola sílaba.","Final consonants are usually silent":"Las consonantes finales suelen ser mudas","Most final consonants are dropped. C, R, F and L are often spoken (think “CaReFuL”).":"La mayoría de las consonantes finales no se pronuncian. C, R, F y L a menudo sí (recuerda “CaReFuL”).","Final -e is silent":"La -e final es muda","It isn't spoken, but it makes the consonant before it heard.":"No se pronuncia, pero hace que se oiga la consonante anterior.","Liaison":"Liaison (enlace)","A silent final consonant links to the next word when that word starts with a vowel.":"Una consonante final muda se une a la palabra siguiente cuando esta empieza por vocal.","Nasal vowels":"Vocales nasales","A vowel followed by n or m (at the end, or before another consonant) is said through the nose.":"Una vocal seguida de n o m (al final o delante de otra consonante) se pronuncia por la nariz.","Vowel teams":"Grupos de vocales","Accents change the sound":"Los acentos cambian el sonido","é is /e/, è and ê are /ɛ/. ç is always /s/.":"é es /e/, è y ê son /ɛ/. ç siempre es /s/.","Even rhythm, last syllable heavier":"Ritmo regular, última sílaba más marcada","Syllables are evenly timed, with a little extra weight on the last one of a phrase.":"Las sílabas duran lo mismo, con un poco más de fuerza en la última de la frase.","H is never pronounced":"La H nunca se pronuncia","Some words have an “h aspiré”, which blocks liaison even though it is silent.":"Algunas palabras tienen una “h aspirada”, que impide la liaison aunque no se pronuncia.","Say every letter":"Pronuncia todas las letras","German is spelled as it sounds. Final -e is spoken, and so is the k in kn.":"El alemán se escribe como suena. La -e final se pronuncia, y también la k de kn.","Long or short vowel":"Vocal larga o corta","A double consonant after a vowel makes it short. h, a double vowel or ie makes it long.":"Una consonante doble después de una vocal la hace corta. La h, una vocal doble o ie la hacen larga.","Final devoicing":"Ensordecimiento final","b, d and g at the end of a word or syllable sound like p, t and k.":"b, d y g al final de palabra o sílaba suenan como p, t y k.","ei and ie":"ei e ie","ei is /aɪ/, ie is /iː/. Tip: say the English name of the second letter.":"ei es /aɪ/ e ie es /iː/. Truco: di el nombre en inglés de la segunda letra.","The two sounds of ch":"Los dos sonidos de ch","/x/ (back of the throat) after a, o, u, au. /ç/ (a soft hiss) everywhere else.":"/x/ (al fondo de la garganta) después de a, o, u, au. /ç/ (un siseo suave) en los demás casos.","S, sp and st":"S, sp y st","s before a vowel is /z/. sp and st at the start of a word are /ʃp/ and /ʃt/.":"La s delante de vocal es /z/. sp y st al principio de palabra son /ʃp/ y /ʃt/.","Stress on the first syllable":"Acento en la primera sílaba","Most words stress the first syllable. The prefixes be-, ge- and ver- are never stressed.":"La mayoría de las palabras llevan el acento en la primera sílaba. Los prefijos be-, ge- y ver- nunca se acentúan.","Umlauts":"Umlauts (diéresis)","ä is like e in bed. For ö, say e with rounded lips. For ü, say i with rounded lips.":"ä suena como una e abierta. Para la ö, di e con los labios redondeados. Para la ü, di i con los labios redondeados.","W, V and Z":"W, V y Z","w sounds like English v, v like f, and z like ts.":"La w suena como v (labios y dientes), la v como f y la z como ts.","Where the stress falls in English":"Dónde va el acento en inglés","English has no single fixed rule, so learn each word's stress with the word.":"El inglés no tiene una regla fija, así que aprende el acento de cada palabra junto con la palabra.","Most two-syllable nouns and adjectives stress the first syllable: TA·ble, HAP·py.":"La mayoría de los sustantivos y adjetivos de dos sílabas llevan el acento en la primera: TA·ble, HAP·py.","Most two-syllable verbs stress the second syllable: be·GIN, re·LAX.":"La mayoría de los verbos de dos sílabas llevan el acento en la segunda: be·GIN, re·LAX.","Words ending in -tion, -sion and -ic stress the syllable just before the ending: in·for·MA·tion.":"Las palabras en -tion, -sion e -ic llevan el acento justo antes de la terminación: in·for·MA·tion.","Unstressed vowels often weaken to a short “uh” sound /ə/.":"Las vocales átonas suelen debilitarse a un sonido corto “ə” /ə/.","Where the stress falls in Spanish":"Dónde va el acento en español","Words ending in a vowel, n or s stress the second-to-last syllable: CA·sa, JO·ven.":"Las palabras que terminan en vocal, n o s llevan el acento en la penúltima sílaba: CA·sa, JO·ven.","Words ending in any other consonant stress the last syllable: ciu·DAD, ha·BLAR.":"Las que terminan en otra consonante, en la última: ciu·DAD, ha·BLAR.","A written accent overrides both rules and marks the stressed syllable: can·CIÓN, ÁR·bol.":"La tilde manda sobre las dos reglas y marca la sílaba tónica: can·CIÓN, ÁR·bol.","Every vowel keeps its full, clear sound, stressed or not.":"Todas las vocales mantienen su sonido pleno y claro, tónicas o no.","Where the stress falls in French":"Dónde va el acento en francés","Every word has its stress on its last spoken syllable: cho·co·LAT.":"Cada palabra lleva el acento en su última sílaba pronunciada: cho·co·LAT.","A silent final -e doesn't count as a syllable: ba·NANE.":"Una -e final muda no cuenta como sílaba: ba·NANE.","In a sentence, only the last word of each word group gets the stress: je suis é·tu·DIANT.":"En una frase, solo la última palabra de cada grupo lleva el acento: je suis é·tu·DIANT.","All the other syllables are said evenly, with the same length and strength.":"Todas las demás sílabas se dicen igual, con la misma duración y fuerza.","Where the stress falls in German":"Dónde va el acento en alemán","Most German words stress the first syllable: MOR·gen, WAS·ser.":"La mayoría de las palabras alemanas llevan el acento en la primera sílaba: MOR·gen, WAS·ser.","The prefixes be-, ge-, er-, ver-, zer- and ent- are never stressed. The stress moves to the next syllable: ver·STE·hen.":"Los prefijos be-, ge-, er-, ver-, zer- y ent- nunca se acentúan. El acento pasa a la sílaba siguiente: ver·STE·hen.","Separable prefixes like an-, auf- and mit- are stressed: AN·ru·fen.":"Los prefijos separables como an-, auf- y mit- sí se acentúan: AN·ru·fen.","In compound words, the first part gets the stress: FUSS·ball.":"En las palabras compuestas, el acento va en la primera parte: FUSS·ball.","Many loanwords stress the last syllable: Mu·SIK.":"Muchos préstamos llevan el acento en la última sílaba: Mu·SIK.","Habits, facts and routines.":"Hábitos, hechos y rutinas.","Actions happening now or around now, and fixed plans for the future.":"Acciones que pasan ahora o en esta época, y planes fijos para el futuro.","Past actions connected to now: experiences, recent results, and situations that are still true.":"Acciones pasadas relacionadas con el presente: experiencias, resultados recientes y situaciones que siguen siendo verdad.","An action that started in the past and is still going on, often with for or since.":"Una acción que empezó en el pasado y sigue, a menudo con for o since.","Finished actions at a definite time in the past.":"Acciones terminadas en un momento concreto del pasado.","An action in progress at a moment in the past, often interrupted by another action.":"Una acción en curso en un momento del pasado, a menudo interrumpida por otra.","An action that happened before another past action.":"Una acción que ocurrió antes que otra acción pasada.","A longer action that continued up to a moment in the past.":"Una acción larga que duró hasta un momento del pasado.","Predictions, promises, offers and decisions made at the moment of speaking.":"Predicciones, promesas, ofrecimientos y decisiones tomadas en el momento de hablar.","Plans and intentions, and predictions based on what you can see now.":"Planes e intenciones, y predicciones basadas en lo que ves ahora.","An action that will be in progress at a time in the future.":"Una acción que estará en curso en un momento del futuro.","An action that will be finished before a time in the future.":"Una acción que habrá terminado antes de un momento del futuro.","How long an action will have continued by a time in the future.":"Cuánto tiempo habrá durado una acción en un momento del futuro.","The normal mood for facts and questions. All the tenses above are in the indicative.":"El modo normal para hechos y preguntas. Todos los tiempos de arriba están en indicativo.","Orders, instructions, advice and invitations. There is no subject.":"Órdenes, instrucciones, consejos e invitaciones. No hay sujeto.","Imagined situations and polite requests, often with if.":"Situaciones imaginadas y peticiones educadas, a menudo con if.","What would have happened in the past, but didn't.":"Lo que habría pasado en el pasado, pero no pasó.","Formal demands and recommendations after verbs like suggest, insist and recommend. The verb stays in the base form for every person.":"Exigencias y recomendaciones formales después de verbos como suggest, insist y recommend. El verbo queda en su forma base para todas las personas.","Unreal or imagined situations after if and wish. With be, use were for every person.":"Situaciones irreales o imaginadas después de if y wish. Con be, se usa were para todas las personas.","Use the passive when the action matters more than who does it. The object of the active sentence becomes the subject.":"Usa la pasiva cuando importa más la acción que quién la hace. El objeto de la oración activa pasa a ser el sujeto.","When you report what someone said, the tense usually moves one step back, and pronouns and time words change.":"Cuando cuentas lo que dijo alguien, el tiempo verbal suele retroceder un paso, y cambian los pronombres y las expresiones de tiempo.","Add not after the auxiliary verb (be, have, will, can…). If there is no auxiliary, use do / does / did + not.":"Añade not después del verbo auxiliar (be, have, will, can…). Si no hay auxiliar, usa do / does / did + not.","Put the auxiliary before the subject. With no auxiliary, use do / does / did. Question words come first.":"Pon el auxiliar delante del sujeto. Si no hay auxiliar, usa do / does / did. Las palabras interrogativas van primero.","Adjectives never change for gender or number. They go before the noun or after be. Short adjectives add -er / -est to compare; long ones use more / most.":"Los adjetivos nunca cambian de género ni de número. Van delante del sustantivo o después de be. Los cortos añaden -er / -est para comparar; los largos usan more / most.","Adverbs say how, when or how often. Most are made by adding -ly to the adjective.":"Los adverbios dicen cómo, cuándo o con qué frecuencia. La mayoría se forman añadiendo -ly al adjetivo.","Most nouns add -s. The spelling changes after some endings, and a few common nouns are irregular.":"La mayoría de los sustantivos añaden -s. La ortografía cambia con algunas terminaciones, y unos pocos sustantivos comunes son irregulares.","English nouns have no grammatical gender, and most job words are used for everyone (teacher, doctor, actor). A few words still have separate female forms.":"Los sustantivos ingleses no tienen género gramatical, y la mayoría de las profesiones sirven para todos (teacher, doctor, actor). Unas pocas palabras aún tienen forma femenina propia.","Habits, facts, what is happening now, and the near future.":"Hábitos, hechos, lo que pasa ahora y el futuro próximo.","An action happening right now.":"Una acción que está pasando justo ahora.","Past actions connected to the present, often with hoy, este año, ya or nunca.":"Acciones pasadas relacionadas con el presente, a menudo con hoy, este año, ya o nunca.","Finished actions at a specific time in the past.":"Acciones terminadas en un momento concreto del pasado.","Past habits, descriptions, and actions in progress in the past.":"Hábitos pasados, descripciones y acciones en curso en el pasado.","An action that was in progress at a moment in the past.":"Una acción que estaba en curso en un momento del pasado.","A literary tense for an action just before another past action, mostly after cuando, en cuanto or apenas. In speech, the pluscuamperfecto or the indefinido is used instead.":"Un tiempo literario para una acción justo anterior a otra pasada, sobre todo después de cuando, en cuanto o apenas. Al hablar se usa el pluscuamperfecto o el indefinido.","Plans and things that are about to happen.":"Planes y cosas que están a punto de pasar.","Future actions, predictions, and guesses about the present.":"Acciones futuras, predicciones y suposiciones sobre el presente.","An action that will be finished by a time in the future.":"Una acción que habrá terminado en un momento del futuro.","Hypothetical situations, polite requests and advice.":"Situaciones hipotéticas, peticiones educadas y consejos.","What would have happened, but didn't.":"Lo que habría pasado, pero no pasó.","The mood for facts and certainty. All the tenses above are in the indicative.":"El modo de los hechos y la certeza. Todos los tiempos de arriba están en indicativo.","Wishes, doubts, emotions and requests, usually after que.":"Deseos, dudas, emociones y peticiones, normalmente después de que.","Like the pretérito perfecto, but after expressions that need the subjunctive.":"Como el pretérito perfecto, pero después de expresiones que piden subjuntivo.","Past wishes, and unreal conditions with si.":"Deseos pasados y condiciones irreales con si.","Unreal situations in the past, often with si.":"Situaciones irreales en el pasado, a menudo con si.","Orders, instructions and invitations. Negative orders use the subjunctive: no hables.":"Órdenes, instrucciones e invitaciones. Las órdenes negativas usan el subjuntivo: no hables.","Use ser + participio. The participle agrees with the subject. In everyday Spanish, the pasiva refleja with se is more common.":"Se usa ser + participio. El participio concuerda con el sujeto. En el español de todos los días es más frecuente la pasiva refleja con se.","After a past reporting verb (dijo, preguntó), the tense moves back, and pronouns and time words change.":"Después de un verbo introductor en pasado (dijo, preguntó), el tiempo retrocede, y cambian los pronombres y las expresiones de tiempo.","Put no before the verb, and before any object pronouns. Spanish uses double negatives: no + verb + nada, nadie or nunca.":"Pon no delante del verbo y de los pronombres de objeto. El español usa la doble negación: no + verbo + nada, nadie o nunca.","Questions start with ¿ and end with ?. For yes/no questions, the word order can stay the same and your voice rises at the end. Question words always have an accent.":"Las preguntas empiezan con ¿ y terminan con ?. En las preguntas de sí o no, el orden puede ser el mismo y la voz sube al final. Las palabras interrogativas siempre llevan tilde.","Adjectives agree with the noun in gender and number, and usually go after it.":"Los adjetivos concuerdan con el sustantivo en género y número, y suelen ir detrás.","Many adverbs are made by adding -mente to the feminine form of the adjective. A written accent on the adjective stays.":"Muchos adverbios se forman añadiendo -mente a la forma femenina del adjetivo. La tilde del adjetivo se mantiene.","Add -s after a vowel and -es after a consonant. Watch the spelling and the written accents.":"Añade -s después de vocal y -es después de consonante. Fíjate en la ortografía y las tildes.","Nouns for people and many animals change for gender, and so does the article.":"Los sustantivos de personas y de muchos animales cambian según el género, y también el artículo.","Habits, facts and what is happening now.":"Hábitos, hechos y lo que pasa ahora.","To stress that an action is happening right now.":"Para destacar que una acción está pasando justo ahora.","Finished actions in the past. It's the main past tense in speech.":"Acciones terminadas en el pasado. Es el principal tiempo pasado en la lengua hablada.","Something that has only just happened.":"Algo que acaba de pasar.","The literary past tense. You'll read it in books, but you don't need to speak it.":"El pasado literario. Lo leerás en libros, pero no hace falta usarlo al hablar.","A literary tense for an action just before another action in the passé simple, mostly after quand or dès que.":"Un tiempo literario para una acción justo anterior a otra en passé simple, sobre todo después de quand o dès que.","Future actions and predictions.":"Acciones futuras y predicciones.","An action that will be finished before a moment in the future.":"Una acción que habrá terminado antes de un momento del futuro.","The mood for facts and certainty. The present, past and future tenses above are all in the indicative.":"El modo de los hechos y la certeza. Los tiempos de presente, pasado y futuro de arriba están en indicativo.","After expressions of wish, necessity, emotion and doubt followed by que.":"Después de expresiones de deseo, necesidad, emoción y duda seguidas de que.","A finished action after expressions that need the subjunctive.":"Una acción terminada después de expresiones que piden subjuntivo.","Orders and instructions. Only tu, nous and vous, without the pronoun. -er verbs drop the -s in the tu form.":"Órdenes e instrucciones. Solo tu, nous y vous, sin el pronombre. Los verbos en -er pierden la -s en la forma tu.","Use être in the tense you need + participe passé. The participle agrees with the subject, and the agent is introduced with par. In speech, French often uses on instead.":"Se usa être en el tiempo necesario + participe passé. El participio concuerda con el sujeto y el agente se introduce con par. Al hablar, el francés suele usar on.","After a past reporting verb (il a dit, elle a demandé), the tense moves back, and pronouns and time words change.":"Después de un verbo introductor en pasado (il a dit, elle a demandé), el tiempo retrocede, y cambian los pronombres y las expresiones de tiempo.","Put ne … pas around the conjugated verb (ne → n' before a vowel). In compound tenses, it goes around the auxiliary. In everyday speech, ne is often dropped.":"Pon ne … pas alrededor del verbo conjugado (ne → n' delante de vocal). En los tiempos compuestos, rodea al auxiliar. Al hablar, a menudo se omite ne.","There are three ways to ask: rising intonation (informal), est-ce que (neutral), or swapping the verb and subject (formal).":"Hay tres formas de preguntar: con entonación ascendente (informal), con est-ce que (neutro) o invirtiendo verbo y sujeto (formal).","Adjectives agree in gender and number, and usually go after the noun. A few common ones go before it: beau, bon, grand, petit, jeune, vieux, nouveau.":"Los adjetivos concuerdan en género y número, y suelen ir detrás del sustantivo. Algunos comunes van delante: beau, bon, grand, petit, jeune, vieux, nouveau.","Add -ment to the feminine adjective. If the adjective ends in a vowel, use the masculine. -ant and -ent become -amment and -emment.":"Añade -ment al adjetivo femenino. Si el adjetivo termina en vocal, usa el masculino. -ant y -ent pasan a -amment y -emment.","Most nouns add -s, which isn't pronounced. The article (les, des) tells the listener it's plural.":"La mayoría de los sustantivos añaden -s, que no se pronuncia. El artículo (les, des) indica que es plural.","Nouns for people and many adjectives change for gender. Usually you add -e, but some endings change.":"Los sustantivos de personas y muchos adjetivos cambian según el género. Normalmente se añade -e, pero algunas terminaciones cambian.","The present, habits and facts. With a time word, it's also used for the future.":"El presente, los hábitos y los hechos. Con una expresión de tiempo, también se usa para el futuro.","The main past tense in speech.":"El principal tiempo pasado en la lengua hablada.","The past tense of written German and stories. In speech, it's used mainly with sein, haben and modal verbs.":"El pasado del alemán escrito y de los cuentos. Al hablar se usa sobre todo con sein, haben y los verbos modales.","Future plans, predictions and assumptions.":"Planes futuros, predicciones y suposiciones.","An action that will be finished in the future, or a guess about the past.":"Una acción que estará terminada en el futuro, o una suposición sobre el pasado.","Orders and requests. The du form has no -st and often drops the -e. Verbs with e → i keep the i: sprich!":"Órdenes y peticiones. La forma du no lleva -st y a menudo pierde la -e. Los verbos con cambio e → i mantienen la i: sprich!","Wishes, unreal situations and polite requests. Most verbs use würde + infinitive; sein, haben and modal verbs have their own forms.":"Deseos, situaciones irreales y peticiones educadas. La mayoría de los verbos usan würde + infinitivo; sein, haben y los verbos modales tienen formas propias.","Unreal situations and regrets about the past.":"Situaciones irreales y arrepentimientos sobre el pasado.","Used for reported speech, mainly in the news and in formal writing.":"Se usa en el estilo indirecto, sobre todo en las noticias y en textos formales.","Use werden + Partizip II. The agent is introduced with von.":"Se usa werden + Partizip II. El agente se introduce con von.","Formal German uses Konjunktiv I. If that looks the same as the normal present, use Konjunktiv II. In everyday speech, most people use dass with the normal verb.":"El alemán formal usa el Konjunktiv I. Si coincide con el presente normal, se usa el Konjunktiv II. Al hablar, casi todo el mundo usa dass con el verbo normal.","nicht negates verbs, adjectives and whole sentences. kein negates nouns that would have ein or no article, and it takes the same endings as ein.":"nicht niega verbos, adjetivos y oraciones enteras. kein niega sustantivos que llevarían ein o ningún artículo, y tiene las mismas terminaciones que ein.","Yes/no questions start with the verb. W-questions start with the question word, and the verb comes second.":"Las preguntas de sí o no empiezan por el verbo. Las preguntas con W empiezan por la palabra interrogativa y el verbo va en segundo lugar.","After sein, adjectives don't change. Before a noun, they take an ending that depends on the gender, the case and the article. This table shows the endings after der, die, das.":"Después de sein, los adjetivos no cambian. Delante de un sustantivo llevan una terminación que depende del género, el caso y el artículo. Esta tabla muestra las terminaciones después de der, die, das.","Most adjectives can be used as adverbs without any change. Some common adverbs, like gern and oft, are words of their own.":"La mayoría de los adjetivos pueden usarse como adverbios sin cambios. Algunos adverbios frecuentes, como gern y oft, son palabras propias.","German plurals should be learned with each noun, but there are patterns. The plural article is always die.":"Los plurales alemanes conviene aprenderlos con cada sustantivo, aunque hay patrones. El artículo plural es siempre die.","Most nouns for people add -in, and the article becomes die. The plural ends in -innen.":"La mayoría de los sustantivos de personas añaden -in, y el artículo pasa a ser die. El plural termina en -innen.","base verb · add -s or -es for he, she, it":"verbo base · añade -s o -es con he, she, it","am / is / are + verb-ing":"am / is / are + verbo-ing","have / has + past participle":"have / has + participio pasado","have / has been + verb-ing":"have / has been + verbo-ing","verb + -ed (regular) · past form (irregular: go → went)":"verbo + -ed (regular) · forma de pasado (irregular: go → went)","was / were + verb-ing":"was / were + verbo-ing","had + past participle":"had + participio pasado","had been + verb-ing":"had been + verbo-ing","will + base verb":"will + verbo base","am / is / are going to + base verb":"am / is / are going to + verbo base","will be + verb-ing":"will be + verbo-ing","will have + past participle":"will have + participio pasado","will have been + verb-ing":"will have been + verbo-ing","any tense above":"cualquiera de los tiempos de arriba","base verb · don't + base verb · let's + base verb":"verbo base · don't + verbo base · let's + verbo base","would + base verb":"would + verbo base","would have + past participle":"would have + participio pasado","(that) + subject + base verb":"(that) + sujeto + verbo base","if / wish + subject + past form (be → were)":"if / wish + sujeto + forma de pasado (be → were)","be (in any tense) + past participle (+ by …)":"be (en cualquier tiempo) + participio pasado (+ by …)","say (that) … · tell someone (that) … · ask if / whether …":"say (that) … · tell someone (that) … · ask if / whether …","do / does / did + not + base verb · auxiliary + not":"do / does / did + not + verbo base · auxiliar + not","(question word) + auxiliary + subject + verb?":"(palabra interrogativa) + auxiliar + sujeto + verbo?","short: -er / -est · long: more / most · irregular: good, bad, far":"cortos: -er / -est · largos: more / most · irregulares: good, bad, far","adjective + -ly · y → -ily · -le → -ly":"adjetivo + -ly · y → -ily · -le → -ly","mostly no change · a few use -ess or a different word":"casi siempre sin cambio · algunos usan -ess u otra palabra","-ar verbs take e endings, -er / -ir verbs take a endings: hable, coma, viva":"los verbos en -ar toman terminaciones con e, los verbos en -er / -ir con a: hable, coma, viva","ellos-form of the indefinido without -ron + -ra, -ras, -ra, -ramos, -rais, -ran":"forma de ellos del indefinido sin -ron + -ra, -ras, -ra, -ramos, -rais, -ran","tú: like the él form of the present · usted / nosotros / ustedes: subjunctive · vosotros: infinitive -r → -d":"tú: como la forma él del presente · usted / nosotros / ustedes: subjuntivo · vosotros: infinitivo -r → -d","ser + participio (+ por …) · se + verb in the 3rd person":"ser + participio (+ por …) · se + verbo en 3.ª persona","no + (pronoun) + verb · no … nada / nadie / nunca / ninguno":"no + (pronombre) + verbo · no … nada / nadie / nunca / ninguno","¿(question word) + verb + subject?":"¿(palabra interrogativa) + verbo + sujeto?","-o → -a for feminine · + -s after a vowel, + -es after a consonant for plural":"-o → -a para el femenino · + -s después de vocal, + -es después de consonante para el plural","feminine adjective + -mente":"adjetivo femenino + -mente","vowel + -s · consonant + -es · z → -ces":"vocal + -s · consonante + -es · z → -ces","-o → -a · consonant + -a · -e / -ista: same word":"-o → -a · consonante + -a · -e / -ista: la misma palabra","être (present) + en train de + infinitive":"être (presente) + en train de + infinitivo","avoir or être (present) + participe passé · with être, the participle agrees":"avoir o être (presente) + participe passé · con être, el participio concuerda","venir (present) + de + infinitive":"venir (presente) + de + infinitivo","nous-form stem (parl-ons) + -ais, -ais, -ait, -ions, -iez, -aient":"raíz de la forma nous (parl-ons) + -ais, -ais, -ait, -ions, -iez, -aient","avoir or être (imparfait) + participe passé":"avoir o être (imparfait) + participe passé","avoir or être (passé simple) + participe passé":"avoir o être (passé simple) + participe passé","aller (present) + infinitive":"aller (presente) + infinitivo","infinitive (-re verbs drop the e) + -ai, -as, -a, -ons, -ez, -ont":"infinitivo (los verbos en -re pierden la e) + -ai, -as, -a, -ons, -ez, -ont","avoir or être (futur) + participe passé":"avoir o être (futur) + participe passé","future stem + -ais, -ais, -ait, -ions, -iez, -aient":"raíz del futuro + -ais, -ais, -ait, -ions, -iez, -aient","avoir or être (conditionnel) + participe passé":"avoir o être (conditionnel) + participe passé","ils-form stem (ils parl-ent) + -e, -es, -e, -ions, -iez, -ent":"raíz de la forma ils (ils parl-ent) + -e, -es, -e, -ions, -iez, -ent","avoir or être (subjonctif) + participe passé":"avoir o être (subjonctif) + participe passé","present tense of tu, nous, vous without the pronoun":"presente de tu, nous, vous sin el pronombre","dire que … · demander si … · dire de + infinitive":"dire que … · demander si … · dire de + infinitivo","ne + verb + pas / plus / jamais / rien · personne ne …":"ne + verbo + pas / plus / jamais / rien · personne ne …","intonation · est-ce que + statement · verb-subject inversion":"entonación · est-ce que + afirmación · inversión verbo-sujeto","+ -e for feminine · + -s for plural · special endings below":"+ -e para el femenino · + -s para el plural · terminaciones especiales abajo","feminine adjective + -ment":"adjetivo femenino + -ment","stem + -e, -st, -t, -en, -t, -en":"raíz + -e, -st, -t, -en, -t, -en","haben or sein (present) + Partizip II at the end · verbs of movement and change use sein":"haben o sein (presente) + Partizip II al final · los verbos de movimiento y de cambio usan sein","regular: stem + -te, -test, -te, -ten, -tet, -ten · irregular verbs change the vowel":"regulares: raíz + -te, -test, -te, -ten, -tet, -ten · los irregulares cambian la vocal","hatte or war + Partizip II":"hatte o war + Partizip II","werden + infinitive at the end":"werden + infinitivo al final","du: stem (+ e) · ihr: like the present · Sie: infinitive + Sie":"du: raíz (+ e) · ihr: como el presente · Sie: infinitivo + Sie","würde + infinitive · wäre, hätte, könnte …":"würde + infinitivo · wäre, hätte, könnte …","hätte or wäre + Partizip II":"hätte o wäre + Partizip II","stem + -e, -est, -e, -en, -et, -en · sein: sei":"raíz + -e, -est, -e, -en, -et, -en · sein: sei","werden (any tense) + Partizip II":"werden (en cualquier tiempo) + Partizip II","verb + subject …? · W-word + verb + subject …?":"verbo + sujeto …? · palabra con W + verbo + sujeto …?","after sein: no ending · before a noun: -e or -en (after der / die / das)":"después de sein: sin terminación · delante de un sustantivo: -e o -en (después de der / die / das)","adjective = adverb (no ending)":"adjetivo = adverbio (sin terminación)","no ending · -e · -er · -en / -n · -s · often with an umlaut":"sin terminación · -e · -er · -en / -n · -s · a menudo con umlaut","+ -in · plural: -innen":"+ -in · plural: -innen","Habits and routines":"Hábitos y rutinas","General truths":"Verdades generales","Facts":"Hechos","Timetables and schedules":"Horarios y calendarios","Actions happening now":"Acciones que pasan ahora","Temporary situations":"Situaciones temporales","Fixed future plans":"Planes de futuro fijos","Changing situations":"Situaciones que cambian","Life experiences":"Experiencias vividas","Recent actions with a result now":"Acciones recientes con un resultado ahora","Situations that are still true":"Situaciones que siguen siendo verdad","Unfinished time: today, this week":"Un tiempo sin terminar: hoy, esta semana","Actions still going on":"Acciones que siguen","How long something has lasted":"Cuánto tiempo ha durado algo","Recent activities with visible results":"Actividades recientes con resultados visibles","Finished past actions":"Acciones pasadas terminadas","Past habits":"Hábitos del pasado","A series of past events":"Una serie de hechos pasados","Stories":"Relatos","Actions in progress in the past":"Acciones en curso en el pasado","The background to a story":"El fondo de una historia","An action that was interrupted":"Una acción interrumpida","Two actions at the same time":"Dos acciones a la vez","An action before another past action":"Una acción anterior a otra acción pasada","Reasons for a past situation":"Las razones de una situación pasada","Regrets: if I had known…":"Arrepentimientos: si lo hubiera sabido…","Long actions before a past moment":"Acciones largas antes de un momento pasado","Causes of a past result":"Las causas de un resultado pasado","How long something had lasted":"Cuánto tiempo había durado algo","Predictions":"Predicciones","Promises":"Promesas","Offers":"Ofrecimientos","Decisions made on the spot":"Decisiones tomadas en el momento","Plans":"Planes","Intentions":"Intenciones","Predictions from what you see now":"Predicciones por lo que ves ahora","Actions in progress at a future time":"Acciones en curso en un momento futuro","Polite questions about plans":"Preguntas educadas sobre planes","Actions finished before a future time":"Acciones terminadas antes de un momento futuro","Deadlines":"Plazos","How long an action will have lasted":"Cuánto habrá durado una acción","Duration up to a future moment":"Duración hasta un momento futuro","Statements":"Afirmaciones","Certainty":"Certeza","Orders":"Órdenes","Instructions":"Instrucciones","Advice":"Consejos","Invitations":"Invitaciones","Imagined situations":"Situaciones imaginadas","Polite requests":"Peticiones educadas","Advice: I would…":"Consejos: yo que tú…","Imagined past situations":"Situaciones pasadas imaginadas","Regrets":"Arrepentimientos","Results that never happened":"Resultados que nunca ocurrieron","Formal demands":"Exigencias formales","Recommendations":"Recomendaciones","Necessity: it's vital that…":"Necesidad: es vital que…","Wishes":"Deseos","Unreal situations":"Situaciones irreales","Advice: if I were you…":"Consejos: si yo fuera tú…","Habits":"Hábitos","Near-future plans":"Planes para un futuro próximo","Actions happening right now":"Acciones que pasan justo ahora","Actions in an unfinished time: hoy, este año":"Acciones en un tiempo sin terminar: hoy, este año","Recent actions":"Acciones recientes","Finished actions at a specific time":"Acciones terminadas en un momento concreto","Completed periods":"Periodos terminados","Descriptions in the past":"Descripciones en el pasado","Age and time in the past":"La edad y la hora en el pasado","Actions in progress at a past moment":"Acciones en curso en un momento pasado","Reported past events":"Hechos pasados contados","An action just before another past action":"Una acción justo antes de otra acción pasada","Literary texts":"Textos literarios","Things about to happen":"Cosas a punto de pasar","Future actions":"Acciones futuras","Guesses about the present":"Suposiciones sobre el presente","Actions in progress at a future moment":"Acciones en curso en un momento futuro","Guesses about what's happening now":"Suposiciones sobre lo que está pasando","Actions finished by a future time":"Acciones terminadas en un momento futuro","Guesses about the recent past":"Suposiciones sobre el pasado reciente","Hypothetical situations":"Situaciones hipotéticas","The future seen from the past":"El futuro visto desde el pasado","What would have happened":"Lo que habría pasado","Guesses about the past":"Suposiciones sobre el pasado","Doubts":"Dudas","Emotions":"Emociones","Requests after que":"Peticiones después de que","Wishes about finished actions":"Deseos sobre acciones terminadas","Doubts about the recent past":"Dudas sobre el pasado reciente","Unreal conditions with si":"Condiciones irreales con si","Past wishes":"Deseos pasados","Polite requests: quisiera…":"Peticiones educadas: quisiera…","Unreal past conditions":"Condiciones pasadas irreales","Regrets about the past":"Arrepentimientos sobre el pasado","The near future":"El futuro próximo","Stressing that something is ongoing":"Destacar que algo está en curso","Experiences":"Experiencias","Actions that have just happened":"Acciones que acaban de pasar","Descriptions":"Descripciones","Regrets with si":"Arrepentimientos con si","Finished actions in literature":"Acciones terminadas en la literatura","Historical texts":"Textos históricos","Actions finished before a future moment":"Acciones terminadas antes de un momento futuro","Reproaches":"Reproches","Necessity: il faut que…":"Necesidad: il faut que…","Doubt":"Duda","Finished actions after que":"Acciones terminadas después de que","Feelings about ot like coffee.|I doesn't like coffee.|I no like coffee.":"Ponlo en negativo: “I like coffee.”|I don't like coffee.|I not like coffee.|I doesn't like coffee.|I no like coffee.","Make it negative: “She works here.”|She doesn't work here.|She don't work here.|She doesn't works here.|She not works here.":"Ponlo en negativo: “She works here.”|She doesn't work here.|She don't work here.|She doesn't works here.|She not works here.","Make it negative: “They went out.”|They didn't go out.|They didn't went out.|They don't went out.|They not went out.":"Ponlo en negativo: “They went out.”|They didn't go out.|They didn't went out.|They don't went out.|They not went out.","Make it negative: “He is happy.”|He isn't happy.|He doesn't happy.|He don't is happy.|He not is happy.":"Ponlo en negativo: “He is happy.”|He isn't happy.|He doesn't happy.|He don't is happy.|He not is happy.","Make it negative: “We have finished.”|We haven't finished.|We don't have finished.|We didn't finished.|We not have finished.":"Ponlo en negativo: “We have finished.”|We haven't finished.|We don't have finished.|We didn't finished.|We not have finished.","Make it negative: “I will come.”|I won't come.|I willn't come.|I don't will come.|I will no come.":"Ponlo en negativo: “I will come.”|I won't come.|I willn't come.|I don't will come.|I will no come.","Make it negative: “You can swim.”|You can't swim.|You don't can swim.|You can no swim.|You doesn't can swim.":"Ponlo en negativo: “You can swim.”|You can't swim.|You don't can swim.|You can no swim.|You doesn't can swim.","Choose the correct sentence.|I never eat meat.|I don't never eat meat.|I not never eat meat.|I never don't eat meat.":"Elige la oración correcta.|I never eat meat.|I don't never eat meat.|I not never eat meat.|I never don't eat meat.","Choose the correct sentence.|Nobody called.|Nobody didn't call.|Anybody called not.|Nobody not called.":"Elige la oración correcta.|Nobody called.|Nobody didn't call.|Anybody called not.|Nobody not called
