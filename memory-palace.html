<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory Palace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@300;600;800&display=swap">
<style>
:root{--sky:#0a0a1f;--panel:#151233;--raise:#1e1a45;--line:rgba(216,180,254,.2);--ink:#f3eefe;--muted:#a99cc9;--violet:#c084fc;--violet-hi:#e9d5ff;--gold:#f5c533;--good:#3ee8a8;--bad:#ff5d7a;
  --ice:#38bdf8;--fire:#fb7185;--leaf:#4ade80;--neutral:#fbbf24;--display:"Sora",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#1c1440 0%,var(--sky) 60%) fixed,var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;font-weight:500;line-height:1.45}
button{font-family:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font:800 1.25rem var(--display);margin:0;letter-spacing:.01em}
.top .r{display:flex;gap:6px}
.icon{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:800;font-size:.9rem}
.icon.off{opacity:.55}
.steps{display:flex;gap:4px;margin:4px 0 12px}.steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}.steps i.on{background:var(--violet)}.steps i.done{background:var(--good)}
/* Sapi's instruction panel */
.guide{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(160deg,rgba(192,132,252,.16),rgba(192,132,252,.05));border:1px solid rgba(216,180,254,.35);border-radius:14px;padding:12px;margin-bottom:14px}
.guide .bot{flex:0 0 54px;height:64px}.guide .bot svg{width:54px;height:64px}
.guide .gx{flex:1;min-width:0}
.guide .st{font:700 .68rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
.guide h2{font:800 1.12rem var(--display);margin:2px 0 6px}
.guide .what,.guide .how{margin:0 0 6px}
.guide b.l{display:block;font:800 .72rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--violet-hi);margin-top:6px}
.guide ul{margin:2px 0 0;padding-left:18px}.guide li{margin:2px 0}
.guide .read{margin-top:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--violet-hi)}
.guide.talk .bot svg{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px 18px;font:800 1rem var(--display);letter-spacing:.02em;cursor:pointer;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.gold{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#221500}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.muted{color:var(--muted)}
/* town */
.town{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bld{position:relative;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:4px}
.bld .e{font-size:2rem;line-height:1}.bld b{font:800 1rem var(--display)}.bld small{color:var(--muted);font-size:.8rem}
.bld.locked{opacity:.5;cursor:not-allowed}.bld .lk{position:absolute;top:10px;right:10px;font-size:.95rem}
.bld .stars{color:var(--gold);font-size:.9rem;letter-spacing:2px}
.bld.special{background:linear-gradient(160deg,rgba(245,197,51,.12),var(--raise))}
.sec{font:800 .74rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin:18px 0 8px}
.how3{display:grid;gap:8px}.how3 div{display:flex;gap:10px;align-items:flex-start}.how3 .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--violet);color:#1a0b2e;font:800 .85rem var(--display);display:grid;place-items:center}
.rev{display:flex;flex-direction:column;gap:8px}
.revrow{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px}
.revrow .t{flex:1;min-width:0}.revrow .due{font:700 .72rem var(--display);letter-spacing:.06em;text-transform:uppercase}.due.now{color:var(--gold)}
.games4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.games4 button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:800;font-size:.84rem;cursor:pointer;text-align:left}
.pts{font:800 .9rem var(--display);color:var(--gold)}
/* spots / palace */
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spot{position:relative;background:var(--raise);border:1px dashed rgba(216,180,254,.35);border-radius:12px;padding:8px 10px 8px 34px;min-height:62px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s}
.spot .no{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:50%;background:rgba(192,132,252,.25);font:800 .7rem var(--display);display:grid;place-items:center}
.spot .nm{font-weight:800;font-size:.86rem;color:var(--violet-hi)}
.spot .it{font-weight:800;font-size:1rem;margin-top:2px}
.spot.full{border-style:solid}
.spot.hot{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.spot.lit{background:rgba(192,132,252,.25);border-color:#fff;box-shadow:0 0 16px rgba(192,132,252,.5)}
.spot.dark{background:#060510;border-color:#111;color:#333}.spot.dark .nm{color:#333}
.spot.ok{border-color:var(--good);box-shadow:0 0 10px rgba(62,232,168,.35)}.spot.bad{border-color:var(--bad);box-shadow:0 0 10px rgba(255,93,122,.35)}
.spot.pick{border-color:var(--gold);box-shadow:0 0 12px rgba(245,197,51,.45)}
.spot input{margin-top:4px}
.edit{display:grid;gap:6px}.edit label{display:flex;align-items:center;gap:8px}.edit label span{flex:0 0 22px;height:22px;border-radius:50%;background:rgba(192,132,252,.25);font:800 .72rem var(--display);display:grid;place-items:center}
input[type=text],textarea{width:100%;background:rgba(10,6,28,.75);border:1px solid rgba(216,180,254,.45);border-radius:9px;color:#fff;font:700 .98rem var(--body);padding:9px 11px;outline:none}
input[type=text]:focus,textarea:focus{border-color:#fff;box-shadow:0 0 10px rgba(192,132,252,.5)}
textarea{min-height:64px;resize:vertical;font-weight:600}
/* words */
.wl{display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-left:5px solid var(--gc,var(--neutral));border-radius:10px;padding:9px 10px}
.wrow .tw{font:800 1.08rem var(--display)}.wrow .mn{color:var(--muted);font-size:.86rem}.wrow .g{margin-left:auto;font-size:1.1rem}
.spk{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:.95rem}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.legend span{font:700 .74rem var(--display);padding:3px 8px;border-radius:6px;border:1px solid var(--gc);color:var(--ink);background:color-mix(in srgb,var(--gc) 22%,transparent)}
.g-m{--gc:var(--ice)}.g-f{--gc:var(--fire)}.g-n{--gc:var(--leaf)}.g-{--gc:var(--neutral)}
/* forge */
.forge .big{text-align:center;padding:10px 0}
.forge .big .tw{font:800 2rem var(--display);color:var(--gc);text-shadow:0 0 14px color-mix(in srgb,var(--gc) 60%,transparent)}
.forge .big .mn{color:var(--muted)}
.sug{background:rgba(245,197,51,.08);border:1px solid rgba(245,197,51,.35);border-radius:10px;padding:8px 10px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--violet);color:#1a0b2e;border-color:var(--violet)}
.img{border:1px solid var(--gc);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--gc) 12%,transparent);font-weight:700;margin-top:8px}
.img .to{display:block;margin-top:6px;font:800 1.1rem var(--display);color:var(--gc)}
.lab{font:800 .72rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--violet-hi);margin:10px 0 4px;display:block}
.cnt{font:700 .78rem var(--display);color:var(--muted);text-align:center}
/* tray */
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:12px;margin-bottom:10px}
.wc{touch-action:none;user-select:none;-webkit-user-select:none;background:var(--raise);border:1px solid var(--gc);border-left:5px solid var(--gc);border-radius:9px;padding:7px 10px;font:800 .92rem var(--display);cursor:grab}
.wc.sel{background:var(--gc);color:#0b0718}
.ghost-drag{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-50%)}
/* walk */
.ring{position:relative;width:88px;height:88px;margin:0 auto 8px}.ring svg{width:88px;height:88px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3}.ring .bg{stroke:rgba(255,255,255,.14)}.ring .fg{stroke:var(--violet);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 1.05rem var(--display)}
.scene{min-height:96px;text-align:center;font-weight:700;font-size:1.02rem;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--raise);margin-bottom:10px}
.scene .w{display:block;font:800 1.4rem var(--display);color:var(--gc);margin-top:4px}
/* recall */
.room{text-align:center}.room .where{font:800 1.3rem var(--display);margin:4px 0}.room .q{color:var(--muted)}
.fb{margin-top:8px;font-weight:800;min-height:1.4em;text-align:center}.fb.ok{color:var(--good)}.fb.bad{color:var(--bad)}
.fix{border:1px solid var(--gold);background:rgba(245,197,51,.08);border-radius:12px;padding:12px;margin-top:10px}
.score{text-align:center}.score .big{font:800 3rem var(--display)}.score .stars{font-size:2rem;color:var(--gold);letter-spacing:6px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}.tbl td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}.tbl td.r{text-align:right}
.house{display:grid;gap:8px}.floor{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--raise)}.floor>b{display:block;font:800 .74rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--violet-hi);margin-bottom:6px}
.floor .rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.floor .rm{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px;font-size:.78rem;min-height:52px}.floor .rm i{font-style:normal;color:var(--muted);display:block}.floor .rm em{font-style:normal;font-weight:800;font-size:.92rem}
.floor .rm.lit{border-color:#fff;background:rgba(192,132,252,.25)}
.street{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.street .hs{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.78rem}.street .hs .pg{font-size:1.6rem;display:block}.street .hs b{font:800 1rem var(--display)}.street .hs.lit{border-color:#fff;background:rgba(192,132,252,.25)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2a1f55;border:1px solid var(--violet);border-radius:12px;padding:10px 14px;font-weight:800;z-index:60;max-width:90%}
@media (max-width:420px){.spots{grid-template-columns:1fr 1fr}.floor .rooms{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

s1H:["Imagine walking in through the front door. Change any spot so it matches your real home.|Keep them in order: the route is what brings the words back later.|When you're happy, tap “Walk through it” to hear the route once.","Imagina que entras por la puerta principal. Cambia cualquier sitio para que coincida con tu casa real.|Mantén el orden: la ruta es lo que te devolverá las palabras después.|Cuando estés listo, toca «Recorrerlo» para oír la ruta una vez.","Imagine que tu entres par la porte d'entrée. Change un endroit pour qu'il corresponde à ta vraie maison.|Garde l'ordre : c'est le trajet qui te rendra les mots plus tard.|Quand tu es prêt, touche « Le parcourir » pour entendre le trajet une fois.","Stell dir vor, du kommst zur Haustür herein. Ändere eine Stelle, damit sie zu deinem echten Zuhause passt.|Behalte die Reihenfolge: Der Weg bringt dir die Wörter später zurück.|Wenn alles passt, tippe auf „Abgehen“, um den Weg einmal zu hören."],

s2Hen:["Tap 🔊 to hear a word, or “Hear all” for the whole list.|Say each one out loud after Sapi.","Toca 🔊 para oír una palabra, o «Oír todas» para la lista entera.|Repite cada una en voz alta después de Sapi.","Touche 🔊 pour entendre un mot, ou « Tout écouter » pour toute la liste.|Répète chaque mot à voix haute après Sapi.","Tippe auf 🔊, um ein Wort zu hören, oder auf „Alle hören“ für die ganze Liste.|Sprich jedes Wort nach Sapi laut nach."],

/* step 3: forge */
s3T:["Make a picture for each word","Crea una imagen para cada palabra","Fais une image pour chaque mot","Mach ein Bild für jedes Wort"],
s3W:["Find a word in your language that sounds like the new word, then make the picture crazy.","Busca una palabra en tu idioma que suene como la palabra nueva y haz que la imagen sea loca.","Trouve un mot de ta langue qui sonne comme le nouveau mot, puis rends l'image complètement folle.","Such ein Wort in deiner Sprache, das wie das neue Wort klingt, und mach das Bild verrückt."],
s3H:["Say the word out loud and listen for a sound you know.|Use Sapi's idea, or write your own: your own ideas stick best.|Pick one crazy detail. Silly, huge or smelly pictures are easier to remember.|Close your eyes for a second and really see it.","Di la palabra en voz alta y busca un sonido que conozcas.|Usa la idea de Sapi o escribe la tuya: tus propias ideas se recuerdan mejor.|Elige un detalle loco. Las imágenes absurdas, enormes o malolientes se recuerdan mejor.|Cierra los ojos un segundo y mírala de verdad.","Dis le mot à voix haute et cherche un son que tu connais.|Prends l'idée de Sapi ou écris la tienne : tes propres idées restent mieux.|Choisis un détail fou. Les images absurdes, énormes ou qui puent se retiennent mieux.|Ferme les yeux une seconde et vois-la vraiment.","Sprich das Wort laut und such nach einem Klang, den du kennst.|Nimm Sapis Idee oder schreib deine eigene: Eigene Ideen bleiben am besten hängen.|Wähl ein verrücktes Detail. Alberne, riesige oder stinkende Bilder merkt man sich leichter.|Schließ kurz die Augen und sieh es wirklich vor dir."],

/* step 4: place */
s4T:["Put the words in your palace","Pon las palabras en tu palacio","Place les mots dans ton palais","Leg die Wörter in deinen Palast"],
s4W:["Put one word on each spot of your route.","Pon una palabra en cada sitio de tu recorrido.","Place un mot sur chaque endroit de ton trajet.","Leg auf jede Stelle deines Wegs ein Wort."],
s4H:["Drag a word onto a spot, or tap a word and then tap a spot.|Tap a filled spot to take its word back.|As you drop each word, imagine its crazy picture right there.|In a hurry? “Place in order” fills the route for you.","Arrastra una palabra a un sitio, o toca una palabra y luego un sitio.|Toca un sitio ocupado para recuperar su palabra.|Al soltar cada palabra, imagina su imagen loca justo ahí.|¿Tienes prisa? «Colocar en orden» llena el recorrido por ti.","Fais glisser un mot sur un endroit, ou touche un mot puis un endroit.|Touche un endroit occupé pour reprendre son mot.|En posant chaque mot, imagine son image folle juste là.|Pressé ? « Placer dans l'ordre » remplit le trajet pour toi.","Zieh ein Wort auf eine Stelle, oder tippe erst auf ein Wort und dann auf eine Stelle.|Tippe auf eine belegte Stelle, um ihr Wort zurückzunehmen.|Stell dir beim Ablegen jedes Wortes sein verrücktes Bild genau dort vor.|Eilig? „Der Reihe nach“ füllt den Weg für dich."],
inOrder:["Place in order","Colocar en orden","Placer dans l'ordre","Der Reihe nach"],
/* step 5: walk */
s5T:["The guided walk","El paseo guiado","La visite guidée","Der geführte Rundgang"],
s5W:["Walk through your palace with Sapi and see every picture in its spot.","Recorre tu palacio con Sapi y mira cada imagen en su sitio.","Parcours ton palais avec Sapi et vois chaque image à sa place.","Geh mit Sapi durch deinen Palast und sieh jedes Bild an seiner Stelle."],
s5H:["Follow the highlighted spot and picture the scene Sapi describes.|When the walk ends, walk it again in your head until the timer runs out.|Feeling ready? Tap “I'm ready” to start remembering.","Sigue el sitio resaltado e imagina la escena que describe Sapi.|Cuando acabe el paseo, recórrelo otra vez en tu mente hasta que se acabe el tiempo.|¿Te sientes listo? Toca «Estoy listo» para empezar a recordar.","Suis l'endroit en surbrillance et imagine la scène que décrit Sapi.|Quand la visite est finie, refais-la dans ta tête jusqu'à la fin du temps.|Tu te sens prêt ? Touche « Je suis prêt » pour commencer à te souvenir.","Folg der hervorgehobenen Stelle und stell dir die Szene vor, die Sapi beschreibt.|Wenn der Rundgang vorbei ist, geh ihn im Kopf noch einmal, bis die Zeit abläuft.|Bereit? Tippe auf „Ich bin bereit“, um mit dem Erinnern zu beginnen."],

s6T:["Walk the route and remember","Recorre la ruta y recuerda","Parcours le trajet et souviens-toi","Geh den Weg und erinnere dich"],
s6W:["Go to each spot in order and write the word you left there.","Ve a cada sitio en orden y escribe la palabra que dejaste allí.","Va à chaque endroit dans l'ordre et écris le mot que tu y as laissé.","Geh der Reihe nach zu jeder Stelle und schreib das Wort, das du dort gelassen hast."],
s6H:["Picture the spot first. What crazy thing is there?|Write the word in {lang}{art}.|If you get stuck, tap “Hint” to see your picture again (it costs half a point).","Imagina primero el sitio. ¿Qué cosa loca hay allí?|Escribe la palabra en {lang}{art}.|Si te atascas, toca «Pista» para volver a ver tu imagen (cuesta medio punto).","Imagine d'abord l'endroit. Quelle chose folle s'y trouve ?|Écris le mot en {lang}{art}.|Si tu bloques, touche « Indice » pour revoir ton image (ça coûte un demi-point).","Stell dir zuerst die Stelle vor. Was Verrücktes ist dort?|Schreib das Wort auf {lang}{art}.|Wenn du nicht weiterkommst, tippe auf „Hinweis“, um dein Bild noch einmal zu sehen (kostet einen halben Punkt)."],

res3:["Amazing! Your palace is rock solid.","¡Increíble! Tu palacio es sólido como una roca.","Incroyable ! Ton palais est solide comme un roc.","Großartig! Dein Palast steht felsenfest."],res2:["Great work! A few pictures need a little more colour.","¡Buen trabajo! Algunas imágenes necesitan un poco más de color.","Beau travail ! Quelques images ont besoin d'un peu plus de couleur.","Super Arbeit! Ein paar Bilder brauchen noch etwas mehr Farbe."],

resNext:["Come back tomorrow to revisit this palace with a game. It will be marked “Due”.","Vuelve mañana para repasar este palacio con un juego. Aparecerá como «Toca hoy».","Reviens demain pour revisiter ce palais avec un jeu. Il sera marqué « À revoir ».","Komm morgen wieder, um diesen Palast mit einem Spiel zu wiederholen. Er ist dann mit „Fällig“ markiert."],

/* review games */
lightsW:["Each spot lights up for 15 seconds. Write its word before the light goes out.","Cada sitio se ilumina durante 15 segundos. Escribe su palabra antes de que se apague la luz.","Chaque endroit s'allume pendant 15 secondes. Écris son mot avant que la lumière s'éteigne.","Jede Stelle leuchtet 15 Sekunden lang. Schreib ihr Wort, bevor das Licht ausgeht."],
lightsH:["Look at the lit spot and picture what's there.|Type the word and press Enter.|If the light goes out, Sapi moves on to the next spot.","Mira el sitio iluminado e imagina lo que hay allí.|Escribe la palabra y pulsa Intro.|Si se apaga la luz, Sapi pasa al siguiente sitio.","Regarde l'endroit allumé et imagine ce qu'il y a.|Écris le mot et appuie sur Entrée.|Si la lumière s'éteint, Sapi passe à l'endroit suivant.","Schau auf die leuchtende Stelle und stell dir vor, was dort ist.|Tipp das Wort und drück Enter.|Wenn das Licht ausgeht, geht Sapi zur nächsten Stelle."],
burgW:["A burglar is coming! Study your palace for 15 seconds. Then find what he took and what he moved.","¡Viene un ladrón! Estudia tu palacio durante 15 segundos. Luego descubre qué se llevó y qué cambió de sitio.","Un cambrioleur arrive ! Observe ton palais pendant 15 secondes. Ensuite, trouve ce qu'il a pris et ce qu'il a déplacé.","Ein Einbrecher kommt! Präg dir deinen Palast 15 Sekunden lang ein. Dann finde heraus, was er genommen und was er vertauscht hat."],
burgH:["First, look at every spot and its word.|Then one spot will be empty: write the word that was stolen.|Two words will have swapped places: tap those two spots.","Primero mira cada sitio y su palabra.|Luego un sitio estará vacío: escribe la palabra robada.|Dos palabras habrán cambiado de sitio: toca esos dos sitios.","D'abord, regarde chaque endroit et son mot.|Ensuite, un endroit sera vide : écris le mot volé.|Deux mots auront changé de place : touche ces deux endroits.","Schau dir zuerst jede Stelle und ihr Wort an.|Dann ist eine Stelle leer: Schreib das gestohlene Wort.|Zwei Wörter haben die Plätze getauscht: Tippe auf diese zwei Stellen."],
burgCome:["Here he comes…","Ahí viene…","Le voilà…","Da kommt er …"],
burgQ1:["Which word was stolen from the empty spot?","¿Qué palabra robaron del sitio vacío?","Quel mot a été volé à l'endroit vide ?","Welches Wort wurde von der leeren Stelle gestohlen?"],
burgQ2:["Now tap the two spots whose words were swapped.","Ahora toca los dos sitios cuyas palabras se cambiaron.","Maintenant, touche les deux endroits dont les mots ont été échangés.","Tippe jetzt auf die zwei Stellen, deren Wörter vertauscht wurden."],
burgOk:["You caught him!","¡Lo has atrapado!","Tu l'as attrapé !","Du hast ihn erwischt!"],
revW:["Walk your route backwards, from the last spot to the first.","Recorre tu ruta al revés, del último sitio al primero.","Parcours ton trajet à l'envers, du dernier endroit au premier.","Geh deinen Weg rückwärts, von der letzten Stelle zur ersten."],
revH:["Start at the end of your route.|Write the word at each spot.|Walking backwards proves your pictures are really fixed in place.","Empieza al final de tu ruta.|Escribe la palabra de cada sitio.|Recorrerla al revés demuestra que tus imágenes están bien fijadas.","Commence à la fin de ton trajet.|Écris le mot de chaque endroit.|Le faire à l'envers prouve que tes images sont bien ancrées.","Fang am Ende deines Wegs an.|Schreib das Wort jeder Stelle.|Rückwärts zu gehen zeigt, dass deine Bilder wirklich fest verankert sind."],
sapiW:["Sapi asks about 5 random spots. Answer each one.","Sapi pregunta por 5 sitios al azar. Responde a cada uno.","Sapi pose des questions sur 5 endroits au hasard. Réponds à chacune.","Sapi fragt nach 5 zufälligen Stellen. Beantworte jede Frage."],
sapiH:["Read Sapi's question.|Jump straight to that spot in your mind.|Write the word you left there.","Lee la pregunta de Sapi.|Salta directamente a ese sitio en tu mente.|Escribe la palabra que dejaste allí.","Lis la question de Sapi.|Va directement à cet endroit dans ta tête.|Écris le mot que tu y as laissé.","Lies Sapis Frage.|Spring in Gedanken direkt zu dieser Stelle.|Schreib das Wort, das du dort gelassen hast."],

/* conjugation house */
cjT:["Choose a verb","Elige un verbo","Choisis un verbe","Wähl ein Verb"],
cjW:["Pick one of the five key verbs. You'll store all its forms in the Conjugation House.","Elige uno de los cinco verbos clave. Guardarás todas sus formas en la Casa de las conjugaciones.","Choisis un des cinq verbes clés. Tu vas ranger toutes ses formes dans la Maison des conjugaisons.","Wähl eines der fünf wichtigsten Verben. Du legst alle seine Formen im Konjugationshaus ab."],
cjH:["The house has three floors: the dusty basement is the past, the living room is the present, and the attic with a telescope is the future.|Each floor has the same six rooms, and each room belongs to a person who lives there.|Tap a verb to begin.","La casa tiene tres plantas: el sótano polvoriento es el pasado, el salón es el presente y el desván con un telescopio es el futuro.|Cada planta tiene las mismas seis habitaciones, y cada una es de una persona que vive allí.|Toca un verbo para empezar.","La maison a trois étages : la cave poussiéreuse, c'est le passé, le salon, le présent, et le grenier avec un télescope, le futur.|Chaque étage a les six mêmes pièces, et chaque pièce appartient à une personne qui y vit.|Touche un verbe pour commencer.","Das Haus hat drei Stockwerke: Der staubige Keller ist die Vergangenheit, das Wohnzimmer die Gegenwart und der Dachboden mit Teleskop die Zukunft.|Jedes Stockwerk hat dieselben sechs Zimmer, und jedes gehört einer Person, die dort wohnt.|Tippe auf ein Verb, um anzufangen."],

cjMeetW:["Here is the whole house. Each person lives in the same room on every floor.","Esta es toda la casa. Cada persona vive en la misma habitación en todas las plantas.","Voici toute la maison. Chaque personne vit dans la même pièce à chaque étage.","Das ist das ganze Haus. Jede Person wohnt auf jedem Stockwerk im selben Zimmer."],
cjMeetH:["Read each floor from left to right and listen to the forms.|Notice how the person stays the same while the floor (the time) changes.|Then go on to the guided walk.","Lee cada planta de izquierda a derecha y escucha las formas.|Fíjate en que la persona no cambia mientras cambia la planta (el tiempo).|Luego pasa al paseo guiado.","Lis chaque étage de gauche à droite et écoute les formes.|Remarque que la personne reste la même alors que l'étage (le temps) change.|Ensuite, passe à la visite guidée.","Lies jedes Stockwerk von links nach rechts und hör dir die Formen an.|Achte darauf, dass die Person gleich bleibt, während sich das Stockwerk (die Zeit) ändert.|Dann geht es zum geführten Rundgang."],

cjRecH:["Picture the floor and the person in the room.|Write the verb form only, without the pronoun.|For the past and future, write every word of the form.","Imagina la planta y a la persona en la habitación.|Escribe solo la forma verbal, sin el pronombre.|En pasado y futuro, escribe todas las palabras de la forma.","Imagine l'étage et la personne dans la pièce.|Écris seulement la forme du verbe, sans le pronom.|Au passé et au futur, écris tous les mots de la forme.","Stell dir das Stockwerk und die Person im Zimmer vor.|Schreib nur die Verbform, ohne Pronomen.|In Vergangenheit und Zukunft schreib alle Wörter der Form."],
/* number street */
nsW:["Each house on Number Street has a picture shaped like its number. Link the number word to that picture.","Cada casa de la calle de los números tiene una imagen con la forma de su número. Une la palabra del número a esa imagen.","Chaque maison de la rue des nombres a une image en forme de son chiffre. Relie le mot du nombre à cette image.","Jedes Haus in der Zahlenstraße hat ein Bild in der Form seiner Zahl. Verbinde das Zahlwort mit diesem Bild."],
nsH:["0 is an egg, 1 a candle, 2 a swan… the shape looks like the number.|Listen to each number word and say it out loud.|Then imagine the picture doing something crazy with a sound-alike word.","0 es un huevo, 1 una vela, 2 un cisne… la forma se parece al número.|Escucha cada número y dilo en voz alta.|Luego imagina la imagen haciendo algo loco con una palabra que suene parecido.","0 est un œuf, 1 une bougie, 2 un cygne… la forme ressemble au chiffre.|Écoute chaque nombre et dis-le à voix haute.|Ensuite, imagine l'image en train de faire quelque chose de fou avec un mot qui sonne pareil.","0 ist ein Ei, 1 eine Kerze, 2 ein Schwan … die Form sieht aus wie die Zahl.|Hör dir jedes Zahlwort an und sprich es laut.|Stell dir dann das Bild bei etwas Verrücktem vor, mit einem ähnlich klingenden Wort."],

nsRecH:["Look at the picture on the house.|Write the number as a word in {lang}.|Spaces and hyphens don't matter.","Mira la imagen de la casa.|Escribe el número con letras en {lang}.|Los espacios y guiones no importan.","Regarde l'image sur la maison.|Écris le nombre en lettres en {lang}.|Les espaces et les traits d'union ne comptent pas.","Schau dir das Bild am Haus an.|Schreib die Zahl als Wort auf {lang}.|Leerzeichen und Bindestriche sind egal."],

function numStart(){const N=DATA.nums[LANG],PG=STR.pegs[UIi];ST.p.num=ST.p.num||{};const P=ST.p.num;P.keys=P.keys||[];P.weird=P.weird||[];save();
  const streetHTML=(lit,show)=>`<div class="street">${N.map((w,n)=>`<div class="hs${lit===n?" lit":""}"><span class="pg">${PEG[n]}</span><b>${n}</b>${show?`<div lang="${LANG}">${esc(w)}</div>`:""}</div>`).join("")}</div>`;
  const numPic=n=>{const k=P.keys[n]||soundStart(N[n])+"…",x=WEIRD[P.weird[n]||0][UIi];return PIC[UIi].replace("{t}",PG[n]).replace("{x}",x).replace("{c}",GCOL[""][UIi]).replace("{k}",k)};
  const G=guide({step:t("stepN",{n:1,m:3}),title:t("b_num"),what:t("nsW"),how:t("nsH")});
  const rows=N.map((w,n)=>`<div class="card forge g-" style="margin-bottom:8px"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:2rem">${PEG[n]}</span><div style="flex:1"><b style="font:800 1.2rem var(--display)">${n} · <span lang="${LANG}">${esc(w)}</span></b><div class="muted">${esc(PG[n])}</div></div><button class="spk" data-n="${n}">🔊</button></div>
    <input type="text" data-k="${n}" maxlength="40" placeholder="${esc(t("ownPh"))}" value="${esc(P.keys[n]||"")}" style="margin-top:6px"><div class="chips">${WEIRD.slice(0,5).map((x,j)=>`<button class="chip${(P.weird[n]||0)===j?" on":""}" data-n="${n}" data-w="${j}">${esc(x[UIi])}</button>`).join("")}</div><div class="img" id="ni${n}"></div></div>`).join("");
  screen(topbar(t("b_num"),town)+bar(1,3)+G.h+rows+`<div class="acts"><button class="btn" id="nx">${esc(t("next"))}</button></div>`,town);G.bind();
  const up=n=>{$("#ni"+n).innerHTML=`${esc(numPic(n))}<span class="to" lang="${LANG}">→ ${n} · ${esc(N[n])}</span>`};N.forEach((_,n)=>up(n));
  $("#app").querySelectorAll(".spk").forEach(b=>b.onclick=()=>talk([[N[+b.dataset.n],LANG]],null,true));
  $("#app").querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{P.keys[+i.dataset.k]=i.value.trim();save();up(+i.dataset.k)});
  $("#app").querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;P.weird[n]=+b.dataset.w;save();$("#app").querySelectorAll(`[data-w][data-n="${n}"]`).forEach(x=>x.classList.toggle("on",x===b));up(n);talk([[numPic(n)],[N[n],LANG]],null)});
  $("#nx").onclick=walkN;
  function walkN(){const G=guide({step:t("stepN",{n:2,m:3}),title:t("s5T"),what:t("s5W"),how:t("s5H")});
    screen(topbar(t("b_num"),numStart)+bar(2,3)+G.h+`<div class="ring" id="rg"></div><div class="scene g-" id="scn"></div><div id="st">${streetHTML(null,true)}</div><div class="acts"><button class="btn ghost" id="again">${esc(t("walkAgain"))}</button><button class="btn" id="nx">${esc(t("ready"))}</button></div>`,numStart);
    ring($("#rg"),window.__mpMs||240000,recallN);
    const walk=n=>{if(n>10)return;$("#st").innerHTML=streetHTML(n,true);$("#scn").innerHTML=`${esc(t("house"))} ${n}: ${esc(numPic(n))}<span class="w" lang="${LANG}">${esc(N[n])}</span>`;
      talk([[t("house")+" "+n],[numPic(n)],[N[n],LANG]],()=>later(()=>walk(n+1),voiceOn()?200:3000))};
    G.bind(()=>walk(0));$("#again").onclick=()=>walk(0);$("#nx").onclick=recallN}
  function recallN(){const G=guide({step:t("stepN",{n:3,m:3}),title:t("s6T"),what:t("s6W"),how:t("nsRecH",{lang:lname(LANG)})});
    const order=[...Array(11).keys()].sort(()=>Math.random()-.5);let n=0,sc=0;
    screen(topbar(t("b_num"))+bar(3,3)+G.h+`<div class="card room" id="room"></div><div id="st"></div>`);G.bind(()=>{const f=$("#ans");if(f)f.focus()});
    const show=()=>{if(n>=11){const st=sc>=11?3:sc>=9?2:sc>=6?1:0;P.best=Math.max(P.best||0,st);ST.pts+=sc;save();
        screen(topbar(t("b_num"))+`<div class="card score"><div class="big">${sc}/11</div><div class="stars">${stars(st)}</div><p>${esc(t("resW",{s:sc,m:11}))}</p></div><div class="card">${streetHTML(null,true)}</div><div class="acts"><button class="btn ghost" id="ag">${esc(t("playAgain"))}</button><button class="btn gold" id="tw">${esc(t("toTown"))}</button></div>`);
        talk([[t("resW",{s:sc,m:11})]],null);$("#ag").onclick=numStart;$("#tw").onclick=town;return}
      const k=order[n];$("#st").innerHTML=streetHTML(k,false).replace(`<b>${k}</b>`,"<b>?</b>");
      const q=t("nsQ",{n:n+1,p:STR.pegs[UIi][k]});
      $("#room").innerHTML=`<div class="cnt">${n+1} / 11</div><div style="font-size:3rem">${PEG[k]}</div><div class="where">${esc(q)}</div><input type="text" id="ans" lang="${LANG}" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:8px"><div class="acts"><button class="btn" id="chk">${esc(t("check"))}</button></div><div class="fb" id="fb"></div>`;
      const inp=$("#ans");if(n>0)inp.focus();
      const go=()=>{const v=nrm(inp.value).replace(/\s/g,""),ok=v===nrm(N[k]).replace(/\s/g,"")||(LANG==="de"&&k===1&&v==="ein")||(LANG==="fr"&&k===1&&v==="une");if(ok)sc++;inp.disabled=true;$("#chk").disabled=true;$("#fb").className="fb "+(ok?"ok":"bad");$("#fb").textContent=(ok?t("right"):t("itWas",{a:N[k]}))+" · "+k;
        talk([[N[k],LANG]],null);setTimeout(()=>{n++;show()},ok?900:1900)};
      $("#chk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(inp.value.trim())go()}}};
    show()}}
town();
</script>
</body>
</html>
