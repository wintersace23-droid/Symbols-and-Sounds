<html lang="en">

<title>Sapi's Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Sora:wght@600;800&display=swap">
<style>
:root{--sky:#0b0a1f;--panel:#17143a;--raise:#211c4d;--line:rgba(216,180,254,.22);--ink:#f5f0ff;--muted:#a99cc9;--violet:#c084fc;--gold:#f5c533;--good:#3ee8a8;--bad:#ff5d7a;
  --display:"Sora",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#1d1545,var(--sky) 65%) fixed,var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;font-weight:600;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font:800 1.2rem var(--display);margin:0}
.icon{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:800;font-size:.85rem}
/* Sapi's instruction strip */
.tip{display:flex;gap:10px;align-items:center;background:linear-gradient(160deg,rgba(192,132,252,.2),rgba(192,132,252,.06));border:1px solid rgba(216,180,254,.4);border-radius:14px;padding:10px 12px;margin-bottom:12px;min-height:72px}
.tip .bot{flex:0 0 44px;height:52px}.tip .bot svg{width:44px;height:52px}
.tip .st{font:800 .66rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
.tip .tx{font-weight:700;font-size:.98rem}
.tip.talk .bot svg{animation:bob .45s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}
/* the room */
.room{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.room svg{display:block;width:100%;height:auto}
.room .hot{cursor:pointer}
.room .hot .ring{fill:none;stroke:transparent;stroke-width:4}
.room .hot.glow .ring{stroke:#fde68a;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{stroke:#fff;stroke-width:7}}
.room .hot.glow{filter:drop-shadow(0 0 8px rgba(253,230,138,.9))}
.stk{position:absolute;transform:translate(-50%,-50%) scale(0);display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.stk.on{transform:translate(-50%,-50%) scale(1)}
.stk .e{font-size:2.1rem;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.stk .l{margin-top:2px;background:rgba(11,10,31,.82);border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:1px 6px;font:800 .72rem var(--display);white-space:nowrap}
.dark{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s,background .5s}
.room.lights .dark{opacity:1}
.room.lights .stk{opacity:0}.room.lights .stk.shown{opacity:1}
/* word card */
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;text-align:center}
.wcard .e{font-size:2.6rem;line-height:1}
.wcard .w{font:800 1.7rem var(--display);margin-top:4px}
.wcard .m{color:var(--muted)}
.wcard .line{margin-top:8px;padding:10px;border-radius:10px;background:rgba(245,197,51,.09);border:1px solid rgba(245,197,51,.35);font-weight:700}
.wcard .line b{color:var(--gold)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}.dots i.done{background:var(--good)}.dots i.now{background:var(--violet)}
.g-m{color:#7dd3fc}.g-f{color:#fda4af}.g-n{color:#86efac}
/* answers */
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:10px;background:var(--raise);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:800 1.15rem var(--display);cursor:pointer;text-align:left}
.opt .e{font-size:1.5rem}
.opt.ok{border-color:var(--good);background:rgba(62,232,168,.14)}.opt.no{border-color:var(--bad);background:rgba(255,93,122,.14);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{text-align:center;font:800 1.15rem var(--display);margin-top:12px}
.streak{text-align:center;color:var(--gold);font:800 .9rem var(--display);min-height:1.3em;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:14px 20px;font:800 1.05rem var(--display);cursor:pointer;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#221500}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
/* start screen */
.how{display:grid;gap:8px;margin:12px 0}
.how div{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.how .n{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:rgba(192,132,252,.22)}
.how b{display:block;font:800 .95rem var(--display)}.how span{color:var(--muted);font-size:.9rem}
.rounds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.rd{background:var(--raise);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.rd.on{border-color:var(--violet);background:rgba(192,132,252,.18)}
.rd b{display:block;font:800 1rem var(--display)}.rd small{color:var(--gold);letter-spacing:1px}
.rd .es{font-size:.95rem;letter-spacing:1px}
.lab{font:800 .72rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--violet);margin-top:14px}
.score{text-align:center;margin-top:12px}.score .big{font:800 2.8rem var(--display)}.score .stars{font-size:2rem;color:var(--gold);letter-spacing:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

scene0:["Picture a giant {m} {s}!","¡Imagina {m} gigante {s}!","Imagine {m} énorme {s} !","Stell dir vor: {m} riesengroß {s}!"],
};
/* the five spots: name (for "the …"), "on the …" phrase, and where they are in the room (% of width / height) */
const SPOTS=[
 {id:"door",x:11,y:47,n:["door","la puerta","la porte","die Tür"],at:["at the door","en la puerta","à la porte","an der Tür"],q:["door","la puerta","la porte","der Tür"]},
 {id:"lamp",x:22,y:27,n:["lamp","la lámpara","la lampe","die Lampe"],at:["under the lamp","bajo la lámpara","sous la lampe","unter der Lampe"],q:["lamp","la lámpara","la lampe","der Lampe"]},
 {id:"sofa",x:42,y:58,n:["sofa","el sofá","le canapé","das Sofa"],at:["on the sofa","en el sofá","sur le canapé","auf dem Sofa"],q:["sofa","el sofá","le canapé","dem Sofa"]},
 {id:"bed",x:69,y:66,n:["bed","la cama","le lit","das Bett"],at:["on the bed","en la cama","sur le lit","auf dem Bett"],q:["bed","la cama","le lit","dem Bett"]},
 {id:"fridge",x:90,y:45,n:["fridge","la nevera","le frigo","der Kühlschrank"],at:["in the fridge","en la nevera","dans le frigo","im Kühlschrank"],q:["fridge","la nevera","le frigo","dem Kühlschrank"]}];
const t=(k,v)=>{let s=(STR[k]||[k])[UIi]||STR[k][0];if(v)s=s.replace(/\{(\w+)\}/g,(_,x)=>v[x]!=null?v[x]:"");return s};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* saved in this browser: best stars per round, voice setting */
const SK="sr-v1-"+LANG;let ST=(()=>{try{return JSON.parse(localStorage.getItem(SK)||"null")||{}}catch(e){return {}}})();ST.best=ST.best||{};
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}};
const voiceOn=()=>ST.voice!==false;
/* ---------- voice ---------- */
let tok=0;
const pickV=tag=>{try{const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase()===tag.toLowerCase())||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(tag.slice(0,2)))}catch(e){return null}};
const hush=()=>{tok++;try{speechSynthesis.cancel()}catch(e){}const g=$(".tip");if(g)g.classList.remove("talk")};
function talk(parts,then){hush();const my=tok,g=$(".tip");if(!voiceOn()||!window.speechSynthesis){if(then)setTimeout(then,700);return}
  if(g)g.classList.add("talk");let i=0;
  const go=()=>{if(my!==tok)return;if(i>=parts.length){if(g)g.classList.remove("talk");return then&&then()}const [x,l]=parts[i++];if(!x)return go();
    const u=new SpeechSynthesisUtterance(x);u.lang=TTS[l||UI];const v=pickV(u.lang);if(v)u.voice=v;u.rate=l&&l!==UI?.9:1;let d=false;const f=()=>{if(d)return;d=true;setTimeout(go,150)};u.onend=f;u.onerror=f;setTimeout(f,Math.max(2200,x.length*110));
    try{speechSynthesis.speak(u)}catch(e){f()}};go()}
try{speechSynthesis.getVoices()}catch(e){}
/* ---------- little sounds ---------- */
let AC=null;const beep=(f,ms,type="sine",v=.07)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+ms/1000);o.stop(AC.currentTime+ms/1000)}catch(e){}};
const sfx={pop:()=>{beep(520,120);setTimeout(()=>beep(780,140),90)},ok:()=>{beep(660,120);setTimeout(()=>beep(990,180),110)},no:()=>beep(180,260,"square",.05),off:()=>beep(140,400,"sawtooth",.04)};
/* ---------- Sapi ---------- */
const SAPI=(()=>{try{if(parent&&parent!==window&&parent.SAPI_SVG)return parent.SAPI_SVG("sr")}catch(e){}
  return `<svg viewBox="0 0 120 140" aria-hidden="true"><ellipse cx="60" cy="132" rx="22" ry="5" fill="#38bdf8" opacity=".5"/><rect x="38" y="52" width="44" height="62" rx="22" fill="#f1f5f9"/><rect x="34" y="14" width="52" height="36" rx="18" fill="#f8fafc"/><rect x="40" y="22" width="40" height="20" rx="10" fill="#1e1b4b"/><rect x="47" y="29" width="9" height="5" rx="2.5" fill="#c084fc"/><rect x="64" y="29" width="9" height="5" rx="2.5" fill="#c084fc"/><rect x="55" y="74" width="10" height="20" rx="5" fill="none" stroke="#a855f7" stroke-width="3"/><circle cx="60" cy="4" r="3" fill="#c084fc"/><line x1="60" y1="7" x2="60" y2="14" stroke="#cbd5e1" stroke-width="2"/><rect x="24" y="64" width="8" height="30" rx="4" fill="#e2e8f0"/><rect x="88" y="64" width="8" height="30" rx="4" fill="#e2e8f0"/></svg>`})();
const tip=(st,tx)=>`<div class="tip" id="tip"><div class="bot">${SAPI}</div><div><div class="st" id="tipS">${esc(st)}</div><div class="tx" id="tipT">${esc(tx)}</div></div></div>`;
const setTip=(st,tx)=>{$("#tipS").textContent=st;$("#tipT").textContent=tx};
function topBar(back){return `<div class="top"><h1>🛋️ ${esc(t("title"))}</h1><div style="display:flex;gap:6px"><button class="icon" id="vB">${esc(voiceOn()?t("voiceOn"):t("voiceOff"))}</button>${back?`<button class="icon" id="bB">${esc(t("back"))}</button>`:""}</div></div>`}
function bindTop(back){$("#vB").onclick=()=>{ST.voice=!voiceOn();save();if(!voiceOn())hush();$("#vB").textContent=voiceOn()?t("voiceOn"):t("voiceOff")};if(back)$("#bB").onclick=()=>{hush();start()}}
/* ---------- the room picture: door, lamp, sofa, bed, fridge ---------- */
const ROOM=`<svg viewBox="0 0 400 300" role="img" aria-label="${esc(t("title"))}">
 <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f7a"/><stop offset="1" stop-color="#2a2160"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a2f"/><stop offset="1" stop-color="#4a3220"/></linearGradient></defs>
 <rect width="400" height="214" fill="url(#wall)"/><rect y="214" width="400" height="86" fill="url(#floor)"/>
 <g opacity=".18" stroke="#000">${[240,262,284].map(y=>`<line x1="0" y1="${y}" x2="400" y2="${y}"/>`).join("")}</g>
 <rect x="150" y="34" width="70" height="52" rx="4" fill="#1e3a8a" stroke="#c7d2fe" stroke-width="4"/><circle cx="200" cy="52" r="9" fill="#fde68a"/><line x1="185" y1="34" x2="185" y2="86" stroke="#c7d2fe" stroke-width="3"/>
 <g class="hot" data-s="0"><rect class="ring" x="12" y="70" width="66" height="146" rx="6"/><rect x="16" y="74" width="58" height="140" rx="4" fill="#8b5a2b"/><rect x="24" y="84" width="42" height="52" rx="3" fill="#a06a36"/><rect x="24" y="146" width="42" height="56" rx="3" fill="#a06a36"/><circle cx="64" cy="146" r="4" fill="#fde68a"/></g>
 <g class="hot" data-s="1"><rect class="ring" x="66" y="52" width="46" height="164" rx="8"/><path d="M72 58 h34 l-8 32 h-18z" fill="#fbbf24"/><rect x="87" y="90" width="4" height="112" fill="#d1d5db"/><ellipse cx="89" cy="206" rx="14" ry="5" fill="#9ca3af"/><ellipse cx="89" cy="92" rx="22" ry="8" fill="#fde68a" opacity=".25"/></g>
 <g class="hot" data-s="2"><rect class="ring" x="116" y="136" width="120" height="86" rx="10"/><rect x="122" y="146" width="108" height="40" rx="10" fill="#be185d"/><rect x="120" y="178" width="112" height="30" rx="8" fill="#db2777"/><rect x="114" y="168" width="16" height="42" rx="7" fill="#9d174d"/><rect x="222" y="168" width="16" height="42" rx="7" fill="#9d174d"/><rect x="128" y="208" width="6" height="8" fill="#4b5563"/><rect x="218" y="208" width="6" height="8" fill="#4b5563"/></g>
 <g class="hot" data-s="3"><rect class="ring" x="240" y="150" width="90" height="94" rx="8"/><rect x="244" y="156" width="10" height="82" rx="3" fill="#7c4a24"/><rect x="250" y="196" width="76" height="30" rx="6" fill="#f8fafc"/><rect x="256" y="186" width="24" height="14" rx="6" fill="#e0e7ff"/><rect x="276" y="190" width="50" height="32" rx="6" fill="#60a5fa"/><rect x="250" y="226" width="6" height="14" fill="#7c4a24"/><rect x="320" y="226" width="6" height="14" fill="#7c4a24"/></g>
 <g class="hot" data-s="4"><rect class="ring" x="332" y="58" width="64" height="162" rx="8"/><rect x="336" y="62" width="56" height="154" rx="8" fill="#e5e7eb"/><line x1="336" y1="120" x2="392" y2="120" stroke="#9ca3af" stroke-width="3"/><rect x="342" y="80" width="5" height="26" rx="2" fill="#6b7280"/><rect x="342" y="132" width="5" height="34" rx="2" fill="#6b7280"/></g>
</svg>`;
function roomHTML(){return `<div class="room" id="room">${ROOM}${SPOTS.map((s,i)=>`<div class="stk" id="st${i}" style="left:${s.x}%;top:${s.y}%"><span class="e"></span><span class="l"></span></div>`).join("")}<div class="dark" id="dark"></div></div>`}
/* ---------- texts for one word ---------- */
const W=(r,i)=>DATA.rounds[r][i];
const kw=w=>HL?w.k[LANG][HL]:null;
const mUI=w=>UI==="en"?w.w.en.w:w.w[UI].a;   // the meaning in the app language, with its article
const lineOf=(w,spot)=>{const k=kw(w),s=SPOTS[spot].at[UIi];
  return k?{a:t("sl",{w:w.w[LANG].a,k}),b:t("scene",{k,m:mUI(w),s})}:{a:"",b:t("scene0",{m:mUI(w),s})}};
const sayLine=(w,spot,then)=>{const L=lineOf(w,spot),k=kw(w);
  talk([[w.w[LANG].a,LANG],...(k?[[t("slP")],[k,HL]]:[]),[L.b]],then)};
/* ---------- start screen ---------- */
let SEL=0;
function start(){hush();
  $("#app").innerHTML=topBar()+tip(t("howT"),t("welcome"))+`<div class="how">${[["👀","h1","h1d"],["👆","h2","h2d"],["🔦","h3","h3d"]].map(([e,a,b])=>`<div><span class="n">${e}</span><span><b>${esc(t(a))}</b><span>${esc(t(b))}</span></span></div>`).join("")}</div>
    <div class="lab">${esc(t("pickR"))}</div><div class="rounds">${DATA.rounds.map((r,i)=>`<button class="rd${i===SEL?" on":""}" data-r="${i}"><b>${esc(t("round",{n:i+1}))}</b><div class="es">${r.map(w=>w.e).join("")}</div><small>${"★".repeat(ST.best[i]||0)}${"☆".repeat(3-(ST.best[i]||0))}</small></button>`).join("")}</div>
    <div class="acts"><button class="btn gold" id="go">${esc(t("play"))}</button></div>`;
  bindTop();
  $("#app").querySelectorAll(".rd").forEach(b=>b.onclick=()=>{SEL=+b.dataset.r;$("#app").querySelectorAll(".rd").forEach(x=>x.classList.toggle("on",x===b))});
  $("#go").onclick=()=>play(SEL);
  talk([[t("welcome")],[t("h1")+". "+t("h1d")],[t("h2")+". "+t("h2d")],[t("h3")+". "+t("h3d")]])}
/* ---------- one round ---------- */
function play(r){hush();const words=[0,1,2,3,4],spots=shuffle([0,1,2,3,4]);   // word i goes on spot spots[i]
  $("#app").innerHTML=topBar(true)+tip(t("st1"),t("t1"))+roomHTML()+`<div id="below"></div>`;bindTop(true);
  const below=$("#below");let i=0;
  const dots=()=>`<div class="dots">${words.map(k=>`<i class="${k<i?"done":k===i?"now":""}"></i>`).join("")}</div>`;
  const stick=(k)=>{const w=W(r,k),el=$("#st"+spots[k]);el.querySelector(".e").textContent=w.e;el.querySelector(".l").textContent=w.w[LANG].a;el.classList.add("on")};
  /* steps 1 and 2: show the word, Sapi says the line, then the spot glows and the learner taps it */
  const showWord=()=>{if(i>=5)return readyForDark();const w=W(r,i),sp=spots[i],L=lineOf(w,sp),g=w.w[LANG].g;
    setTip(t("st1"),t("t1"));
    below.innerHTML=`<div class="wcard"><div class="e">${w.e}</div><div class="w g-${g}" lang="${LANG}">${esc(w.w[LANG].a)}</div><div class="m">= ${esc(mUI(w))}</div><div class="line">${L.a?esc(L.a)+"<br>":""}<b>${esc(L.b)}</b></div>
      <div class="acts"><button class="btn ghost" id="ag">${esc(t("again"))}</button></div>${dots()}</div>`;
    let armed=false;
    const arm=()=>{if(armed)return;armed=true;setTip(t("st2"),t("t2",{s:SPOTS[sp].n[UIi]}));document.querySelector(`.hot[data-s="${sp}"]`).classList.add("glow");talk([[t("t2",{s:SPOTS[sp].n[UIi]})]])};
    $("#ag").onclick=()=>sayLine(w,sp,arm);
    sayLine(w,sp,arm);
    document.querySelectorAll(".hot").forEach(h=>h.onclick=()=>{const s=+h.dataset.s;
      if(s!==sp){if(armed){sfx.no();setTip(t("st2"),t("t2b"))}return}
      if(!armed)arm();hush();h.classList.remove("glow");stick(i);sfx.pop();document.querySelectorAll(".hot").forEach(x=>x.onclick=null);
      talk([[w.w[LANG].a,LANG],[SPOTS[sp].at[UIi]]]);i++;setTimeout(showWord,1100)})};
  /* all five are in the room */
  const readyForDark=()=>{setTip(t("st3"),t("ready"));below.innerHTML=`<div class="acts"><button class="btn gold" id="off">${esc(t("off"))}</button></div>${dots()}`;talk([[t("ready")]]);
    $("#off").onclick=lightsOut};
  /* step 3: dark room, a torch on one spot, pick the word from 3 */
  const lightsOut=()=>{hush();sfx.off();const room=$("#room");room.classList.add("lights");const order=shuffle(words);let n=0,right=0,str=0;
    const ask=()=>{if(n>=5)return done(right);const k=order[n],sp=spots[k],S=SPOTS[sp];
      $("#dark").style.background=`radial-gradient(circle at ${S.x}% ${S.y}%, rgba(255,240,180,.08) 0 38px, rgba(3,2,12,.94) 70px)`;
      const opts=shuffle([k,...shuffle(words.filter(x=>x!==k)).slice(0,2)]);
      setTip(t("st3"),t("t3",{s:S.n[UIi]}));
      below.innerHTML=`<div class="q">🔦 ${esc(t("q",{s:S.at[UIi]}))}</div><div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}"><span class="e">❓</span><span lang="${LANG}">${esc(W(r,o).w[LANG].a)}</span></button>`).join("")}</div><div class="streak" id="sk">${str>1?esc(t("streak",{n:str})):""}</div>`;
      talk([[t("q",{s:S.at[UIi]})]]);
      let over=false;
      below.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(over)return;over=true;const o=+b.dataset.o,ok=o===k;
        $("#st"+sp).classList.add("shown");
        if(ok){right++;str++;b.classList.add("ok");b.querySelector(".e").textContent=W(r,k).e;sfx.ok();$("#sk").textContent=str>1?t("streak",{n:str}):t("yes");talk([[t("yes").replace("✨","")],[W(r,k).w[LANG].a,LANG]]);setTimeout(()=>{n++;ask()},1300)}
        else{str=0;b.classList.add("no");const c=below.querySelector(`.opt[data-o="${k}"]`);c.classList.add("ok");c.querySelector(".e").textContent=W(r,k).e;sfx.no();$("#sk").textContent=t("no",{w:W(r,k).w[LANG].a});
          sayLine(W(r,k),sp,()=>setTimeout(()=>{n++;ask()},500))}})};
    ask()};
  const done=right=>{const room=$("#room");room.classList.remove("lights");$("#dark").style.background="";document.querySelectorAll(".stk").forEach(s=>s.classList.add("shown"));
    const st=right>=5?3:right>=4?2:right>=3?1:0;ST.best[r]=Math.max(ST.best[r]||0,st);save();
    const msg=st===3?t("r3"):st===2?t("r2"):t("r1");setTip(t("resT"),msg);
    below.innerHTML=`<div class="score"><div class="big">${right}/5</div><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><p>${esc(t("res",{s:right}))}</p></div>
      <div class="acts"><button class="btn ghost" id="rp">${esc(t("replay"))}</button>${r<DATA.rounds.length-1?`<button class="btn gold" id="nx">${esc(t("nextR"))}</button>`:""}<button class="btn ghost" id="al">${esc(t("all"))}</button></div>`;
    sfx.ok();talk([[t("res",{s:right})],[msg]]);
    $("#rp").onclick=()=>play(r);if($("#nx"))$("#nx").onclick=()=>{SEL=r+1;play(r+1)};$("#al").onclick=start};
  showWord()}
start();
</script>
</body>
