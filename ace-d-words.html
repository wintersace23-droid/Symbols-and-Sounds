<style>
/* Layout: one rounded night-sky panel; start screen = hero art, segmented settings, gold CTA. Game = rounded playfield + word bar */
:root{
  --sky:#081330; --night:#0c1a3a; --panel:#0f2149; --raise:#16295a; --line:rgba(201,211,230,.14);
  --bezel:#c9d3e6; --gold:#f5c533; --gold-hi:#ffe27a; --ember:#d9822b;
  --ink:#eef2fb; --muted:#93a3c7; --good:#5fd38d; --bad:#ff6b6b;
  --t1:#5fd38d; --t2:#58b4ff; --t3:#d58bff;
  --display:"Archivo Black","Arial Black",Arial,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{color:var(--ink);font-family:var(--body);font-size:15px;font-weight:500;
  background:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,226,122,.5),transparent 60%),radial-gradient(1px 1px at 78% 32%,rgba(255,255,255,.45),transparent 60%),
  radial-gradient(1.5px 1.5px at 40% 72%,rgba(255,226,122,.35),transparent 60%),radial-gradient(1px 1px at 88% 82%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(120% 80% at 50% 0%,#132a63 0%,var(--sky) 60%) fixed,var(--sky);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));}
.cab{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:10px;box-sizing:border-box}
.frame{flex:1;min-height:0;border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(22,41,90,.92),rgba(12,26,58,.96));box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  padding:20px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}

/* start screen */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.hero canvas{width:220px;height:110px;max-width:100%}
h1{font-family:var(--display);font-weight:400;margin:0;font-size:2.4rem;line-height:1;text-align:center;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35)) drop-shadow(0 0 18px rgba(245,197,51,.25));text-wrap:balance}
.tag{color:var(--muted);text-align:center;margin:0;line-height:1.55;font-size:.93rem;max-width:34ch}
.sub{color:var(--muted);text-align:center;margin:0;line-height:1.5}
.note{font-size:.8rem;color:var(--muted);margin:8px 2px 0;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:8px}
label{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block}
.seg{display:flex;gap:4px;padding:4px;background:rgba(8,19,48,.7);border:1px solid var(--line);border-radius:14px}
.seg .chip{flex:1}
.chip{font-family:var(--body);font-weight:700;font-size:.95rem;background:transparent;color:var(--ink);border:0;border-radius:10px;padding:10px 8px;cursor:pointer;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1a02;box-shadow:0 2px 10px rgba(245,197,51,.3)}
.tiles6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile6{font-family:var(--body);text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;color:var(--ink);cursor:pointer;min-width:0;transition:border-color .15s,transform .15s}
.tile6 b{display:block;font-size:.98rem;font-weight:800}
.tile6 small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px;font-variant-numeric:tabular-nums}
.tile6[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,197,51,.2),rgba(245,197,51,.06));box-shadow:inset 0 0 0 1px var(--gold)}
.tile6[aria-pressed="true"] b{color:var(--gold-hi)}
.chip:focus-visible,.btn:focus-visible,.tile6:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
input[type=text]{width:100%;box-sizing:border-box;background:rgba(8,19,48,.7);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--body);font-weight:600;font-size:1rem;padding:11px 12px}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.legend span{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(8,19,48,.7);border:1px solid var(--line);color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.btn{font-family:var(--display);font-weight:400;font-size:1.15rem;letter-spacing:.08em;border:0;border-radius:16px;padding:16px 8px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#e9a92a);color:#2a1a02;box-shadow:0 5px 0 #b8661c,0 10px 28px rgba(245,197,51,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8661c,0 6px 16px rgba(245,197,51,.2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-family:var(--body);font-weight:800}
.row{display:flex;gap:8px}.row>*{flex:1}

/* game screen */
.frame.game{padding:8px;gap:8px;overflow:hidden}
.field{position:relative;flex:1;min-height:300px;background:radial-gradient(120% 70% at 50% 100%,#14306b,var(--night) 70%);border:1px solid var(--line);border-radius:18px;overflow:hidden;touch-action:manipulation}
.field canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.cat{position:absolute;top:10px;left:10px;font-family:var(--body);font-weight:800;font-size:1rem;background:rgba(8,19,48,.82);border:1px solid rgba(245,197,51,.6);color:var(--gold-hi);padding:6px 12px;border-radius:12px;pointer-events:none;backdrop-filter:blur(4px)}
.cat small{display:block;font-size:.58rem;color:var(--muted);letter-spacing:.14em;font-weight:800}
.clockbox{position:absolute;top:8px;right:8px;text-align:right;pointer-events:none;background:rgba(8,19,48,.28);border:1px solid rgba(201,211,230,.08);border-radius:10px;padding:4px 8px;opacity:.72}
.clock{font-family:var(--display);font-size:.95rem;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.score{font-size:.48rem;color:var(--muted);letter-spacing:.14em;font-weight:800}
.pts{font-family:var(--display);font-size:1.15rem;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.pts.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.3)}}
.word{min-height:52px;background:rgba(8,19,48,.8);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:1.6rem;letter-spacing:.14em;padding:2px 10px;overflow-wrap:anywhere;color:var(--gold-hi)}
.word:empty::before{content:attr(data-ph);font-family:var(--body);font-weight:600;font-size:.88rem;letter-spacing:0;color:var(--muted)}
.word.ok{border-color:var(--good);color:var(--good);box-shadow:0 0 0 3px rgba(95,211,141,.15)}
.word.no{border-color:var(--bad);color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.l1{color:var(--t1)}.l2{color:var(--t2)}.l3{color:var(--t3)}
canvas.mini{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto}
.say{font-family:var(--display);color:var(--gold-hi);text-align:center;font-size:1.5rem}
.card{background:var(--raise);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:700}tr:last-child td{border-bottom:0}
th{font-size:.66rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.win td{color:var(--gold-hi)}
.missed{font-size:.85rem;line-height:1.8;margin:6px 0 0;font-weight:700}
@media (prefers-reduced-motion:reduce){.word.no,.pts.bump{animation:none}}
/* LingoSapien brand */
.ls-logo{display:block}
.brandfoot{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:2px;padding:10px 0 2px;opacity:.92}
.brandfoot .ls-logo{width:30px;height:30px;filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
.brandfoot span{font-family:"Sora",var(--body);font-size:1.15rem;line-height:1;color:#fff;letter-spacing:-.01em;text-shadow:0 0 10px rgba(255,255,255,.25)}
.brandfoot b{font-weight:800}.brandfoot i{font-style:normal;font-weight:300}
.wm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;opacity:.07}
.wm .ls-logo{width:min(46%,220px);height:auto}
.wm span{font-family:"Sora",var(--body);font-size:clamp(1.4rem,7vw,2.4rem);color:#fff;letter-spacing:-.01em}
.wm b{font-weight:800}.wm i{font-style:normal;font-weight:300}


.sapi-mag{filter:drop-shadow(0 0 2px #7dd3fc) drop-shadow(0 0 5px rgba(56,189,248,.7));animation:sapiMag 2.4s ease-in-out infinite}@keyframes sapiMag{50%{opacity:.55}}
.sapi.talk .sapi-core{animation:sapiCore .32s ease-in-out infinite alternate}@keyframes sapiCore{to{fill:#e0f2fe}}
.si-bot .sapi-smile{stroke:#f5c533}.si-bot .sapi-mouth rect,.si-bot .sapi-core{fill:#f5c533}
.si-bot .sapi-eye rect{fill:#f5c533}.si-bot .sapi-eye circle{fill:#fff3c4;opacity:.9}.si-bot .sapi-happy path{stroke:#f5c533}
.si-bot .sapi-eyes,.si-bot .sapi-happy{filter:drop-shadow(0 0 2px #fff3c4) drop-shadow(0 0 6px #f5c533) drop-shadow(0 0 12px rgba(217,130,43,.85))}
.si-bot{transform:translate(-50%,-100%)!important;transform-origin:50% 100%}

.si-bot.tf1 .sapi-bob,.si-bot.tf1 .sapi-arm,.si-bot.tf1 .sapi-jet,.si-bot.tf1 .sapi-tip,.si-bot.tf1 .sapi-eye,.si-bot.tf1 .sapi-ant{animation:none!important}

.si-bot.tf1 .sapi-jet{opacity:0;transition:opacity .2s}.si-bot .tf-gone{opacity:0}
.si-bot.tf2 .sapi-arml{transform-origin:50% 50%;animation:siArmL .38s cubic-bezier(.7,0,.3,1.2) forwards!important}

.tf-body{transition:rx .34s steps(5),ry .34s steps(5)}.tf-visor,.sapi-eyes{transform-box:fill-box}

.sapi-bob{animation:sapiBob 3.2s ease-in-out infinite;transform-origin:60px 80px}.sapi-shadow{animation:sapiShadow 3.2s ease-in-out infinite;transform-origin:60px 145px}

.sapi.wave .sapi-armr{animation:sapiWave .5s ease-in-out 3 alternate}
.sapi-ringl{font:800 11px "Archivo Black",sans-serif;fill:#fff;fill-opacity:calc(.2 + var(--rg,0)*.75)}.sapi-ringf .sapi-ringl{paint-order:stroke;stroke:rgba(42,49,96,.5);stroke-width:1.1px}.sapi-ringb .sapi-ringl{fill-opacity:calc(.08 + var(--rg,0)*.38)}
@keyframes sapiBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sapiShadow{0%,100%{transform:scaleX(1);opacity:.2}50%{transform:scaleX(.8);opacity:.12}}

</style>

function lemma(w,map){

}

/* spelling key: upper case, accents folded (Spanish keeps Ñ, German keeps Ä Ö Ü ß) */
function gkey(w,l){
  let u=l==="de"?[...w].map(c=>c==="ß"?"ß":c.toUpperCase()).join(""):w.toUpperCase();
  u=u.replace(/Œ/g,"OE").replace(/Æ/g,"AE");
  const keep=l==="es"?"Ñ":l==="de"?"ÄÖÜß":"";
  return [...u].map(c=>keep.includes(c)?c:c.normalize("NFD").replace(/[̀-ͯ]/g,"")).join("");
}

  $("#go").onclick=()=>{readNames();newRound()};
  app.querySelectorAll("input").forEach(e=>e.oninput=()=>{readNames();grSave("setup")});
}
function readNames(){S.names.forEach((_,i)=>{const e=$("#n"+i);if(e&&e.value.trim())S.names[i]=e.value.trim().slice(0,14)})}
function newRound(){S.seed=(Math.random()*1e9)|0;S.turn=0;S.results=[];ready()}

function ready(){grSave("ready",GRX);const rx=GRX;
  app.className="frame";
  app.innerHTML=`<div style="margin-top:auto"><canvas class="mini" width="16" height="16"></canvas></div><div class="say">${tr("Ready, {n}?",S.names[S.turn])}</div>
  <p class="sub">${GLANGS.find(x=>x[0]===S.lang)[1]} · <b style="color:var(--gold)">${catLabel(S.cat)}${isVerb()?" · "+tr("verbs"):isAdj()?" · "+tr("adjectives"):""}</b> · ${S.mins} ${tr("minutes")}${S.players>1?"<br>"+tr("Everyone gets the same letter stream"):""}${rx?`<br><b style="color:var(--gold)">${tr("Resume")} · ${rx.left/60|0}:${String(rx.left%60).padStart(2,"0")} · ${rx.pts} ${tr("POINTS")}</b>`:""}</p>
  <button class="btn" id="go" style="margin-bottom:auto">${tr("I'M READY")}</button>`;
  miniBot();$("#go").onclick=()=>{GRX=null;play(rx)};
}

/* every accepted spelling of each category word -> its singular entry (CAT, CATS -> CAT) */
function formsOf(map,lang){
  const F=new Map(),add=(f,l)=>{if(!F.has(f))F.set(f,l)};
  if(lang&&lang!=="en"){
    for(const l of map.keys()){
      const fs=[l];
      if(lang==="es"){if(/[AEIOU]$/.test(l))fs.push(l+"S");else if(/Z$/.test(l))fs.push(l.slice(0,-1)+"CES");else if(!/S$/.test(l))fs.push(l+"ES")}
      if(lang==="fr"){if(/(AU|EU)$/.test(l))fs.push(l+"X");else if(/AL$/.test(l))fs.push(l.slice(0,-2)+"AUX",l+"S");else if(!/[SXZ]$/.test(l))fs.push(l+"S")}
      if(lang==="de")["E","EN","N","ER","S"].forEach(s=>fs.push(l+s));
      for(const f of fs){add(f,l);if(lang==="de"){const a=f.replace(/Ä/g,"AE").replace(/Ö/g,"OE").replace(/Ü/g,"UE").replace(/ß/g,"SS");if(a!==f)add(a,l)}}
    }
    return F;
  }
  for(const l of map.keys()){
    add(l,l);
    if(/(S|X|Z|CH|SH)$/.test(l))add(l+"ES",l);
    else if(/[^AEIOU]Y$/.test(l))add(l.slice(0,-1)+"IES",l);
    else if(/O$/.test(l)){add(l+"S",l);add(l+"ES",l)}
    else add(l+"S",l);
    if(/F$/.test(l))add(l.slice(0,-1)+"VES",l);
    if(/FE$/.test(l))add(l.slice(0,-2)+"VES",l);
  }
  for(const k in IRR)if(map.has(IRR[k]))add(k,IRR[k]);
  return F;
}

function play(rx){
  const map=curMap(),words=[...map.keys()],FORMS=S.mode!=="nouns"?(S.lang==="de"?new Map([...map.keys()].flatMap(w=>{const a=w.replace(/Ä/g,"AE").replace(/Ö/g,"OE").replace(/Ü/g,"UE").replace(/ß/g,"SS");return a!==w?[[w,w],[a,w]]:[[w,w]]})):new Map([...map.keys()].map(w=>[w,w]))):formsOf(map,S.lang),R=rngOf(S.seed);
  app.className="frame game";
  app.innerHTML=`<div class="field" id="field"><div class="wm" aria-hidden="true">${LS_LOGO("lsw")}${LS_WORD}</div><canvas id="cv"></canvas>
      <div class="clockbox"><div class="clock" id="clk"></div><div class="pts" id="sc">0</div><div class="score">${tr("POINTS")}</div></div></div>
    <div class="word" id="w" aria-live="polite" data-ph="${tr("Tap the rising letters to spell a word")}"></div>`;
  const field=$("#field"),cv=$("#cv"),cx=cv.getContext("2d"),W=$("#w");
  let w=0,h=0,dpr=1;
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);w=field.clientWidth;h=field.clientHeight;cv.width=w*dpr;cv.height=h*dpr};
  size();const ro=new ResizeObserver(size);ro.observe(field);

  const coins=[],decor=[],puffs=[],pops=[];
  let cur="",found=new Map(rx&&rx.found||[]),pts=rx?rx.pts|0:0,left=rx&&rx.left>0?rx.left:S.mins*60,over=false,pending=null,lastTap={x:w/2,y:h/2};
  const bot={x:w/2,dir:1,t:0,y:0,mood:"",moodT:0,turn:1.2,step:0};
  let queue=[],emitT=0,decorT=0,last=performance.now(),recent=[];
  const PX=3;
  const RAD=Math.max(19,Math.min(25,w/18));
  const GAP=6;

  /* Letter stream: every 20 s cycle releases all 26 letters at least once, in random order,
     mixed with letters from real category words so words are always formable. */
  const ABC=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ",...XL[S.lang]],CYCLE=15,RATE=.24;
  let gt=0;const lastOut={};
  shuffle([...ABC],R).forEach((c,i)=>lastOut[c]=-(i/26)*CYCLE*.7);          // stagger so letters aren't all due together
  const fromWords=()=>{if(!queue.length){const t=words[R()*words.length|0];queue=shuffle([...t],R)}return queue.shift()};
  const nextLetter=()=>{
    const byAge=[...ABC].sort((x,y)=>lastOut[x]-lastOut[y]);
    let ch=byAge.find((c,i)=>lastOut[c]+CYCLE-gt<=(i+3)*RATE*1.5);           // a letter is close to its 20 s deadline: send it now
    if(!ch)ch=R()<.55?fromWords():byAge[R()*8|0];                            // otherwise mix word letters with long-unseen ones
    lastOut[ch]=gt;return ch;
  };

  /* ---------- automatic word detection ---------- */
  const open=f=>!found.has(FORMS.get(f));
  const isPrefix=s=>{for(const f of FORMS.keys())if(f.startsWith(s)&&open(f))return true;return false};
  const canGrow=s=>{const me=FORMS.get(s);for(const f of FORMS.keys())if(f.length>s.length&&f.startsWith(s)&&open(f)&&FORMS.get(f)!==me)return true;return false};  // plurals of the same word don't count as 'longer'
  const showCur=(cls="")=>{W.className="word "+cls;W.textContent=cur};
  function commit(s){
    const lem=FORMS.get(s),lv=map.get(lem);
    found.set(lem,lv);pts+=lv;$("#sc").textContent=pts;wordTimes.push(gt);if(lv===3)advCount++;
    pops.push({x:lastTap.x,y:lastTap.y,t:0,txt:"+"+lv,col:["","#5fd38d","#58b4ff","#d58bff"][lv]});
    $("#sc").classList.remove("bump");void $("#sc").offsetWidth;$("#sc").classList.add("bump");
    bot.mood="happy";bot.moodT=.8;
    cur="";W.className="word ok";W.textContent=show(lem);
    clearTimeout(showCur.t);showCur.t=setTimeout(()=>showCur(),500);
  }
  /* Tapped letters stay in the row until they finish a word. The word can sit at the END of the row,
     so stray taps before it don't matter: RRAT scores RAT, then the whole row clears. */
  let pendingWord=null,wordTimes=[],advCount=0;
  const MAXROW=20;
  function wordAtEnd(){for(let i=0;i<cur.length;i++){const t=cur.slice(i);if(t.length>1&&FORMS.has(t)&&open(t))return t}return null}  // longest first
  function armPending(word){                           // e.g. CAT could still become CATS or CATERPILLAR: wait a moment
    pendingWord=word;const snap=cur;
    pending=setTimeout(()=>{if(cur===snap&&pendingWord===word){pendingWord=null;commit(word)}},1100);
  }
  function tapLetter(ch){
    clearTimeout(showCur.t);clearTimeout(pending);pending=null;
    const prev=pendingWord;pendingWord=null;
    cur=(cur+ch).slice(-MAXROW);
    const hit=wordAtEnd();
    if(hit){if(canGrow(hit)){armPending(hit);showCur()}else commit(hit);return}
    if(prev){
      if(isPrefix(prev+ch)){armPending(prev);showCur();return}               // still heading toward a longer word
      commit(prev);cur=ch;return;                                          // that letter didn't extend it: score the word, keep the new letter
    }
    showCur();
  }
  showCur();

  /* ---------- the spray ---------- */
  function pickTarget(){                               // spread across the full width, away from recent coins
    let best=0,bd=-1;
    for(let k=0;k<6;k++){const x=RAD+R()*(w-2*RAD);const d=Math.min(999,...recent.map(r=>Math.abs(r-x)));if(d>bd){bd=d;best=x}}
    recent.push(best);if(recent.length>4)recent.shift();return best;
  }
  function emit(){
    const hx=bot.x,hy=h-16*PX-bot.y+3*PX;
    if(coins.some(c=>Math.hypot(c.x-hx,c.y-hy)<RAD*2+GAP))return false;   // wait until the mouth is clear
    coins.push({ch:nextLetter(),x:hx,y:hy,tx:pickTarget(),r:RAD,vy:-(h/9.5),ph:R()*6.28,born:0});
    bot.mood="open";bot.moodT=.15;return true;
  }
  function emitDecor(){
    const hx=bot.x,hy=h-14*PX-bot.y;
    decor.push({star:R()<.4,x:hx,y:hy,tx:R()*w,vy:-(h/6)*(.7+R()*.6),s:R()<.4?5+R()*4:2+R()*2,ph:R()*6.28});
  }
  function separate(){
    const min=RAD*2+GAP;
    for(let it=0;it<3;it++)for(let i=0;i<coins.length;i++)for(let j=i+1;j<coins.length;j++){
      const a=coins[i],b=coins[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d<min){if(d<.01){dx=1;dy=0;d=1}const p=(min-d)/2,ux=dx/d,uy=dy/d;
        a.x-=ux*p;a.y-=uy*p;b.x+=ux*p;b.y+=uy*p;
        a.tx-=ux*p;b.tx+=ux*p}
    }
    for(const c of coins){c.x=Math.max(c.r,Math.min(w-c.r,c.x));c.tx=Math.max(c.r,Math.min(w-c.r,c.tx))}
  }

  function drawCoin(c){
    const {x,y,r}=c;cx.globalAlpha=Math.min(1,c.born*5);
    cx.shadowColor="rgba(245,197,51,.5)";cx.shadowBlur=12;
    cx.fillStyle="#f5c533";cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.shadowBlur=0;
    cx.lineWidth=Math.max(2,r*.12);cx.strokeStyle="#d9822b";cx.beginPath();cx.arc(x,y,r*.8,0,7);cx.stroke();
    cx.fillStyle="#fff3c4";cx.beginPath();cx.arc(x,y,r*.68,0,7);cx.fill();
    cx.fillStyle="#0c1a3a";cx.font=`${r*1.05}px "Archivo Black", "Arial Black", Arial, sans-serif`;cx.textAlign="center";cx.textBaseline="middle";
    cx.fillText(c.ch,x,y+r*.05);cx.globalAlpha=1;
  }
  function drawStar(x,y,s){cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?s*.45:s;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.fill()}

  function frame(now){
    if(over)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;gt+=dt;
    const margin=8*PX+6;bot.t+=dt;
    bot.x+=bot.dir*w*.24*dt;
    bot.turn-=dt;if(bot.turn<=0){bot.dir*=-1;bot.turn=.6+Math.random()*1.6}            // zig-zag: turn back at random points
    if(bot.x>w-margin){bot.x=w-margin;bot.dir=-1;bot.turn=.6+Math.random()*1.6}if(bot.x<margin){bot.x=margin;bot.dir=1;bot.turn=.6+Math.random()*1.6}
    bot.step=(bot.t*9|0)%2+1;bot.y=bot.step===1?1:0;                      // running: legs alternate, tiny bob, feet on the ground
    if(bot.moodT>0){bot.moodT-=dt;if(bot.moodT<=0)bot.mood=""}
    // color drifts slowly: green with pace (words in the last 30 s), neon with advanced words found
    const pace=wordTimes.filter(t=>t>gt-30).length;
    const tg=Math.min(1,pace/6)*.75,tn=Math.min(1,advCount/6)*.9;
    bot.g=(bot.g||0)+(tg-(bot.g||0))*Math.min(1,dt*.35);bot.n=(bot.n||0)+(tn-(bot.n||0))*Math.min(1,dt*.35);
    emitT-=dt;if(emitT<=0)emitT=emit()?RATE:.03;
    decorT-=dt;if(decorT<=0){decorT=.16;emitDecor()}

    cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
    cx.fillStyle="#f5c533";
    for(let i=decor.length-1;i>=0;i--){const d=decor[i];d.x+=(d.tx-d.x)*Math.min(1,dt*1.8);d.y+=d.vy*dt;
      if(d.y<-10){decor.splice(i,1);continue}
      cx.globalAlpha=d.star?.55:.35+.35*Math.sin(now/120+d.ph);
      if(d.star)drawStar(d.x,d.y,d.s);else cx.fillRect(d.x,d.y,d.s,d.s)}
    cx.globalAlpha=1;
    for(const c of coins){c.born+=dt;c.x+=(c.tx-c.x)*Math.min(1,dt*(c.born<.6?4:2.4))+Math.sin(now/600+c.ph)*6*dt;c.y+=c.vy*(1+2.5*Math.exp(-c.born*5))*dt}
    separate();
    for(let i=coins.length-1;i>=0;i--){const c=coins[i];
      if(c.y-c.r<=0){puffs.push({x:c.x,y:4,t:0,col:"#c9d3e6"});coins.splice(i,1);continue}   // touched the ceiling: gone
      drawCoin(c)}
    for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.t+=dt;if(p.t>.35){puffs.splice(i,1);continue}
      cx.globalAlpha=1-p.t/.35;cx.fillStyle=p.col;const d=p.t*70;
      for(let k=0;k<8;k++){const a=k*Math.PI/4;cx.fillRect(p.x+Math.cos(a)*d-2,p.y+Math.sin(a)*d-2,4,4)}}
    cx.globalAlpha=1;
    paintBot(cx,Math.round(bot.x-8*PX),Math.round(h-16*PX-bot.y),PX,bot.mood,{g:bot.g,n:bot.n},bot.step);
    for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;if(p.t>1.1){pops.splice(i,1);continue}
      cx.globalAlpha=Math.min(1,(1.1-p.t)*2.5);cx.font=`700 ${34+p.t*10}px "Archivo Black", "Arial Black", Arial, sans-serif`;cx.textAlign="center";
      cx.lineWidth=5;cx.strokeStyle="#0c1a3a";cx.strokeText(p.txt,p.x,p.y-p.t*60);cx.fillStyle=p.col;cx.fillText(p.txt,p.x,p.y-p.t*60)}
    cx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  let started=false;const begin=()=>{started=true;for(let k=0;k<3;k++)puffs.push({x:bot.x,y:h-8*PX,t:-k*.08,col:k?"#c9d3e6":"#ffffff"});requestAnimationFrame(t=>{last=t;frame(t)})};

  cv.addEventListener("pointerdown",e=>{
    const b=cv.getBoundingClientRect(),px=e.clientX-b.left,py=e.clientY-b.top;
    let hit=-1,bd=1e9;
    coins.forEach((c,i)=>{const d=Math.hypot(c.x-px,c.y-py);if(d<c.r*1.3&&d<bd){bd=d;hit=i}});
    if(hit<0)return;
    const c=coins.splice(hit,1)[0];lastTap={x:c.x,y:c.y};
    puffs.push({x:c.x,y:c.y,t:0,col:"#f5c533"});
    tapLetter(c.ch);
  });

  $("#sc").textContent=pts;
  const tick=()=>{if(!$("#clk"))return;if(!over)grSave("play",{left,pts,found:[...found]});const m=left/60|0,s=left%60;$("#clk").textContent=`${m}:${String(s).padStart(2,"0")}`;$("#clk").classList.toggle("low",left<=15)};
  tick();
  let iv=0;const runClock=()=>{iv=setInterval(()=>{left--;tick();
    if(left<=0){clearInterval(iv);clearTimeout(pending);
      if(pendingWord)commit(pendingWord);
      over=true;ro.disconnect();S.results.push({name:S.names[S.turn],pts,found:[...found]});S.turn++;S.turn<S.players?ready():results()}},1000)};
  sapiIntro(field,bot.x,h-8*PX,()=>{begin();runClock()});
}

function results(){grSave("results");
  app.className="frame";
  const r=[...S.results].sort((a,b)=>b.pts-a.pts),map=curMap();
  const all=new Set(r.flatMap(x=>x.found.map(f=>f[0])));
  const missed=shuffle([...map.keys()].filter(w=>!all.has(w))).slice(0,12).sort((a,b)=>map.get(a)-map.get(b));
  const tie=S.players>1&&r[1]&&r[1].pts===r[0].pts;
  const lv=(x,l)=>x.found.filter(f=>f[1]===l).length;
  app.innerHTML=`<canvas class="mini" width="16" height="16"></canvas><div class="say">${S.players>1?(tie?tr("It's a tie!"):tr("{n} wins!",r[0].name)):tr("Time's up! {n} points",r[0].pts)}</div>
  <div class="card" style="overflow-x:auto"><table><tr><th>${tr("Player")}</th><th>${tr("Words")}</th><th class="l1">${tr("B")}</th><th class="l2">${tr("I")}</th><th class="l3">${tr("A")}</th><th>${tr("Pts")}</th></tr>
  ${r.map((x,i)=>`<tr class="${i===0&&S.players>1&&!tie?"win":""}"><td>${x.name}</td><td>${x.found.length}</td><td>${lv(x,1)}</td><td>${lv(x,2)}</td><td>${lv(x,3)}</td><td>${x.pts}</td></tr>`).join("")}</table></div>
  ${r.map(x=>`<div><label>${tr("{n}'s words",x.name)}</label><p class="missed">${x.found.map(([f,l])=>`<span class="l${l}">${show(f)}</span>`).join(" · ")||tr("None this time")}</p></div>`).join("")}
  <div><label>${tr("Some words to try next time")}</label><p class="missed">${missed.map(w=>`<span class="l${map.get(w)}">${show(w)}</span>`).join(" · ")}</p></div>
  <div class="row"><button class="btn ghost" id="menu">${tr("MENU")}</button><button class="btn" id="again">${tr("NEW ROUND")}</button></div>`;
  miniBot("happy");
  $("#menu").onclick=setup;$("#again").onclick=newRound;
}
(document.fonts?Promise.all([document.fonts.load('700 20px "Manrope"'),document.fonts.load('20px "Archivo Black"')]).catch(()=>{}):Promise.resolve()).finally(()=>{const g=grLoad();
  if(g&&g.S&&GLANGS.some(x=>x[0]===g.S.lang)){Object.assign(S,g.S);if(!catKeys().includes(S.cat))return setup();
    if(g.scr==="play"&&g.x&&g.x.left>0){GRX=g.x;return ready()}
    if(g.scr==="ready")return ready();
    if(g.scr==="results"&&S.results&&S.results.length)return results()}
  setup()});
</script>

</body></html>
